singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //*[contains(@class,'product-description__title')]

  - name: listing_id
    xpath: //*[contains(text(), 'offerId')]
 
  - name: original_price
    xpath: //*[contains(@class, 'price__main')]
 
  - name: platform_category
    xpath: //*[contains(@class, 'breadcrumbs__content')]//*//*[last()-2]//a
 
  - name: product_variations
    xpath: //a[contains(@class, 'col-auto product-variants__item')]/@href
 
  - name: main_image
    xpath: //*[contains(@class,'-product swiper-slide-active')]//*/@src
    downloadContent: 'text'
 
  - name: alternative_images
    xpath: //*[contains(@class, "swiper-slide js-zoom-image image-zoom -product")][not(contains(@class, "active"))]//*/@src
 
  - name: description
    xpath: //*[@class = "product-description__text"]
 
  - name: materials
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "MATERIAŁ:") and not(contains(@class, "-header"))]

  - name: colour
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "KOLOR:") and not(contains(@class, "-header"))]

  - name: dimensionsField
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "WYMIARY:") and not(contains(@class, "-header"))]

  - name: sizeField
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "ROZMIARY:") and not(contains(@class, "-header"))]

  - name: volume
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "POJEMNOŚĆ:") and not(contains(@class, "-header"))]
 
  - name: hightField
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "WYSOKOŚĆ:") and not(contains(@class, "-header"))] | //*[contains(@class, "product-description__info-row")][contains(., "DŁUGOŚĆ:") and not(contains(@class, "-header"))]
 
  - name: diameter
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "ŚREDNICA:") and not(contains(@class, "-header"))]
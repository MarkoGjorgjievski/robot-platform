singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //*[contains(@class,'product-description__title')] | //meta[contains(@property,'title')]/@content

  - name: listing_id
    xpath: //*[contains(@class, 'product-description__text -light')]
 
  - name: original_price
    xpath: //*[contains(@class, 'price__main')]
 
  - name: platform_category
    xpath: //*[contains(@class, 'breadcrumbs__content')]//*//*[last()-2]//a
 
  - name: product_variations
    xpath: //a[contains(@class, 'col-auto product-variants__item')]/@href
 
  - name: main_image
    xpath: //*[contains(@class, "swiper-slide js-zoom-image image-zoom -product")][1]//*/@src
    downloadContent: 'text'
 
  - name: alternative_images
    xpath: //*[contains(@class, "swiper-slide js-zoom-image image-zoom -product")][position() > 1]//*/@src
 
  - name: description
    xpath: //*[@class = "product-description__text"]
 
  - name: materials
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "Anyag:") or contains(., "ANYAG:") or contains(., "anyag:")][not(contains(@class, "-header"))]

  - name: colour
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "Szín:") or contains(., "SZÍN:") or contains(., "szín:")][not(contains(@class, "-header"))]

  - name: fieldSizes
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "MÉRETEK:") or contains(., "Méretek:") or contains(., "méretek:")][not(contains(@class, "-header"))]

  - name: fieldSize
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "MÉRET:") or contains(., "Méret:") or contains(., "méret:")][not(contains(@class, "-header"))]

  - name: volume
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "Űrtartalom:") or contains(., "ŰRTARTALOM:") or contains(., "űrtartalom:")][not(contains(@class, "-header"))]

  - name: capacity
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "KAPACITÁS:") or contains(., "kapacitás:") or contains(., "Kapacitás:")][not(contains(@class, "-header"))]

  - name: hightField
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "magasság:") or contains(., "Magasság:") or contains(., "MAGASSÁG:")][not(contains(@class, "-header"))] | //*[contains(@class, "product-description__info-row")][contains(., "HOSSZ:") or contains(., "Hossz:") or contains(., "hossz:")][not(contains(@class, "-header"))]
 
  - name: diameter
    xpath: //*[contains(@class, "product-description__info-row")][contains(., "átmérő:") or contains(., "Átmérő:") or contains(., "ÁTMÉRŐ:")][not(contains(@class, "-header"))]
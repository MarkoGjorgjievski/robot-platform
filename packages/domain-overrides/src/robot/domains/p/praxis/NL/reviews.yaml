singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[contains(@class, 'Results') and not(contains(@class, 'TotalResults'))]/table/tbody/tr
fields:
  - name:  body_content_review
    xpath: //td[contains(@class, 'ReviewText')]

  - name: location_of_reviewer
    xpath: //td[contains(@class, 'UserLocation')]

  - name: paint_name
    xpath: //td[contains(@class, 'OriginalProductName')]

  - name: ranking
    xpath: //td[@class='Rating depth_1']

  - name: reviewer_name
    xpath: //td[contains(@class, 'UserNickname')]

  - name: review_date
    xpath: //td[contains(@class, 'SubmissionTime')]

  - name: review_title
    xpath: //td[contains(@class, 'Title')]
    defaultValue: 'null'

  # - name: url

 
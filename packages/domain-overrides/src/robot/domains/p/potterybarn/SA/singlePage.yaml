singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: (//*[@class='acq-content-product']//h1)[1]

  - name: listing_id
    xpath: //link[@rel='canonical']/@href
    regExp: 'https://www.potterybarn.com.sa/en/(.+).html'
    regExpReplace: $1;

  - name: offer_price
    xpath: (//*[@class='price-amount'])[2]

  - name: original_price
    xpath: (//*[@class='price-amount'])[1]

  - name: platform_category
    xpath: //*[@id='rcs-ph-breadcrumb']//li[2]

  - name: product_variations

  - name: stock_availability
    defaultValue: 'yes'

  - name: main_image
    xpath: //*[@id='cloud-zoom-wrap']//img/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //*[contains(@class, 'slick-list') and contains(@class, 'draggable')]//img/@src
 
  - name: description
    xpath: //*[@class='content--description']//*[@class='field__content']

  - name: pack_size
    defaultValue: 1

  - name: user_reviews

  - name: average_rating

  - name: materials
  
  - name: colour
    xpath: //span[contains(text(), 'Color:')]/following-sibling::*

  - name: product_details
    xpath: //*[contains(@class,'dimensions-and-care')]//ul//li

  - name: dimensions_unit
    defaultValue:  'in'

  - name: height
    xpath: (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), 'high')])[1] | (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), '" h')])[1]

  - name: diameter
    xpath: (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), '" dia')])[1]
    regExp: '(\d+(\.\d+)?)\D*dia'
    regExpReplace: $1

  - name: depth
    xpath: (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), 'deep')])[1] | (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), '" d')])[1]

  - name:  width
    xpath: (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), 'wide')])[1] | (//*[contains(@class, 'c-accordion_content')]//li[contains(text(), '" w')])[1]

  - name:  length

  - name:  weight_unit
    defaultValue: 'lbs'

  - name: weight_raw
    xpath: (//li[contains(text(), 'Weight')])[1]
    regExp: 'Weight: (.+) pounds'
    regExpReplace: $1
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: listing_id
    xpath: //*[@type="application/ld+json"]
    jq: .sku
  
  - name: platform_category
    xpath: (//a[@data-purpose="productBreadcrumbs.link"])[1]/@data-name
  
  - name: main_image
    xpath: //*[@type="application/ld+json"]
    jq: .image
    downloadContent: 'text'
  
  - name: product_title
    xpath: //*[@type="application/ld+json"]
    jq: .name

  - name: alternative_images
    xpath: //div[@data-purpose="imageSlider.thumbnail"]//img/@src
  
  - name: description
    xpath: (//div[@data-testid="text"])[1]
  
  - name: dimensionsDescription
    xpath: (//div[@data-purpose="productDetailPage.data.rightContainer"]//div[@data-purpose="product.productAttributes"])[1]//text()
    regExp: '([\D\S]+(?:\/([\D\S]+))?(?:\/([\D\S]+))?):'
    regExpReplace: $1

  - name: dimensionsText
    xpath: (//div[@data-purpose="productDetailPage.data.rightContainer"]//div[@data-purpose="product.productAttributes"])[1]//text()
    regExp: ([\d,]{3,}(?:\/([\d,]{3,}))?(?:\/([\d,]{3,}))?)
    regExpReplace: $1
 
  - name: dimensions_unit
    defaultValue: 'cm'
  
  - name: product_details
    xpath: //section[@data-purpose="modal.body"]
  
  - name: original_price
    xpath: //*[@type="application/ld+json"]
    jq: .offers.price
  
  - name: product_variations
    xpath: //div[@data-purpose="product.variantGroup"]//a/@href
    regExp: (.+)
    regExpReplace: https://www.poco.de$1
  
  - name: stock_availability
    defaultValue: "yes"
  
  - name: colour
    xpath: //section[@data-purpose='modal.body']
  
  - name: materials
    xpath: //section[@data-purpose='modal.body']//li//*[contains(text(), 'aterial')]/ancestor::li/ul//text() 
  
  - name: pack_size
    defaultValue: "1"
  
  - name: user_reviews
    defaultValue: null
  
  - name: average_rating
    defaultValue: null


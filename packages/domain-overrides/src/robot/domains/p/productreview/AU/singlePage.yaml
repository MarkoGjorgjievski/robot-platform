singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "enable-container-query")][not(@__extracted)]
fields:
  - name: review_id
    xpath: div/@id
    regExp: review-([\w-]+)
    regExpReplace: https://www.productreview.com.au/reviews/$1
  - name: review_title
    xpath: .//h3
  - name: review_body
    xpath: .//h3/parent::*/text()[1]
  - name: username
    xpath: .//span/span[contains(@data-track-ga-click, "link_to_profile")]
  - name: review_date
    xpath: .//span/following-sibling::div[contains(@style, "--pr-rating-score:")]/time/@datetime
  - name: rating
    xpath: .//span/following-sibling::div[contains(@style, "--pr-rating-score:")]/@style
    regExp: '\d+'
  - name: location
    xpath: .//span/span[contains(@data-track-ga-click, "link_to_profile")]/following-sibling::small
  - name: helpfulness_count
    xpath: .//button[@data-show-likes]
    regExp: '-?[\d]+'
  - name: tags
    xpath: .//span/following-sibling::div[contains(@style, "--pr-rating-score:")]/time/following-sibling::span/text()
  - name: response_text #not found
    xpath: //div[contains(@class, "enable-container-query")]//div[contains(@id, "comment")]
  - name: response_date #not found
    xpath: //div[contains(@class, "enable-container-query")]//div[contains(@id, "comment")]//time/@datetime
  - name: trustscore #not for this page
  - name: images #not for this page




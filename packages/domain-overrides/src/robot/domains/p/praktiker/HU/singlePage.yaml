singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //script[@id="event-data"]
    jq: '.[]|select(.event=="productView").ecommerce.detail.products[].name'
  
  - name: listing_id
    xpath: //script[@id="event-data"]
    jq: '.[]|select(.event=="productView").ecommerce.detail.products[].id'
  
  - name: original_price
    defaultValue: 'null'
  
  - name: offer_price
    defaultValue: 'null'

  - name: price
    xpath: //script[@id="event-data"]
    jq: '.[]|select(.event=="productView").ecommerce.detail.products[].price'
  
  - name: list_price
    xpath: //script[@id="event-data"]
    jq: '.[]|select(.event=="productView").ecommerce.detail.products[].listPrice'

    
  
  - name: platform_category
    xpath: //ol[contains(@role, "list")]/li[last()]//a

  #  COULDN'T FIND 
  # - name: product_variations
    # xpath: 

  # easier to check if unavailable
  - name: stock_availability
    defaultValue: 'yes'
    xpath: //h3[contains(text(), "Nincs áruházi készleten")]
    regExp: (.+)
    regExpReplace: 'no'

  - name: main_image
    xpath: //div[contains(@class, "relative w-full")]//picture/img/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[contains(@class, "relative hidden")]//div[contains(@class, "swiper-slide")][position() > 1]//img/@src
    

  - name: description
    xpath: //div[contains(@class, "hidden md:block p-2")]//p[contains(@class, "prose-content")]
 
  - name: pack_size
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Szett tartalma")]/../text()
    regExp: (\d+)
    regExpReplace: $1
  
  - name: user_reviews
    xpath: //script[@id="event-data"]
    jq: '.[]|select(.event=="productView").ecommerce.detail.products[].ratingCount'
  
  - name: average_rating
    xpath: //script[@id="event-data"]
    jq: '.[]|select(.event=="productView").ecommerce.detail.products[].rating'


  - name: dimensions_unit
    defaultValue: "cm"

  - name: height
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Termék magassága")]/../text()
    regExp: '([\d.,]+)'
    regExpReplace: $1
    defaultValue: 'null'

  - name: height_backup
    xpath: //div[@id="tab-header-1"]/div[1]
    regExp: 'mérete:\s*([\d.,]+)x([\d.,]+)x([\d.,]+)cm'
    regExpReplace: $3
  
  - name: width
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Termék szélessége")]/../text()
    regExp: '([\d.,]+)'
    regExpReplace: $1
    defaultValue: 'null'

  - name: width_backup
    xpath: //div[@id="tab-header-1"]/div[1]
    regExp: 'mérete:\s*([\d.,]+)x([\d.,]+)x([\d.,]+)cm'
    regExpReplace: $2

    # Technically this is translated to "depth" but length is preffered and semantically equivalent
  - name: length
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Termék mélysége")]/../text()
    regExp: '([\d.,]+)'
    regExpReplace: $1
    defaultValue: 'null'

  - name: length_backup
    xpath: //div[@id="tab-header-1"]/div[1]
    regExp: 'mérete:\s*([\d.,]+)x([\d.,]+)x([\d.,]+)cm'
    regExpReplace: $1
    defaultValue: 'null'

  - name: length_backup2
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Mérete")]/../text()
    regExp: '([\d.,]+)'
    regExpReplace: $1
  - name: depth
    # xpath: 
  - name: diameter
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Mérete")]/../text()
    regExp: '([\d.,]+\s*(cm|mm))\s*átmérő'
    regExpReplace: $1  
    defaultValue: 'null'

  - name: diameter_backup
    xpath: //div[@id="tab-header-1"]/div[1]
    regExp: '[Áá]tmérő(je)?:?\s*([\d.,]+\s*(cm|mm))'
    regExpReplace: $2
    




  - name: weight_unit
    defaultValue: "kg"

  - name: weight_raw
    defaultValue: "null"
    # xpath: 

  - name: package_weights
    xpath: //div[@id= "tab-header-2"]//tbody/tr/td[3]
    regExp: ([\d.,]+)
    regExpReplace: $1


  - name: materials
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Anyag")]/../text() | //div[@id="tab-header-1"]//span[contains(text(), "anyaga")]/../text()

  - name: colour
    xpath: //div[@id="tab-header-1"]//span[contains(text(), "Szín")]/../text()

  - name: product_details
    xpath: //div[@id= "tab-header-1"]/div | //div[@id= "tab-header-2"]

  - name: currency
    # xpath: 
  
  - name: listing_url
    # xpath: 

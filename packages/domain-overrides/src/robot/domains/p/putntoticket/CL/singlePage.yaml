singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: > 
  //*[contains(@id,"calendarDate")][not(contains(text(), 'disabled'))] 
  | 
  //div[contains(@class, "card mb-15 border-0")][not(//div[@id="collapseOne"])] 
  |  
  //*[(contains(@class, "button-block col text-center") or contains(@class, "boton")) and not(contains(@class, "section-active"))][.//*[(contains(text(), 'COMPRA') or contains(text(), 'AGOTADO') or contains(text(), 'PRÓXIMAMENTE') or contains(text(), 'DISPONIBLE')) and not(contains(text(), 'CANCELADO'))]]
  |
  //*[contains(@class,"fecha depth_0")][//*[contains(@class,"tipoGroup depth_0")]]/..
  | 
  //*[contains(@class,"fecha depth_0")][//*[contains(@class,"horaFecha depth_0")]]/..
fields:
    - name: eventName
      xpath: ancestor::html//h1[contains(@class,"nombre-evento")] | ancestor::html//div[contains(@class, "nav-drop")]/strong
    - name: venueName
      xpath: ancestor::html//address[contains(@class,"mb-20")]//text() | ancestor::html//div[contains(@class, "nav-drop")]//dt[text() = "Lugar"]//following-sibling::dd
      regExp: '^[a-zA-Z\W\d]+'
    - name: venueCity
      xpath: ancestor::html//script[contains(@type,"application/ld+json")]
      jq: '.location | .address | .addressLocality'
    - name: venueAddress
      xpath: ancestor::html//script[contains(@type,"application/ld+json")]
      jq: '.location | .address | .streetAddress'
    - name: eventDateTime
      xpath: //span[contains(@class, "text-left")] 
    - name: isPublicPurchase
      xpath: > 
        //span[contains(@class, 'd-xl-block')]  
        | 
        //*[contains(text(), 'COMPRA') or contains(text(), 'AGOTADO') or contains(text(), 'PRÓXIMAMENTE') or contains(text(), 'DISPONIBLE')]
    - name: eventDateFromCalendar
      xpath: //*[contains(@id,"calendarDate")][not(contains(text(), 'disabled'))]//text()
      jq: '.key'
    - name: eventDateFromCalendarDuplicate
      xpath: //*[contains(@id,"calendarDateDuplicate")]//text()
      jq: '.key'
    - name: eventHourCount
      xpath: //*[contains(@id,"calendarDate")][not(contains(text(), 'disabled'))]//text()
      jq: '.hours'
    - name: scriptData
      xpath: ancestor::html//*[contains(@id,"scriptDate")]
    - name: eventHours
      xpath: > 
        ancestor::html//*[contains(@class,"mb-20")]//time[last()]/@datetime
        | 
        ancestor::html//div[contains(@class, "nav-drop")]//dt[text() = "Fecha"]//following-sibling::dd//descendant::* 
        | 
        ancestor::html//div[contains(@class, "nav-drop")]//dt[text() = "Hora"]//following-sibling::dd//descendant::* 
        | 
        ancestor::html//script[contains(@type,"application/ld+json")]
      regExp: '\d{1,2}:\d{2}'
    - name: eventButtonDate
      xpath: //div[contains(@class, "button-block col text-center")]//*[starts-with(name(), "h")]
    - name: eventDateNavbar
      xpath: ancestor::html//div[contains(@class, "nav-drop")]//dt[text() = "Fecha"]//following-sibling::dd//descendant::*
    - name: calendarIdCode
      xpath: ancestor::html//*[@title="Calendario"]/@src
      regExp: '(?<=calendarioevento\W).*$'
    - name: calendarDayId
      xpath: //*[contains(@class,"calendarios depth_0")]//*[contains(@class,"LISTITEM_0 depth_1")]
    - name: dateFromCalendarGet
      xpath: //*[contains(@class,"fecha depth_0")][//*[contains(@class,"horaFecha depth_0")]]
    - name: disabledFromCalendarGet
      xpath: //*[contains(@class,"categoriaLinkDeCompra depth_0")][//*[contains(@class,"horaFecha depth_0")]]//*//*[contains(@class,"disabled depth_1")]
      defaultValue: 'false'
    - name: eventURLParent
      xpath: ancestor::html//*[contains(@property, "url")]/@content
    - name: isDateTimeTBA
      # xpath: //span[contains(@class, "text-left")]
      defaultValue: '1'
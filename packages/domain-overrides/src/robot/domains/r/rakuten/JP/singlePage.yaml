singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: brandText
  - name: name
    xpath: //meta[@property="og:title"]/@content
  - name: color
    xpath: //td[@class="inventory_choice_name"]/span
  - name: flavour
  - name: image
    xpath: //meta[@property="og:image"]/@content
  - name: pageTitle
    xpath: //meta[@property="og:title"]/@content
  - name: category
    xpath: //td[@class="sdtext"]|//ul[@class="c-breadcrumbs__list"]/li
  - name: subCategory
    xpath: //ul[@class="c-breadcrumbs__list"]/li[4]
  - name: reviewCount
    xpath: //meta[@itemprop="reviewCount"]/@content | //div[contains(@class,'review-total')]//div[contains(@class,'number-display')]
  - name: pageOffset
  - name: sku
    xpath: //div[@class="spux-settings-spu"]/@data-item-id|//input[@name='item_number']|//p[@class='itemNumberJT']
  - name: reviewsUrl
    xpath: //table[@data-ratid="ratReviewParts"]//a[contains(text(),"すべてのレビューを見る")]/@href | //div[contains(@class, "review-score")]/a/@href
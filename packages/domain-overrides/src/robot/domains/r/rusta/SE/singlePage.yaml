singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //input[@class='g-data-item']/@data-item
    jq: '.item_name'
  - name: listing_id
    xpath: //input[@class='g-data-item']/@data-item
    jq: '.item_id'
  - name: offer_price
    xpath: concat(//div[@class='price-tag']/span[@class='price sale']/text(), '.', //div[@class='price-tag']/span[@class='price sale']/span[@class='cents'])
  - name: original_price
    xpath: concat(//div[@class='price-tag']/span[@class='price']/text(), '.', //div[@class='price-tag']/span[@class='price']/span[@class='cents'])
  - name: discount_amount
    xpath: //input[@class='g-data-item']/@data-item
    jq: '.discount'
  - name: price_json
    xpath: //input[@class='g-data-item']/@data-item
    jq: '.price'
  - name: platform_category
    xpath: //div[@class='bread-crumbs page-product']/span[last()]/a/text()
  - name: product_variations
    xpath: //div[@class='types']//a[@class='dropdown-object']/@href
    regExp: (.+)
    regExpReplace: https://www.rusta.com$1
    defaultValue: null 
  - name: stock_availability
    xpath: //div[@class='availability-online']/p/text()
    jq: 'if . == "Finns i webblager" then 1 else 0 end'
    defaultValue: '0'
  - name: main_image
    xpath: //div[contains(@class, 'image primaryimage')]/a/@href
    regExp: (.+)
    regExpReplace: https://www.rusta.com$1
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, 'grid thumbnails--grid')]/div[@class='js-thumbnail-base']/a/@href
    regExp: (.+)
    regExpReplace: https://www.rusta.com$1
  - name: description
    xpath: string(//div[@id='productDescTab'])
  - name: pack_size
    defaultValue: 1
  - name: user_reviews
    defaultValue: '0'
  - name: average_rating
    defaultValue: null 
  - name: dimensions_unit
    defaultValue: 'cm'
  - name: height
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Höjd:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: diameter
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Diameter:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: depth
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Djup:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: width
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Bredd:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: length
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Längd:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: weight_unit
    defaultValue: 'kg'
  - name: volume
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Volym:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: weight_raw
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Vikt:')]]/span[2]/text()
    regExp: ([\d.,/\s]+)
    regExpReplace: '$1'
    defaultValue: 1
  - name: materials
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Material:')]]/span[2]/text()
    defaultValue: null
  - name: colour
    xpath: //div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Färg:')]]/span[2]/text()
    defaultValue: null
  - name: product_details
    xpath: concat(normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Användningsområde:')]]), '$%', normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Typ:')]]), '$%', normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Funktioner:')]]), '$%', normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Skötselråd:')]]), '$%', normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Övrigt:')]]), '$%', normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Garanti:')]]), '$%', normalize-space(//div[@id='specTab']/div[@class='infolist-item'][span[contains(text(), 'Bra att veta:')]]))
#    xpath: normalize-space(//div[contains(@class, 'product')]//ul[@class='usp'])

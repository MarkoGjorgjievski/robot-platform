singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: firstDepthURL
    singleValue: true
    xpath: (//body[not(a)]/pre[1])[1]
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://www.redfin.com$1'
  - name: listingStatusHeading
    xpath: '(//div[contains(@class,"label-and-claim-status")] | //*[@data-rf-test-id="sashContainer"])[1]'
  # - name: estimatedSalePrice
  #   xpath: '//*[@class="RedfinEstimateValueHeader"]/div[1]'
  - name: estimatedSalePrice
    xpath: '//*[contains(text(),"predicted_value")]'
    regExp: 'predicted_value[^,\d]*([\d.]+),'
    regExpReplace: $1
  - name: estimatedSalePriceCurrency
    xpath: '//script[@type="application/ld+json"][contains(text(),"Product")]'
    jq: '.offers.priceCurrency'
  - name: estimatedRentalPrice
    xpath: '//*[@id="rentalEstimate-collapsible"]//*[@class="sectionContent"]/p'
  # - name: estimatedSalePriceMin
  #   xpath: '//*[contains(@class,"sale-price-range")]'
  #   regExp: '([0-9.,\s]{2,})[–-]'
  - name: estimatedSalePriceMin
    xpath: '//*[contains(text(),"minExpandedSalePriceRange")]'
    regExp: 'minExpandedSalePriceRange[^,\d]*([\d.]+),'
    regExpReplace: $1
  # - name: estimatedSalePriceMax
  #   xpath: '//*[contains(@class,"sale-price-range")]'
  #   regExp: '[–-] \$([0-9.,\s]{2,})'
  - name: estimatedSalePriceMax
    xpath: '//*[contains(text(),"maxExpandedSalePriceRange")]'
    regExp: 'maxExpandedSalePriceRange[^,\d]*([\d.]+)}'
    regExpReplace: $1
  - name: listingStatusText
    xpath: '(//div[@class="secondary-info"] | //*[@class="ListingStatusBannerSection"])[1]'
  - name: thirdPartyOffers
    xpath: '//div[contains(@class,"OrSeparator")]/following-sibling::div[contains(@class,"seller-merch")]//div[contains(@class,"sale-price-range")]'
    #valueEstimate\\":{([^}]*)}
  - name: detailsStatus
    xpath: '//div[contains(@class,"keyDetail ")][.//*[contains(text(),"Status")]]//*[contains(@class,"content")] | //div[contains(@class,"table-row")][.//*[contains(text(),"Status")]]//*[contains(@class,"table-value")]'
  - name: detailsYearBuilt
    xpath: '//div[@class="keyDetailsList"]//*[contains(text(),"Built")]/following-sibling::*'
  - name: detailsLotSize
    # regExp: '[^—]'
    singleValue: true
    xpath: '(//div[contains(@class,"keyDetail ")][.//*[contains(text(),"Lot")]]//*[contains(@class,"content")] | //div[contains(@class,"table-row")][.//*[contains(text(),"Lot")]]//*[contains(@class,"table-value")])[1]'
  - name: detailsPropertyType
    xpath: '//div[contains(@class,"keyDetail ")][.//*[contains(text(),"Type")]]//*[contains(@class,"content")] | //div[contains(@class,"table-row")][.//*[contains(text(),"Type")]]//*[contains(@class,"table-value")]'
  - name: detailsCommunity
    xpath: '//div[contains(@class,"keyDetail ")][.//*[contains(text(),"Community")]]//*[contains(@class,"content")] | //div[contains(@class,"table-row")][.//*[contains(text(),"Community")]]//*[contains(@class,"table-value")]'
  - name: detailsMLSNumber
    xpath: '//div[contains(@class,"keyDetail ")][.//*[contains(text(),"MLS")]]//*[contains(@class,"content")] | //div[contains(@class,"table-row")][.//*[contains(text(),"MLS")]]//*[contains(@class,"table-value")]'
  - name: detailsAgentCommission
    xpath: '//div[contains(@class,"keyDetail ")][.//*[contains(text(),"Agent")]]//*[contains(@class,"content")] | //div[contains(@class,"table-row")][.//*[contains(text(),"Agent")]]//*[contains(@class,"table-value")]'
  - name: detailsPricePerSquareFoot
    # regExp: '\d*'
    xpath: '//div[@class="keyDetailsList"]//*[contains(text(),"Sq.")]/following-sibling::*'
  - name: publicBeds
    # regExp: '\d*'
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Beds")]/following-sibling::div'
  - name: publicBaths
    # regExp: '\d*'
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Baths")]/following-sibling::div'
  - name: publicSquareFeet
    regExp: '[\d,\s]*'
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Ft.")]/following-sibling::div'
  - name: publicStories
    # regExp: '\d*'
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Stories")]/following-sibling::div'
  - name: publicLotSize
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Lot")]/following-sibling::div'
  - name: publicStyle
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Style")]/following-sibling::div'
  - name: publicYearBuilt
    # regExp: '\d*'
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Built")]/following-sibling::div'
  - name: publicYearRenovated
    # regExp: '\d*'
    xpath: '//div[@class="facts-table"]//*[contains(text(),"Renovated")]/following-sibling::div'
  - name: publicCounty
    xpath: '//div[@class="facts-table"]//*[contains(text(),"County")]/following-sibling::div'
  - name: publicAPN
    xpath: '//div[@class="facts-table"]//*[contains(text(),"APN")]/following-sibling::div'
  - name: saleEvents
    xpath: '//*[@class="timeline-content"]//div[contains(@id, "propertyHistory-")]'
  - name: comparableRentalHomes
    xpath: '//div[contains(@id,"rentalEstimate")]//div[@class="CompHomeCardsCarousel"]//li'
    # //script[@type="application/ld+json"]'

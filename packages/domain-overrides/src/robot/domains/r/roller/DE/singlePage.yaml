singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[@class='Product_name']

  - name: listing_id
    xpath: (//*[contains(text(), 'Artikelnummer:')])[1]
    regExp: 'Artikelnummer: (.+)'
    regExpReplace: $1

  - name: offer_price
    xpath: (//div[@class='adp_container']//div[contains(@class, 'after-discount')]/span[1] |  //div[@class='adp_container']// span[@class='crossed-out'])[2]

  - name: original_price
    xpath: (//div[@class='adp_container']//div[contains(@class, 'after-discount')]/span[1] |  //div[@class='adp_container']// span[@class='crossed-out'])[1]
    defaultValue: '0'
  
  - name: platform_category
    xpath: //ol[@class='Breadcrumbs']//li[2]

  - name: product_variations
    xpath: //ul[@id='vs1__listbox']/li/a/@href
    regExp: (.+)
    regExpReplace: https://www.roller.de$1

  - name: stock_availability
    xpath: (//div[@class='adp_container']//div[contains(@class, 'after-discount')]/span[1] |  //div[@class='adp_container']// span[@class='crossed-out'])[1]
    regExp: (.+)
    regExpReplace: 'no'
    defaultValue: 'yes'

  - name: main_image
    xpath: ((//div[contains(@class, 'zoom-image-container')])[1]//img/@src)[1]
    regExp: (.+)
    regExpReplace: https://www.roller.de$1
    downloadContent: 'text'

  - name: alternative_images
    xpath: (//div[@class='thumbnail-item-wrapper']/img/@src)
    regExp: (.+)
    regExpReplace: https://www.roller.de$1

  - name: description
    xpath: //div[@id='tabProductDetails']/p[1]

  - name: pack_size
    xpath: //div[@class='tabHeader']//li[contains(text(), 'Pack')]
    regExp: 'im (.+)er-Pack'
    regExpReplace: $1
    defaultValue: '1'

  - name: user_reviews
    xpath: //div[@data-v-771a441e]//*[contains(text(), 'Bewertungen')]
    regExp: '(\d+) Bewertungen'
    regExpReplace: $1

  - name: average_rating
    xpath: //span[@id='countRatings']

  - name: height
    xpath: (//div[@class='tabHeader']//*[contains(text(), 'Maße')]) | (//li[contains(text(), 'Höhe:')] | //li[contains(text(), 'Maße')] | //li[contains(text(), 'Stellmaße')])[1]
    
  - name: width
    xpath: (//div[@class='tabHeader']//*[contains(text(), 'Maße')] | //li[contains(text(), 'Maße')] | //li[contains(text(), 'Stellmaße')])[1]
 
  - name: length 
    xpath: (//li[contains(text(), 'Länge:')])[1]

  - name: depth
    xpath: (//div[@class='tabHeader']//*[contains(text(), 'Maße')] | //li[contains(text(), 'Maße')] | //li[contains(text(), 'Stellmaße')])[1]

  - name: materials
    xpath: (//li[contains(text(), 'Material')][not(@id="__input")])

  - name: colour
    xpath: //li[contains(text(), 'Farbe:')]
    regExp: 'Farbe: (.+)'
    regExpReplace: $1

  - name: product_details
    xpath: //div[@id='tabProductDetails']


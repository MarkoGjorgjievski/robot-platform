singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1

  - name: listing_id
    xpath: //span[contains(@class, 'article-number')]
    regExp: \d+

  # - name: offer_price 

  - name: original_price
    xpath: //span[@data-ui-name='ads.price.strong']
  
  - name: platform_category
    xpath: //li[contains(@class, 'breadcrumb__dropdown__wrapper')]//a[contains(@class, 'active')]

  - name: product_variations
    xpath: //ul[contains(@class, "dropdown-menu")]//li[not(contains(@class,'disabled'))]/a/@href

  - name: stock_availability
    xpath: //a[contains(@class, 'js-add-to-cart')]
    regExp: A bevásárlókosárba
    regExpReplace: 'yes'
    defaultValue: 'no'    

  - name: main_image
    xpath: //div[@data-slick-index="0"]//div[contains(@class, "pinch-zoom-container")]//img/@src
    regExp: (.+)
    regExpReplace: 'https:$1'
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div//div[contains(@class, "slick-track")][1]//div[@data-slick-index!="0"][contains(@class, "ads-previewslider")]/a/img/@src
    regExp: (.+)
    regExpReplace: 'https:$1'

  - name: description
    xpath: //p[@data-ui-name="ads.description-text.product-details.p"]
  
  - name: pack_size
    xpath: //tr//td[contains(@data-label, "Tartalom")]
    regExp: \d+
    defaultValue: 1

  - name: user_reviews
    xpath: //div[contains(@class,'bv_numReviews_text')]
    regExp: \d+

  - name: average_rating 
    xpath: //div[contains(@class, 'bv_avgRating_component_container')]

  - name: weight_raw
    xpath: //tr//td[contains(@data-label, "Tömeg")]
    regExp: \d{1,3}(?:[,.]\d{3})*(?:[,.]\d+)?

  - name: weight_unit
    xpath: //tr//td[contains(@data-label, "Tömeg")]
    regExp: \b(?:kg|g)\b
    # regExpReplace: $1
    # defaultValue: 'kg'
    

  - name: height
    xpath: //tr//td[contains(@data-label, "Magasság")]
    regExp: \d{1,3}(?:[,.]\d{3})*(?:[,.]\d+)?

  - name: width
    xpath: //tr//td[contains(@data-label, "Szélesség")]  
    regExp: \d{1,3}(?:[,.]\d{3})*(?:[,.]\d+)?

  - name: length
    xpath: //tr//td[contains(@data-label, "Mélység")]
    regExp: \d{1,3}(?:[,.]\d{3})*(?:[,.]\d+)?

  - name: materials
    xpath: //tr//td[contains(@data-label, "Anyag") or contains(@data-label, "anyag") or contains(@data-label, "Huzat")]

  - name: colour
    xpath: //tr//td[contains(@data-label, "Szín") or contains(@data-label, "szín")] | //div[contains(@class, "child2")]//button[@data-toggle="dropdown"]//span[contains(@class, 'button__txt')]

  - name: product_details
    xpath: //div[contains(@class, 'overview__details')]
   
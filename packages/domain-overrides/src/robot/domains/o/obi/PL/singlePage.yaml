singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1
  - name: listing_id
    xpath: //section/span[contains(@class, "article-number")]
  - name: offer_price
    defaultValue: 0
  - name: original_price
    xpath: //strong[@data-ui-name="ads.price.strong"]
  - name: platform-category
    xpath: //section[contains(@class, "breadcrumb")]/ul/li[last()]/a/span
  - name: product_variations
    defaultValue: false
  - name: stock_availability
    defaultValue: '1'
  - name: main_image
    xpath: //div[@data-slick-index="0"]//div[contains(@class, "pinch-zoom-container")]//img/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div//div[contains(@class, "slick-track")][1]//div[contains(@class, "ads-previewslider")]/a/img/@src
  - name: description
    xpath: //p[contains(@data-ui-name,"product-details")]
  - name: pack_size
    xpath: //h1
  - name: user_reviews
    xpath: //dd[contains(@class, "bv-rating-ratio-count")]/a
  - name: average_rating
    xpath: //dd[contains(@class, "bv-rating-ratio-number")]//span[contains(@class, "bv-rating")]/span
  - name: dimensions_unit
    defaultValue: 'cm'
  - name: height
    xpath: //td[contains(@data-label, "Wysokość")]/span
  - name: width
    xpath: //td[contains(@data-label, "Szerokość")]/span
  - name: depth
    xpath: //td[contains(@data-label, "Głębokoś")]/span
  - name: diameter
    xpath: //p[contains(., "Średnica")]/text()[contains(., "Średnica")]
  - name: length
    xpath: //td[contains(@data-label, "G")]/span
  - name: weight_unit
    xpath: //td[contains(@data-label, "Waga")]/span/span/text()
  - name: weight_raw
    xpath: //td[contains(@data-label, "Waga")]/span/span/text()
  - name: colour
    xpath: //tr[2]//td[contains(@data-label, "kolor")]
  - name: materials
    xpath: //tr//td[contains(@data-label, "Materiał")] | //tr//td[contains(@data-label, "materiał")] | //li[contains(text(), "Materiał")]/text() | //p//*[contains(text(),'Materiał:')]/following-sibling::text()[1] | //p/text()[contains(., 'Materiał wykonania')] | //p/text()[contains(., 'materiał wykonania')] | //div/text()[contains(.,'Materiał:')]
  - name: volume
    xpath: //button[@data-toggle="dropdown"]/span/text()
  - name: currency
    defaultValue: PLN
  - name: product_variations
    xpath: //ul[contains(@class, "dropdown-menu")]/li/a/@href
  - name: product_details
    xpath: //td[contains(@data-label, "Obsługa")]/text() | //div[contains(@class, "overview__details")]//li/text()

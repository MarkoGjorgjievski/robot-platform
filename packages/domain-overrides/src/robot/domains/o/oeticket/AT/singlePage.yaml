singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null

fields:
  - name: eventName
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_name":"(.*?",)
    regExpReplace: $1
  - name: eventDate
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_date":"([^"]+)
    regExpReplace: $1
  - name: eventURL
    xpath: //meta[@property="og:url"]/@content
  - name: eventStatus
    xpath: //body/@eventStatus
  - name: eventStatusRaw
    xpath: //body/@eventStatusRaw
  - name: venueName
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_venue_name":"(.*?",)
    regExpReplace: $1
  - name: venueRaw
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_venue_name":"(.*?",)
    regExpReplace: $1
  - name: venueAddressRaw
    singleValue: false
    xpath: //body/@venueAddressRaw
  - name: venueAddress
    singleValue: false
    xpath: //body/@venueAddress1
  - name: venueAddress2
    singleValue: false
    xpath: //body/@venueAddress2
  - name: eventCategory
    xpath: //body/@eventcategory
  - name: eventCategoryURL
    xpath: //body/@eventCategoryURL
  - name: eventSubcategory
    xpath: //body/@eventSubcategory
  - name: eventSubcategoryURL
    xpath: //body/@eventSubcategoryURL
  - name: venueCity
    xpath: //body/@venueCityFromAddress | //body/@venueCity
  - name: postalCode
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_postal_code":"([^"]+)
    regExpReplace: $1
  - name: venueCountryCode
    xpath: //body/@venueCountryCode
  - name: isInternational
    xpath: //body/@isInternational
  - name: internationalEventUrl
    xpath: //body/@internationalEventUrl
  - name: isPublicPurchase
    singleValue: true
    xpath: //body/@isPublicPurchase
  - name: isPublicPurchaseRaw
    singleValue: true
    xpath: //body/@isPublicPurchaseRaw
  - name: isDateTimeTBA
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_date":"([^"]+)
    regExpReplace: No
    defaultValue: Yes
  - name: eventDateTime
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_date":"([^"]+)
    regExpReplace: $1
  - name: eventDateTimeRaw
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")]
    regExp: event_date":"([^"]+)
    regExpReplace: $1
  - name: eventTimeTxt
    xpath: //time[@data-qa="event-date"]
    defaultValue: dummy
  - name: EventTimeIn24HrTxt
  - name: ticketsPrices
    singleValue: true
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")] | //body/@ticketsPrices
    regExp: event_ticket_price":"([^"]+)
    regExpReplace: $1
  - name: ticketsMinPrice
    singleValue: true
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")] | //body/@ticketsPrices
    regExp: event_ticket_price":"([^"]+)
    regExpReplace: $1
  - name: ticketsMaxPrice
    singleValue: true
    xpath: //script[contains(string(),"window.dataLayer = window.dataLayer || [];") or contains(string(),"window.tc_vars =")] | //body/@ticketsPrices
    regExp: event_ticket_price":"([^"]+)
    regExpReplace: $1
  - name: eventSeriesURL
    xpath: //section[@data-c="eventstage2"]//a[@data-qa="backToPreviousPage"]/@href
    regExp: (.+)
    regExpReplace: https://www.oeticket.com$1

singleRecord: false
regionsSelector: null
recordSelector: null
# recordXPath: //table[contains(@id,'super-product-table')]//tbody/tr[not(contains(@class,'row-tier-price'))]
recordXPath: //table[contains(@id,'super-product-table')]//tbody/tr[not(contains(@class,'row-tier-price'))] | //table[contains(@id,'super-product-table')]//tbody/tr[contains(@class,'row-tier-price')]
# recordXPath: //table[contains(@id,'super-product-table')]//tbody/tr[contains(@class,'row-tier-price')]
fields:
  - name: brand
    xpath: ancestor::html//div[contains(@class,'breadcrumbs')]//li[3]

  - name: brandVariant
    xpath: ancestor::html//div[contains(@class,'breadcrumbs')]//li[4]

  - name: inStockOnline
    xpath: ancestor::html//button[contains(@class,'tocart') and not(@disabled)]
    regExp: (.*)
    regExpReplace: 'yes'
    defaultValue: 'no'

  - name: inStockStore # can't find

  - name: isBundle # can't find

  - name: manufacturerPartNumber # can't find
    xpath: ancestor::html//th[contains(text(),'Manufacturer part number')]/following-sibling::td | ancestor::html//th[contains(text(),'Manufacturer Part Number')]/following-sibling::td

  - name: masterBrand
    xpath: ancestor::html//div[contains(@class,'breadcrumbs')]//li[2]

  - name: multipackFlag
    xpath: //td[contains(@data-th,"Product Name")]
    regExp: \b(\d+)\s*[xX](?=\s*\d)
    regExpReplace: 'yes'
    defaultValue: 'no'
  
  - name: multipackQuantity
    xpath: //td[contains(@data-th,"Product Name")]
    regExp: \b(\d+)\s*[xX](?=\s*\d)
    regExpReplace: $1

  - name: packSize
    xpath: //td[contains(@data-th,"Product Name")] | //ul[contains(@class,'prices-tier items')]/ancestor::tr/preceding-sibling::tr//td[contains(@data-th,"Product Name")]

  - name: packSizeUnit
    xpath: //td[contains(@data-th,"Product Name")] | //ul[contains(@class,'prices-tier items')]/ancestor::tr/preceding-sibling::tr//td[contains(@data-th,"Product Name")]

  - name: productDescription
    xpath: ancestor::html//div[@id='description']

  - name: productName
    xpath: ancestor::html//h1[contains(@class,'page-title')]

  - name: productRating # can't find

  - name: productVariant
    xpath: ancestor::html//div[contains(@class,'breadcrumbs')]//li[4]

  - name: promotionDescription
    xpath: //ul[contains(@class,'prices-tier items')]//li

  - name: quantity
    xpath: //td[contains(@data-th,"Product Name")]
    regExp: \b(\d+)\s*[xX](?=\s*\d)
    regExpReplace: $1
    defaultValue: '1'

  - name: ratingCount # can't find

  - name: retailPrice

  - name: retailPriceWithoutVAT
    xpath: //span[contains(@class,'price')]/@data-price-amount

  - name: RRP_Was #needs investigation

  - name: RRP_WasWithoutVat
    xpath: preceding-sibling::tr[1]//span[contains(@class,'price')]/@data-price-amount

  - name: sku #can't find
  
  - name: specificationProfile
    xpath: ancestor::html//*[contains(text(),"Specifications")]/ancestor::table//tbody | ancestor::html//*[contains(text(),"Specifications")]/following-sibling::ul | ancestor::html//h2[contains(text(),"Specifications")]/following-sibling::p[1] | ancestor::html//*[contains(text(),"Specifications")]/following-sibling::div/table[not(.//*[contains(text(),'Viscosity')])] | ancestor::html//span[contains(text(),'Specification')]/parent::h3/parent::div/following-sibling::ul | ancestor::html//p[contains(text(),'following approvals:')]/following-sibling::table | ancestor::html//h3[contains(text(),'specificaties')]/parent::div/following-sibling::ul | ancestor::html//span[contains(text(),'Specification')]/parent::h3/following-sibling::ul | ancestor::html//h2[contains(text(),'Product Performance Claims')]/following-sibling::ul | ancestor::html//span[contains(text(),'Approvals')]/ancestor::p/following-sibling::p | ancestor::html//span[contains(text(),'Our advice is therefore in favour of')]/following-sibling::span | ancestor::html//p/text()[contains(., 'Specifications')]/following-sibling::text()[normalize-space() and starts-with(., '•')] | ancestor::html//h3[contains(text(),'Specification')]/following-sibling::ul[1] | ancestor::html//h3[contains(text(),'Approval')]/following-sibling::ul[1]

  - name: specProfile
    xpath: ancestor::html//*[contains(text(),"Specifications")]/ancestor::table//tbody | ancestor::html//*[contains(text(),"Specifications")]/following-sibling::ul | ancestor::html//h2[contains(text(),"Specifications")]/following-sibling::p[1] | ancestor::html//*[contains(text(),"Specifications")]/following-sibling::div/table[not(.//*[contains(text(),'Viscosity')])] | ancestor::html//span[contains(text(),'Specification')]/parent::h3/parent::div/following-sibling::ul | ancestor::html//p[contains(text(),'following approvals:')]/following-sibling::table | ancestor::html//h3[contains(text(),'specificaties')]/parent::div/following-sibling::ul | ancestor::html//span[contains(text(),'Specification')]/parent::h3/following-sibling::ul | ancestor::html//h2[contains(text(),'Product Performance Claims')]/following-sibling::ul | ancestor::html//span[contains(text(),'Approvals')]/ancestor::p/following-sibling::p | ancestor::html//span[contains(text(),'Our advice is therefore in favour of')]/following-sibling::span | ancestor::html//p/text()[contains(., 'Specifications')]/following-sibling::text()[normalize-space() and starts-with(., '•')] | ancestor::html//h3[contains(text(),'Specification')]/following-sibling::ul[1] | ancestor::html//h3[contains(text(),'Approval')]/following-sibling::ul[1] | ancestor::html//td[contains(text(),'specifications')]/ancestor::thead/following-sibling::tbody | ancestor::html//h3[contains(text(),'Specificaties')]/following-sibling::ul | ancestor::html//h3[contains(text(),'Specifications')]/following-sibling::p/span[contains(text(),'Ferrari') or contains(text(),'Getrag') or contains(text(),'MB 236.26') or contains(text(),' GL-4')] | ancestor::html//h3[contains(text(),'Specifications')]/following-sibling::p[1][not(.//*[contains(text(),'contact')])]

  - name: startingPriceType
    defaultValue: 'RRP'

  - name: VAT
    defaultValue: '20%'

  - name: viscosity
    xpath: ancestor::html//h1[contains(@class,'page-title')]
    regExp: \b\d+\s*[wW]\s*-?\s*\d+\b

  - name: rawAvailabilityMessage #can't find
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[@data-purpose='productName.heading-2-h1']

  - name: listing_id
    xpath: //*[@data-purpose='product.productNumber']
    regExp: '\d+'

  - name: offer_price
    xpath: ((//*[@data-purpose='productDetailPage.data.rightContainer']//*[@data-purpose='product.price.old'])[1]  | (//*[@data-purpose='productDetailPage.data.rightContainer']//*[@data-purpose='product.price.current'])[1])[2]
    regExp: '(\d\.)?\d+(,\d+)?'


  - name: original_price
    xpath: ((//*[@data-purpose='productDetailPage.data.rightContainer']//*[@data-purpose='product.price.old'])[1]  | (//*[@data-purpose='productDetailPage.data.rightContainer']//*[@data-purpose='product.price.current'])[1])[1]
    regExp: '(\d\.)?\d+(,\d+)?'


  - name: platform_category
    xpath: (//*[@data-purpose='productBreadcrumbs.link'])[1]

  - name: product_variations
    xpath: //*[@data-purpose='productDetailPage.data.rightContainer']//fieldset/input/@value
    regExp: (.+)
    regExpReplace: https://www.xxxlutz.sk$1


  - name: stock_availability
    defaultValue: 'no'
    xpath: //meta[@property="og:availability"]/@content
    regExp: instock
    regExpReplace: 'yes'

  - name: main_image
    xpath: (//*[@data-testid='slider-clipper']//*[@data-purpose='imageSlider.stageImage']/@src)[1]
    downloadContent: 'text'


  - name: alternative_images
    xpath: (//*[@data-testid='slider-clipper']//*[@data-purpose='imageSlider.stageImage']/@src)[position() > 1]

  - name: description
    xpath: //li[div[contains(text(), "Všeobecné údaje")]]/ul


  - name: pack_size
    xpath: //li[contains(text(), 'sada:')] | //li[contains(text(), 'kolekcia:')][not(contains(text(), "názov"))]
    regExp: \b(\d{1,3})\b
    regExpReplace: $1

#  NOT FOUND
  # - name: user_reviews

  # - name: average_rating

  - name: dimensions_raw
    xpath: //li[contains(text(), 'rozmer:')]
    

  - name: height
    xpath: ((//li[contains(text(), 'celková výška')])[1] | (//li[contains(text(), 'výška') and not(contains(text(), 'Balík'))])[1])[1]
    defaultValue: 'null'

  - name: diameter
    xpath: //li[div[contains(text(),"Technické detaily")]]//li[contains(text(), 'priemer') and not(contains(text(), 'Balík'))]

  - name: depth
    xpath: (//li[contains(text(), 'celková hĺbka')] | //li[contains(text(), 'hĺbka') and not(contains(text(), 'Balík'))])[1]
    

  - name: width
    xpath: (//li[contains(text(), 'celková šírka')] | //li[contains(text(), 'šírka') and not(contains(text(), 'Balík'))])[1]
    defaultValue: 'null'
    
  - name: length
    xpath: (//li[contains(text(), 'celková dĺžka')] | //li[contains(text(), 'dĺžka') and not(contains(text(), 'Balík')) ])[1]
    defaultValue: 'null'
    

  - name: weight_unit

  - name: volume
    xpath: //li[contains(text(), 'liter')]
    regExp: ([\d,.]+)
    regExpReplace: $1

  - name: weight_raw
    xpath: //*[@data-purpose='modal.sidebar.wrapper']
    regExp: hmotnosť ([\d.,]+) kg
    regExpReplace: $1
    
  - name: materials
    xpath: //li[div[contains(text(), "Materiál" )]]//li[contains(text(), "materiál:") or contains(text(), "druh kovu:")]
  #   defaultValue: empty

  # - name: materials_backup
  #   xpath: //div[contains(text(), "Materiál")]/following-sibling::ul/li
  #   regExp: ':\s*(.+)'
  #   regExpReplace: $1

  - name: colour
    defaultValue: 'null'

  - name: colour_raw
    xpath: //li[div[contains(text(), "Technické detaily" ) or contains(text(), "Čelo" ) or contains(text(), "Podrobné informácie")]]//li[contains(text(), "farba:")]
    regExp: farba:\s(.+) 
    regExpReplace: $1

  - name: colour_raw_backup
    xpath: //li[contains(text(), "farba:")][1]
    regExp: farba:\s(.+) 
    regExpReplace: $1
      

  - name: product_details
    xpath: //*[@data-purpose='modal.sidebar.wrapper']
  






  


  






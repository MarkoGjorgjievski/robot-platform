singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[@data-purpose="productName.heading-2-h1"]
  - name: listing_id
    xpath: //div[@data-purpose="product.productNumber"]
    regExp: (\d+)
  - name: offer_price
    xpath: (//div[@data-purpose="productDetailPage.data.rightContainer"]//div[@data-purpose="product.price.old"]//following-sibling::div[@data-purpose="product.price.current"])[1]
    regExp: (\d{1,3}(?:\.\d{1,3})*(?:,\d{1,3})*)
  - name: original_price
    xpath: (//div[@data-purpose="productDetailPage.data.rightContainer"]//div[@data-purpose="product.price.old"])[1] | (//div[@data-purpose="productDetailPage.data.rightContainer"]//div[@data-purpose="product.price.current" and not(../div[@data-purpose="product.price.old"]//following-sibling::div[@data-purpose="product.price.current"])])[1]
    regExp: (\d{1,3}(?:\.\d{1,3})*(?:,\d{1,3})*)
  - name: platform_category
    xpath: (//a[@data-purpose="productBreadcrumbs.link"])[2]
  - name: stock_availability
    xpath: button[data-purpose="checkout.addtocart"]/@disabled
    defaultValue: 'true'
  - name: main_image
    xpath: (//img[@data-purpose="imageSlider.stageImage"])[1]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: (//img[@data-purpose="imageSlider.stageImage"])[position() > 1]/@src
  - name: description
    xpath: //div[contains(@class, 'rah-static')]
#    jq: .description
#  - name: user_reviews
#    defaultValue: false
#  - name: average_rating
#    defaultValue: false
  - name: product_variations
    xpath: //fieldset//input/@value
  - name: dimensions_unit
    defaultValue: "cm"
  - name: height
    xpath: ((//div[@data-purpose="product.productAttributes"])[1]//span[last()])
#    regExp: (\d{1,3}(?:\s\d{3})*)
  - name: width
    xpath: ((//div[@data-purpose="product.productAttributes"])[1]//span[last()])
#    regExp: (\d{1,3}(?:\s\d{3})*)
  - name: length
    xpath: ((//div[@data-purpose="product.productAttributes"])[1]//span[last()])
#    regExp: (\d{1,3}(?:\s\d{3})*)
  - name: diameter
    xpath: ((//div[@data-purpose="product.productAttributes"])[1]//span[last()])
  - name: depth
    xpath: ((//div[@data-purpose="product.productAttributes"])[1]//span[last()])
#    regExp: (\d{1,3}(?:\s\d{3})*)
  - name: weight_unit
    defaultValue: 'kg'
#  - name: weight_raw
#    xpath: //li[contains(text(), "Breite/Höhe/Tiefe")]
  - name: materials
    xpath: (//li[contains(text(), 'Material')])
  - name: colour
    xpath: (//script[@type="application/ld+json"])[2]
    jq: .color
  - name: product_details
    xpath: //section[@data-purpose="modal.body"]//ul
  - name: weight_raw
    defaultValue: 'dummy'
    
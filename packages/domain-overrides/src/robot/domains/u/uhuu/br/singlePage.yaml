singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: >
  //div[@class="slick-track"]/div//span[2]
  |
  //div[@id="wrapper-buy"][./ancestor::html//div[@id="fluxo-de-selecao"][count(div) = 4] or ./ancestor::html//a[@id="portal-event-btn-buy"]]
# //div[@class="slick-track"]/div//span[2] |  //div[@id="wrapper-buy"][./ancestor::html//div[@id="fluxo-de-selecao"][count(div) = 4]]
fields:
  - name: eventName
    xpath: //h1[@class="event-title"]
  - name: eventDate 
    xpath: //div[@class="slick-track"]/div//span[2]//text()
    regExp: ^\d{2}\/\d{2}
  - name: eventDateTitle
    xpath: ancestor::html[not(@dir)][.//*[@id="portal-event-btn-buy"]]//title
    regExp: (?<=\- )(\d{2}\/\d{2}\/\d{2}) #\d{2}\/\d{2}\/\d{2}
  - name: eventTime 
    xpath: //div[@class="slick-track"]/div//span[2]
    regExp: \d{2}:\d{2}
  - name: eventTimeTitle
    xpath: //div[@class="event-details"]/p/text()[3]
    regExp: \d{2}:\d{2}
  - name: venueName
    xpath: //div[@class="event-details"][last()]//strong
  - name: venueCity
    xpath: //div[@class="event-details"][last()]//p/text()[3]
  - name: eventNote
    xpath: //div[@class="event-page"]/div[@class="event-content"]//div[@class="tabs-content-item sobre active"] #//div[@class="event-page"]/div[@class="event-content"]//div[@class="tabs-content-item sobre active"]//strong[contains(text(), "Camarotes")]/following-sibling::text() | //div[@class="event-page"]/div[@class="event-content"]//div[@class="tabs-content-item sobre active"]//strong[contains(text(), "Faixa etária")]/following-sibling::text()  |  //div[@class="event-page"]/div[@class="event-content"]//div[@class="tabs-content-item sobre active"]//strong[contains(text(),"Classificação")]/following-sibling::text()
    regExp: (CLASSIFICAÇÃO:|Classificação|Camarotes|Faixa etária):(.*)
  - name: eventURL
    xpath: ./ancestor::html//script[@type="application/ld+json"]
    jq: '.offers.url'
  - name: countryCode
    xpath: ./ancestor::html//script[@type="application/ld+json"]
    jq: '.location.address.addressCountry'
  - name: isPublicPurchase
    xpath: //div[@class="event-buy-box"]/a/text()
    jq: 'if (. == "Comprar" or . == "Continuar") then "1" else "0" end'
  - name: eventUniqueId
    xpath: //a[@id="portal-event-btn-buy"]/@href
    regExp: (?<=\-)\d{5}(?=\/)
  # - name: uniqueID
  #   xpath: ./ancestor::html//script[@type="application/ld+json"]
  #   regExp: (\d+)$
  #   jq: '.offers.url'
  - name: firstDepthURL
    xpath: //a[@id="portal-event-btn-buy"]/@href

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //td[@class="performances depth_1"]/table/tbody/tr | (//div[contains(@class, "async-component")])[1]
# recordXPath: //body//pre
fields:
  - name: firstDepthURL
    xpath: //td[@class="url depth_3" and contains(text(), "sell")] | (//td[@class="buttons depth_2"]/descendant::td[@class="url depth_3" and contains(text(), "ticketuser") and not(../preceding-sibling::*/td[@class="url depth_3" and contains(text(), "sell")])and not(../following-sibling::*/td[@class="url depth_3" and contains(text(), "sell")])])
  - name: eventURL
    xpath: //td[@class="url depth_3" and contains(text(), "sell")] | (//td[@class="buttons depth_2"]/descendant::td[@class="url depth_3" and contains(text(), "ticketuser") and not(../preceding-sibling::*/td[@class="url depth_3" and contains(text(), "sell")])and not(../following-sibling::*/td[@class="url depth_3" and contains(text(), "sell")])])
  #   xpath: //text()
  #   jq: .infoPerformance.performances[].buttons[] | select((.type == "resale" or .type == "sell") and .url != "") | .url
  - name: eventName
    xpath: //td[contains(@class, "title")]
  - name: venueName
    xpath: ancestor::html//td[contains(@class, "venueDetail")]//td[contains(@class, "name")]
  - name: venueCity
    xpath: ancestor::html//td[contains(@class, "venueDetail")]//td[contains(@class, "city")]
  - name: eventDateTime
    xpath: //td[contains(@class, "datetime")]
  - name: isPublicPurchase
    xpath: //td[contains(@class, "buttons")]//td[contains(@class, "label")]
    jq: . | if . == "Acquista" then 1 else 0 end
  - name: onSaleDateTime
    xpath: //td[contains(@class, "startSellDate")]
  - name: eventNotes
    xpath: ancestor::html//div[contains(@id, "_modal_body_")] | ancestor::html//div[@id="block_info"]
  - name: rowPlaceHolder
    xpath: (//text())[1]
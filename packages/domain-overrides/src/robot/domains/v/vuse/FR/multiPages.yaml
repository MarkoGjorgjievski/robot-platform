singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: '//ol[@id="product-list-plp"]/li | //div[@class="netreviews_review_part"]'
fields:
  - name: name
    xpath: '//a[@class="product-item-link"]'
  - name: productUrl
    description: 'product url.'
    xpath: '//a[@class="product-item-link"]/@href'
  - name: sku
    description: 'sku number.'
    xpath: '//div[@class="ruk-rating-snippet"]/@data-sku'
  - name: helpfulCount
    description: Number of people who said the review was helpful
    xpath: '//a[@class="netreviewsVote"][1]/span'
  - name: reviewDate
    type: 'DATETIME'
    description: 'Date the review was made'
    xpath: '//p[@class="netreviews_customer_name"]/span[1]'
    regExp: 'publié le (.*)'
    regExpReplace: $1
  - name: reviewRating
    description: 'Rating normalized to be out of 5'
    xpath: '//div[@class="netreviews_reviews_rate"]'
    regExp: '(.*)/5'
    regExpReplace: $1
  - name: reviewText
    description: 'The text of the review'
    xpath: '//p[@class="netreviews_customer_review"]'
  - name: reviewTitle
    singleValue: true
    description: 'The title of the review'
  - name: 'verifiedPurchase'
    description: 'Whether this of an item the reviewer purchased. "Yes" if true else ""'
    xpath: 'boolean(//p[@class="netreviews_customer_name"]/span[2])'
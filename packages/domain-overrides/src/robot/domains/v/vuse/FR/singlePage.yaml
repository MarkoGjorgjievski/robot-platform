singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: brandText
    singleValue: true
    description:
      Product brand shown - this may actually NOT be just a brand name,
      e.g. "Visit the Gillette Store"
    xpath: //div[contains(@class,'custom_brand')]
  - name: category
    singleValue: false
    description: The categories (e.g. from breadcrumbs)
    # xpath: //link[@rel="canonical"]/@href
    regExp: https://www.vuse.com/fr/fr/(.*)
    regExpReplace: $1
  - name: name
    # xpath: //ul[@class="items"]//li[last()]
    xpath: normalize-space(//span[@itemprop="name"])
  - name: color
    xpath: //div[@class="swatch-selected-color__details"]//span[@class="swatch-selected-color__text"]
  - name: flavour
    xpath: //span[@class="sub-heading"]
    regExp: (.*)[S,s]aveur(.*)
    regExpReplace: $1$2
  - name: image
    singleValue: true
    xpath: //img[@class="fotorama__img"]/@src
  - name: pageTitle
    xpath: //meta[@property="og:title"]/@content
  - name: reviewCount
    # xpath: //div[@class="netreviews-rating"]
    xpath: //p[contains(@class, "netreviews_subtitle")]
    regExp: \d+
    # regExpReplace: $1
  - name: sku
    xpath: //input[@name="refProduct"]/@value
  - name: reviewsUrl
    xpath: //link[@rel="canonical"]/@href
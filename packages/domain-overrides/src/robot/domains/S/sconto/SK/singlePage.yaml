singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //div[contains(@class, 'box-detail__heading-wrap')]
  - name: listing_id
    xpath: (//div[contains(@class, 'box-detail__main__reviews')])[1]
    regExp: '(\d+)'
  - name: offer_price
    xpath: //div[contains(@class, 'product-price__high')]//ancestor::div[contains(@itemprop, 'offers')]//div[contains(@class, 'product-price__price--detail')]
    regExp: (\d[\d\s]*,\d+)
  - name: original_price
    xpath: (//div[contains(@class, 'product-price__high')]  | //div[contains(@class, 'product-detail-main')]//div[contains(@class, 'product-price__price--detail')])[1]
    regExp: (\d[\d\s]*,\d+)
  - name: platform_category
    xpath: (//div[contains(@class, 'box-breadcrumb')]//a)[last()]
  - name: product_variations
    xpath: //div[contains(@class, 'box-detail-variants')]//a/@href
#  - name: stock_availability
#    xpath: //div[contains(@class, 'box-detail__info__availability')]//*[contains(@class, 'box-detail__info__availability__value')]
  - name: stock_availability
    xpath: //button[contains(@class, 'add_product_form')]
    defaultValue: 'no'
  - name: main_image
    xpath: (//body//div[contains(@class, 'main-image-carousel')]//img)[1]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, 'box-gallery__grid')]//img[contains(@class, 'image-product-galleryThumbnail')]/@src
  - name: description
    xpath: //div[contains(@class, 'web__container')]//div[contains(@class, 'content box-accordion__body__content--desc')]
  - name: pack_size
    xpath: //ul[contains(@class, 'box-detail-list--package--main')]//li[contains(text(), 'Počet balíkov')]
    regExp: '(\d+)'
  - name: user_reviews
    xpath: //div[contains(@id, 'widget')]//*[contains(text(), 'recenzií')]
    regExp: '(\d+)'
  - name: average_rating
    xpath: //div[contains(@id, 'recomend')]//span[contains(@class, 'high-rating')]
    regExp: '(\d+)'
#  #  - name: dimensions
#  #    xpath:
#  #    defaultValue: 'in sub fields'
  - name: dimensions_unit
    xpath: (//div[contains(@class, 'box-accordion__body__content--measures')]//td)[2]
    defaultValue: 'cm'
    regExp: '(\D+)$'
  - name: height
    xpath: //div[contains(@class, 'box-accordion__body__content--measures')]//td[contains(text(), 'Výška')]/following-sibling::td
    regExp: '[\d,.]+'
  - name: width
    xpath: //div[contains(@class, 'box-accordion__body__content--measures')]//td[contains(text(), 'Šírka')]/following-sibling::td
    regExp: '[\d,.]+'
  - name: length
    xpath: //div[contains(@class, 'box-accordion__body__content--measures')]//td[contains(translate(text(), 'D', 'd'), 'dĺžka')]/following-sibling::td
    regExp: '[\d,.]+'
  - name: depth
    xpath: //div[contains(@class, 'box-accordion__body__content--measures')]//td[contains(text(), 'Hĺbka')]/following-sibling::td
    regExp: '[\d,.]+'
#  - name: diameter
#    xpath: //div[contains(text(), 'Durchmesser')]/following-sibling::div
#    regExp: '(\d+)'
#  - name: volume
#    xpath: //div[contains(text(), 'Volumen')]/following-sibling::div
#    regExp: '(\d+(\,\d+)?)'
  - name: weight_unit
    xpath: //div[contains(@class, 'box-accordion__body--packages')]//li[contains(text(), 'hmotnosť produktu:')]
  - name: weight_raw
    xpath: //div[contains(@class, 'box-accordion__body--packages')]//li[contains(text(), 'hmotnosť produktu:')]
    regExp: '[\d,.]+'
  - name: materials
    xpath: //div[contains(@class, 'box-accordion__body__content--params')]//*[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚ', 'abcdefghijklmnopqrstuvwxyzáéíóú'), 'materiál')]/ancestor::ul//li[position() > 1]
#    regExp: ':(.*)'
  - name: colour
    xpath: //div[contains(@class, 'box-accordion__body__content--params')]//*[contains(text(), 'Farba')]//ancestor::li
  - name: product_details
    xpath: //div[contains(@class, 'box-accordion__body__content--params')]
#  - name: requestData
#    xpath: //*[@id='requestData']
#    defaultValue: null

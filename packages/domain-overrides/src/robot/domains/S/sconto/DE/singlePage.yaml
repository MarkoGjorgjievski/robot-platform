singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: (//*[contains(@class, 'articleInformation__headline')])[1]
  - name: listing_id
    xpath: //div[@class='articleInformation__articleNr']/text()
    regExp: '(\d+)'
  - name: offer_price
    xpath: (//div[contains(@class, 'articleInformation__price')]//div[contains(@class, 'articlePricesNew__price--discount')])[1]
  - name: original_price
    xpath: "(//div[contains(@class, 'articleInformation__price')]//div[contains(@class, 'articlePricesNew__price--original')])[1] | (//div[contains(@class, 'articleInformation__price')]//div[contains(@class, 'articlePricesNew__price--single')])[1]"
  - name: platform_category
    xpath: //ul[contains(@class, 'breadcrumb__listContainer')]//li[3]//span
  - name: product_variations
    xpath: //div[contains(@class, 'configurationOverlayOptions')]//button[contains(@class, 'configurationOption')]/@data-target | //div[contains(@class, 'articleConfigurationV2')]//a[contains(@class, 'articleConfigurationV2__optionImage')]/@data-article
#    defaultValue: 'no product_variations on this specific product'
  - name: stock_availability
    xpath: (//button[contains(text(), 'Zurzeit nicht bestellbar')])[1]
    defaultValue: 'yes'
  - name: main_image
    xpath: //div[contains(@class, 'articlePresentationNew__imageFull')]//a/@href | (//div[contains(@class, 'articleImageForADS__image')])[2]//a/@href
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, 'articlePresentationNew__imageItem') and not(contains(@class, 'articlePresentationNew__imageFull'))]//img/@src
#  - name: description
#    xpath: //div[contains(@class, 'articleDescriptionV2__headline')]
  - name: pack_size
#    xpath: //div[contains(text(), 'Anzahl Packstücke:')]/following-sibling::div
    defaultValue: '1'
  - name: user_reviews
    xpath: //div[contains(@class, 'averageRating__numberOfRatings')]
#    defaultValue: 'no user_reviews on this specific product'
    regExp: '(\d+)'
  - name: average_rating
    xpath: (//div[contains(@class, 'averageRating__number')])[1]
    regExp: '^(\d+(\.\d+)?)'
#    defaultValue: 'no average_rating on this specific product'
#  - name: dimensions
#    xpath:
#    defaultValue: 'in sub fields'
  - name: dimensions_unit
    xpath: //div[contains(text(), 'Gesamtbreite')]/following-sibling::div[contains(@class, 'articleFeature__subElement')]
    defaultValue: 'cm'
    regExp: '(\D+)$'
  - name: height
    xpath: //div[contains(text(), 'Gesamthöhe')]/following-sibling::div
    regExp: '(\d+)'
  - name: width
    xpath: //div[contains(text(), 'Gesamtbreite')]/following-sibling::div
    regExp: '(\d+)'
  - name: length
    xpath: //div[contains(text(), 'Gesamtlänge')]/following-sibling::div
    regExp: '(\d+)'
  - name: diameter
    xpath: //div[contains(text(), 'Durchmesser')]/following-sibling::div
    regExp: '(\d+)'
  - name: volume
    xpath: //div[contains(text(), 'Volumen')]/following-sibling::div
    regExp: '(\d+(\,\d+)?)'
  - name: depth
    xpath: //div[contains(text(), 'Gesamttiefe')]/following-sibling::div
    regExp: '(\d+)'
#  - name: weight
#    xpath:
#    defaultValue: 'weight is not set'
#  - name: weight_unit
#    xpath:
#    defaultValue: 'weight is not set'
#  - name: weight_raw
#    xpath:
#    defaultValue: 'weight is not set'
  - name: materials
    xpath: //div[contains(@class, 'articleFeature__element')]//*[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'material')]//ancestor::div[contains(@class, 'articleFeature__element')]//div[contains(@class, 'articleFeature__subElementValue')]
  - name: colour
    xpath: //div[contains(@class, 'articleFeature__element')]//*[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'farbe')]//ancestor::div[contains(@class, 'articleFeature__element')]//div[contains(@class, 'articleFeature__subElementValue')]
  - name: product_details
    xpath: (//div[contains(@class, 'articleDescriptionV2__features')])[1]
  - name: materialRaw
    defaultValue: 'dummy'








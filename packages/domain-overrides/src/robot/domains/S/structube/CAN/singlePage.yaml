singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: '//h1[@class="productFullDetail-module-productName-2ph"]/text()'    

  - name: 'listing_id'
    xpath: '(//meta[@id="sku"]/@content)[1]'    

  - name: 'offer_price'
    xpath: '(//meta[@id="price"]/@content)[1]'
    defaultValue: null

  - name: 'original_price'   
    xpath: (//div[contains(@class,'priceRange-module-pricesWrapper')]/div[contains(@class,'productFullDetail-module-priceOld')])

  - name: 'platform_category' 
    xpath: '//ol[contains(@class,"breadcrumbs")]//li[last()-1]/a/span'  

  - name: 'product_variations'
    xpath: ''  
    defaultValue: null

  - name: 'product_variations_index' 
    xpath: '//script[@id="candid-pdp-iframe"]' 

  - name: 'product_variations_link' 
    xpath: '(//link[@id="url"])[1]/@href' 

  - name: 'stock_availability'
    xpath: 'boolean(//button[contains(@class, "addToCart") and not(contains(@class, "disabled"))])' 
    # defaultValue: 'yes' 

  - name: 'main_image'
    xpath: '//div[@class="zoomResourceImage-module-root-4jR"]/img/@src'
    downloadContent: 'text'    

  - name: 'alternative_images'
    xpath: '//div[contains(@class, "carousel-module-thumbnailList")]//img[@loading="lazy"]/@src' 

  - name: 'description'
    xpath:  '//span[contains(@class, "shortDescription")]' 

  - name: 'pack_size'
    defaultValue: 1

  - name: 'user_reviews'
    xpath: '//button[contains(@class, "productReviewsSummary")]//span/text()'
    defaultValue: '0'    

  - name: 'average_rating'
    xpath: '//div[@itemprop="aggregateRating"]//meta[@itemprop="ratingValue"]/@content'
    defaultValue: null 

  - name: 'dimensions_unit'    
    defaultValue: 'cm'  

  - name: 'dimensions_data'    
    xpath: (//h4[contains(text(),'Product Dimensions')]/following-sibling::p)[1] 

  - name: 'height'
    xpath: '' 
    defaultValue: 'dummy'  

  - name: 'width'
    xpath: ''     
    defaultValue: 'dummy'  

  - name: 'depth'
    xpath: ''
    defaultValue: 'dummy'  
  
  - name: 'weight_unit'
    defaultValue: 'kg'

  - name: 'weight_raw'
    xpath: (//h4[contains(text(),'Product Dimensions')]/following-sibling::p)[2]

  - name: 'materials'
    xpath: '(//div[contains(text(), "Features")]/parent::div//ul/li)[1]'

  - name: 'colour'
    xpath: '//span[contains(text(), "Colour")]/following-sibling::span[contains(@class, "selected")]'

  - name: 'product_details'
    xpath: '//div[contains(@class, "productFullDetail-module-accordionContent-GyW")]'

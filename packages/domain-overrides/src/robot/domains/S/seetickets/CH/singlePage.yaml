singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[@type="application/ld+json"][contains(text(),"addressCountry")][(contains(text(),'addressCountry":"CH'))]
fields:
  - name: eventName
    xpath: 'ancestor::html//h1'
  - name: venueName
    xpath: '//text()'
    jq: '.location.name'
  - name: venueCity
    xpath: '//text()'
    jq: '.location.address.addressLocality'
  # - name: eventDateTime
  #   xpath: '//text()'
  #   jq: '.startDate'
  - name: eventDateTime
    xpath: 'ancestor::html//input[@name="Event.Starts"]/@value'
  - name: postalCode
    xpath: '//text()'
    jq: '.location.address.postalCode'
  - name: venueAddress
    xpath: '//text()'
    jq: '.location.address.streetAddress'
  - name: venueCountryCode
    xpath: '//text()'
    jq: '.location.address.addressCountry'
  - name: eventNote
    xpath: 'ancestor::html//section[@class="g-ui-box"]/p'
  - name: onSaleDate
    xpath: '//text()'
    jq: 'if .offers[0].availabilityStarts == "0001-01-01T00:00:00Z" then null elif .offers[0].availabilityStarts == .startDate then null else .offers[0].availabilityStarts end'
  # - name: isPublicPurchase
  #   xpath: 'boolean(ancestor::html//span[@class="buy-tickets-button__text"] or ancestor::html//a[contains(text(), "Apuntarme a la lista de espera")][not(ancestor::html//div[@id="pricesTab"]/p[contains(text(), "No disponible")])])'


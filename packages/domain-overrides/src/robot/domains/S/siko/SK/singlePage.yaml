singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //h1[contains(@class,'title')]

  - name: 'listing_id'
    xpath: //div[contains(text(),'ód tovaru')]/following-sibling::div

  - name: 'offer_price'
    xpath: //div[contains(@class,'price-container')]//span[contains(@class,'discounted')]
    regExp: '\d+(\.\d+)?'

  - name: 'original_price'    
    xpath: //div[contains(@class,'price-container')]//span[contains(@class,'h1') and not(contains(@class,'discounted'))]
    regExp: '[\d,.\s-]+'
    defaultValue: 'dummy'

  - name: 'original_price_backup'    
    xpath: //div[contains(@class,'price-container')]//div[contains(@class,'sale')]/span[contains(@class,'value')]
    regExp: '\d+(?:,\d+)*[\s-]*\d+'

  - name: 'original_price_fraction'    
    xpath: //div[contains(@class,'price-container')]//span[contains(@class,'h2')]
    regExp: \d+

  - name: 'platform_category' 
    xpath: //nav[contains(@class,"crumbs")]/span[position() = last() - 1]

  - name: 'product_variations'
    xpath: ''  

  - name: 'stock_availability'
    xpath: boolean(//button[contains(@class,'btn-cart')])

  - name: 'main_image'
    xpath: (//div[contains(@class,'swiper-slide-active')]/img/@src)[1]
    downloadContent: 'text'     

  - name: 'alternative_images'
    xpath: //swiper[contains(@class,'upper-swipper')]//img/@src

  - name: 'description'
    xpath: //div[contains(@class,'summary')]

  - name: 'pack_size'
    xpath: //td[contains(text(),'Balenie')]/following-sibling::td
    regExp: \d+
    defaultValue: '1'

  - name: 'user_reviews'
    xpath: (//span[contains(@class,'count-reviews')])[1]
    regExp: \d+

  - name: 'average_rating'
    xpath: (//div[contains(@class,'main-rating')])[1] 

  - name: 'dimensions_unit'
    xpath: //td[contains(text(),'Šírka')]/following-sibling::td | //td[contains(text(),'Priemer')]/following-sibling::td
    regExp: '[a-zA-Z]+'

  - name: 'width'
    xpath: //td[contains(text(),'Šírka')]/following-sibling::td
    regExp: \b\d+(?:[,.]\d+)?\b

  - name: 'depth'
    xpath: //td[contains(text(),'Hĺbka')]/following-sibling::td
    regExp: \b\d+(?:[,.]\d+)?\b

  - name: 'height'
    xpath: //td[contains(text(),'Výška')]/following-sibling::td
    regExp: \b\d+(?:[,.]\d+)?\b

  - name: 'weight_unit'
    xpath: //td[contains(text(),'balenia')]/following-sibling::td
    regExp: '[a-zA-Z]+'

  - name: 'weight_raw'
    xpath: //td[contains(text(),'balenia')]/following-sibling::td
    regExp: \b\d+(?:[,.]\d+)?\b

  - name: 'materials'
    xpath: //td[contains(text(),'Povrch')]/following-sibling::td | //td[contains(text(),'Materiál')]/following-sibling::td 

  - name: 'colour'
    xpath: //td[contains(text(),'základná')]/following-sibling::td

  - name: 'product_details'
    xpath: //div[contains(@class,'technical__table')] | //div[contains(@class,'product-description')]
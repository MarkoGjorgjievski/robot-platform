singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[contains(@class, 'c-product-detail-info__title')]

  - name: listing_id
    xpath: //*[contains(@class, 'c-product-detail-info__ref js-productReference')]
    regExp: '(?<=REF: )(.*)'
 
  - name: offer_price
    xpath: //*[contains(@class, 'c-product-detail-price__final-price')]//*[contains(@class, 'js-product-price-final-price')]
 
  - name: original_price
    xpath: //*[contains(@class, 'c-product-detail-price__text  js-old-price-with-text ')]//*[contains(@class, 'c-product-detail-price__old-price  u-text-striked  js-old-price')]
    regExp: '\d\S*'
    defaultValue: 0
 
  - name: platform_category
    xpath: //*[contains(@class, 'c-breadcrumb__wrapper u-hidden@sm--down')]//*[contains(@class, 'c-breadcrumb__list-item')][last()]//*

  - name: stock_availability
    xpath: boolean(//*[contains(@class, 'icon-stock-success')])
 
  - name: main_image
    xpath: //*[contains(@class, 'c-product-gallery__list js-main-product-slider')]//a[1]/@data-pswp-src
    downloadContent: 'text'
    
  - name: alternative_images
    xpath: //*[contains(@class, 'c-product-gallery__list js-main-product-slider')]//a[position()>1]/@data-pswp-src
 
  - name: description
    xpath: //*[contains(@class, 'l-details-main-content__description  l-details-main-content__spacing  c-product-detail-description js-productCombinationDescriptionContainer js-questions__tooltip js-questions__acordeon')]//*[contains(@class, 'c-product-detail-description__column  c-product-detail-description__desc')]
  
  - name: average_rating
    xpath: //*[contains(@class, 'c-product-detail-info__score u-spacing-bottom-half')]//*[contains(@class, 'c-product-review__avg')]
 
  - name: user_reviews
    xpath: //*[contains(@class, 'c-product-detail-info__score u-spacing-bottom-half')]//*[contains(@class, 'c-product-review__total js-anchor-link')]
    regExp: '\d*'
 
  - name: materials
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')][contains(., 'Materiale')]//*[contains(@class, 'value')]
 
  - name: colour
    xpath: > 
      //*[contains(@class, 'c-options-selector__title')][contains(., 'Color')]//*[not(contains(text(), ':'))] 
      |
      //*[contains(@class, 'c-options-selector__title')][contains(., 'Stampa')]//*[not(contains(text(), ':'))] 
      |
      //*[contains(@class, 'c-options-selector__title')][contains(., 'Metal')]//*[not(contains(text(), ':'))]
      |
      //*[contains(@class, 'c-options-selector__title')][contains(., 'Textura')]//*[not(contains(text(), ':'))]
      |
      //*[contains(@class, 'c-options-selector__title')][contains(., 'Ciniglia')]//*[not(contains(text(), ':'))]
      |
      //*[contains(@class, 'c-options-selector__title')][contains(., 'Velluto')]//*[not(contains(text(), ':'))]
 
  - name: product_details
    xpath: //*[contains(@class, 'c-feature-info__list-item ')]//*[contains(@class, 'c-feature-info__tooltip js-questions__acordeon js-questions__tooltip')]
 
  - name: weight_raw
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')][contains(., 'Peso')]//*[contains(@class, 'value')]
 
  - name: height
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')]//*[text() = 'Altezza ']/..//*[last()]
 
  - name: width
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')]//*[text() = 'Larghezza ']/..//*[last()]
 
  - name: depth
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')]//*[text() = 'Profondità ']/..//*[last()]
 
  - name: length
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')]//*[text() = 'Lunghezza ']/..//*[last()]
 
  - name: diameter
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')]//*[text() = 'Diametro ']/..//*[last()]
 
  - name: product_variations_JSON
    xpath: //*[@type= 'application/ld+json'][contains(text(), 'Product')]
    jq: '.offers'
 
  - name: baseURL
    xpath: //*[contains(@rel, 'canonical')]/@href
 
  - name: productDiffrentDimencions
    xpath: //*[contains(@class, 'c-options-selector__wrapper is-button js-combinationGroup')][contains(.,'Dimensioni')]//*[contains(@class, 'c-options-selector__attr  js-combinationGroupName')]
 
  - name: productDimensions
    xpath: //*[contains(@class, 'c-product-detail-description__column')]//*[contains(@class, 'c-table-specs__row')][contains(., 'Dimensioni')]//*[contains(@class, 'value')]

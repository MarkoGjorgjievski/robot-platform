singleRecord: false
regionsSelector: null
recordSelector: null
#directly read variants
recordXPath: null
fields:
  - name: product_title
    xpath: //h2[@class='product-name-heading']
  - name: listing_id
    xpath: //script[contains(@id, 'schema-org-server')]
    jq: .offers?.[0]?.itemOffered?.productID
#  #  - name: offer_price
#  #    xpath: (//div[contains(@class, 'MuiTypography-root')]//div[contains(text(), 'kr')])[1]
#  #    regExp: \d[\d\s,\.]*\d[\d\s,\.]*(?<=\d)
  - name: original_price
    xpath: (//span[contains(@class, 'price-span')])[1]
    regExp: \$(.+)
  - name: platform_category
    xpath: (//div[@id='breadcrumbTrail']//a)[last()]
  - name: product_variations
    xpath: //input[@name = 'swatch-checkbox']/@value
  - name: productVariationMod
    xpath: //input[@name = 'swatch-checkbox']/@value
  - name: actualUrl
    xpath: //script[contains(@id, 'CC-schema-org-server')]
    jq: .@id
  - name: UrlSM
    xpath: //script[contains(@id, 'CC-schema-org-server')]
    jq: ".['@id']"
    regExp: ^(.*=).*$
  - name: stock_availability
    xpath: //button[contains(@id, 'prodDetailsAddToCart') and not(@disabled)]
    defaultValue: 'no'
  - name: main_image
    xpath: (//div[contains(@data-bind,'primaryFullImageURL')])[1]//img/@src
    regExp: ^(.+)
    regExpReplace: https://www.sleepcountry.ca$1
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[@id = 'prodDetails-imgCarousel']//img/@src
    regExp: ^(.+)
    regExpReplace: https://www.sleepcountry.ca$1
  - name: description
    xpath: //div[contains(@data-bind, 'longDescription')]
  - name: pack_size
    defaultValue: '1'
  - name: user_reviews
    xpath: //div[contains(@class, 'pdp-right')]//div[contains(@class, 'star-clickable')]//a
    regExp: '(\d+)'
  - name: average_rating
    xpath: //script[contains(@class, '-snippet-script')]
    jq: .aggregateRating?.ratingValue
  - name: dimensions_unit
    defaultValue: 'cm'
  - name: height
    xpath: //tr[contains(@class, 'product-brand-row')]//td[contains(@class, 'value')]
  - name: width
    xpath: //tr[contains(@class, 'product-brand-row')]//td[contains(@class, 'value')]
  - name: length
    xpath: //tr[contains(@class, 'product-brand-row')]//td[contains(@class, 'value')]
#  #  - name: weight
#  #    xpath:
#  #    defaultValue: 'weight is not set'
#  #  - name: weight_unit
#  #    xpath:
#  #    defaultValue: 'weight is not set'
#  - name: weight_raw
#    xpath: //span[contains(text(), 'Beskrivning')]/parent::*
#  - name: diameter
#    xpath: //span[contains(@data-testid, 'false')]
#  #    regExp: 'Diameter (\d+(\.\d+)?) cm'
  - name: materials
    xpath: //div[contains(@class, 'product-feature-rich')]
  - name: materialMod
    xpath: //div[contains(@class, 'product-feature-rich')]
  - name: colour
    xpath: //div[contains(@class, '-swatch')]//label[contains(@class, 'active')]//input/@value
  - name: colorValue
    xpath: //div[contains(@class, '-swatch')]//label[contains(@class, 'active')]//input/@value
  - name: product_details
    xpath: //div[contains(@class, 'product-feature-rich')]
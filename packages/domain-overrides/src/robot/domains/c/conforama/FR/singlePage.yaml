singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[@class='productTitle']//*[@class='libeleOrg']

  - name: listing_id
    xpath: //*[contains(@id, 'productSheet')]/@data-product
    # regExp: '\/([^\/]+)$'
    # regExpReplace: $1

  - name: offer_price
    xpath: (//span[contains(@class,'oldPrice')]/ancestor::html//div[contains(@class,'currentPrice')]//text()[not(parent::sup)])[1]
    regExp: \d+

  - name: offer_price_decimal
    xpath: (//span[contains(@class,'oldPrice')]/ancestor::html//div[contains(@class,'currentPrice')]//sup)[1]
    regExp: \d+

  - name: original_price
    xpath: //span[contains(@class,'oldPrice')]/text()
    defaultValue: 'dummy'

  - name: original_price_decimal
    xpath: (//span[contains(@class,'oldPrice')]/sup)[1]
    regExp: \d+
    
  - name: original_price_backup
    xpath: (//button/@data-price)[1] | //div[contains(@class,'currentPrice')]//text()[not(parent::sup)]

  - name: original_price_backup_decimal
    xpath: //div[contains(@class,'currentPrice')]/sup
    regExp: \d+

  - name: platform_category
    xpath: //*[@id='breadcrumb']//a[last()]

  - name: product_variations
    xpath: //*[@id='variantblock']//a/@href
    regExp: "(.+)"
    regExpReplace: https://www.conforama.fr/$1

  - name: stock_availability
    xpath: //p[contains(text(), "Ce produit n'est plus disponible")]
    regExp: "(.+)"
    regExpReplace: "no"
    defaultValue: "yes"

  - name: main_image
    xpath: (//*[@class='productPics']//img/@src)[1]
    downloadContent: "text"

  - name: alternative_images
    xpath: //*[@class='sliderProdView']//img/@src

  - name: description
    xpath: //*[text()='Description du produit']/following-sibling::*[1] | //meta[contains(@name,'description')]/@content

  - name: pack_size
    defaultValue: 1

  - name: user_reviews
    xpath: (//div[contains(@class,'productTitle')]//span[contains(@class,'product-avis-nbr')])[1]
    regExp: \d+

  - name: average_rating
    xpath: (//div[contains(@class,'productTitle')]//span[contains(@class,'stars')]/@data)[1]

  - name: height
    xpath: //table[contains(@class,'productSpecifications')]//*[contains(text(),'Hauteur')]/parent::td/following-sibling::td
    regExp: '\d+(\.\d+)?'

  - name: diameter
    xpath: (//*[contains(@class, 'content-desc-details')]//*[contains(text(), 'Dimensions')])[last()]
    regExp: '\d+(\.\d+)?'

  - name: depth
    xpath: //table[contains(@class,'productSpecifications')]//*[contains(text(),'Profondeur')]/parent::td/following-sibling::td
    regExp: '\d+(\.\d+)?'

  - name: width
    xpath: //table[contains(@class,'productSpecifications')]//*[contains(text(),'Largeur')]/parent::td/following-sibling::td
    regExp: '\d+(\.\d+)?'
    defaultValue: 'dummy'

  - name: length
    xpath: (//span[text()='Longueur']/../following-sibling::* | (//*[contains(@class, 'content-desc-details')]//*[contains(text(), 'Dimensions')])[last()] | //*[contains(@class, 'desc-content')]//*[contains(., 'Longueur')])[1]
    regExp: '\d+(\.\d+)?'
    defaultValue: 'dummy'

  - name: dimensions_backup
    xpath: //table[contains(@class,'productSpecifications')]//span//*[contains(text(),'Dimension')] | //li[contains(text(),'Dimension')]

  - name: volume
    xpath: //span[contains(text(), 'Densité')]/../following-sibling::*
    regExp: '\d+(\.\d+)'

  - name: weight_raw
    xpath: //span[contains(text(), 'Poids')]/../following-sibling::*
    regExp: '\d+(\.\d+)'

  - name: materials
    xpath: (//*[contains(text(), 'Matériaux')][not(@id="__input")]/parent::*//following-sibling::*)| (//*[contains(text(), 'Matiere')][not(@id="__input")]/parent::*//following-sibling::*) | (//*[contains(text(), 'Matière')][not(@id="__input")]/parent::*//following-sibling::*)

  - name: colour
    xpath: //*[@id='tabs-2']//span[contains(text(), 'Couleur')]/../following-sibling::* | //span[contains(text(), 'Coloris')]/../following-sibling::*

  - name: product_details
    xpath: //*[contains(@class, 'desc-content')] | //div[contains(@class, 'essential-infos')]


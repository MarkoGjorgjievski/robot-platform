singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@itemtype="http://schema.org/Review"]
fields:
  - name: review_id
    xpath: '@id'

  - name: review_title # not found
    # xpath:

  - name: review_body
    xpath: .//div[contains(@class, "text")]

  - name: username
    xpath: .//div[@itemtype="https://schema.org/Person"]/span[1]

  - name: review_date
    xpath: .//*[contains(@class, "rvd-dt")]
    regExp: (?:Reviewed|Updated review:)\s(.+)
    regExpReplace: $1

  - name: rating
    xpath: //meta[@itemprop="ratingValue"]/@content
    regExp: '\d+'

  - name: location
    xpath: .//div[@itemtype="https://schema.org/Person"]/span[2]

  - name: helpfulness_count
    xpath: //label/text()
    regExp: \((\d+)\)
    regExpReplace: $1

  - name: tags
    xpath: //div[contains(@class, "tag")]/span

  - name: response_text 
    xpath: .//div[contains(@class, "rvw-rply__txt")]

  - name: response_date
    xpath: .//time[contains(@class, "rvw-rply__time")]/@datetime

  - name: trustscore #not for this page
    xpath: ancestor::html//div[contains(@class, "prf-hdr__rating")]//span
  - name: images #not for this page
    xpath: .//button/img/@src
    regExp: \/([^\/]+)_thumbnail.jpg
    regExpReplace: https://media.consumeraffairs.com/files/reviews/$1.png
singleRecord: true
fields:
  - name: application_json_data
    xpath: //div[@id="nl-buy-box"]//*[@type="application/ld+json"]

  - name: main_image
    xpath: //meta[@property="og:image"]/@content
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .images[].url

  - name: colour
    xpath: //div[@id="API_RESPONSE_DATA"]

  - name: product_dimensions
    xpath: //div[@id="API_RESPONSE_DATA"]

  - name: weight_raw
    xpath: //div[@id="API_RESPONSE_DATA"]

  - name: description
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .longDescription

  - name: listing_id
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .skus[0].code

  - name: product_title
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .name

  - name: price
    xpath: //div[@id="API_RESPONSE_DATA"]

  - name: price_from_page
    xpath: //div[@id="nl-buy-box"]//*[@type="application/ld+json"]
    jq: .offers.price

  - name: platform_category
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .breadcrumbList[-2].label

  - name: product_variations
    xpath: //*[@id="variantsArray_"]
    jq: .[]

  - name: stock_availability
    xpath: //div[contains(@class, "stock-info")]
    jq: if (.=="Out of stock") then "no" else "yes" end

  - name: pack_size
    xpath: //div[@id="API_RESPONSE_DATA"]

  - name: materials
    xpath: //div[@id="API_RESPONSE_DATA"]

  - name: product_details
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .featureBullets[].description

  - name: average_rating
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .rating

  - name: user_reviews
    xpath: //div[@id="API_RESPONSE_DATA"]
    jq: .ratingsCount

  - name: dimensions_unit
    defaultValue: "cm"

  - name: weight_unit
    defaultValue: "kg"


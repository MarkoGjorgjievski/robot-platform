singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "component-product-list")]//div[contains(@class, "product-item")]
fields:
  #TODO trim leading // (protocol relative href) with JQ instead of regexp?
  - name: productUrl
    xpath: //div[contains(@class, "product-info")]//a[contains(@class, "title-link")]/@href
    regExp: '[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)'
    regExpReplace: https://www.alibaba.com$1
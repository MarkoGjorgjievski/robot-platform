singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  # # product_title
  - name: product_name
    xpath: //h1[contains(@class,'page-heading')]

  # listing_id
  - name: product_sku
    xpath: //dt[contains(.,"artikelnummer")]/following-sibling::dd
    defaultValue: empty


  - name: product_sku_backup
    jq: .specs.groups[].items[] | select(.label == "EAN") | .values[].value
    xpath: //script[@data-payload-id="off-canvas-specifications-slot"]

  - name: upc_user_input
    xpath: //dt[contains(.,"EAN")]/following-sibling::dd
    defaultValue: empty
    
  - name: upc_user_input_backup
    jq: .specs.groups[].items[] | select(.label == "EAN") | .values[].value
    xpath: //script[@data-payload-id="off-canvas-specifications-slot"]


  - name: product_id
    xpath: //wsp-comparable/@data-product-id

  - name: brand_user_input
    xpath: //*[@data-test="brand"]//a
  # - name: price
  #   xpath: //*[@data-test="feature-slot"]//*[@data-test="price"]

  - name: parent_category
    xpath: //ul[@data-test="breadcrumb"]/li[2]//p
  - name: child_category
    xpath: //ul[@data-test="breadcrumb"]/li[last()]//p
 
  # colour
  - name: product_style
    xpath: (//dl[contains(@class,'specs__list')]//dt[contains(text(),'Kleur')]/following-sibling::dd)[1]
  - name: offerURL
    xpath: //a[@data-label="all-sellers"]/@href
  - name: offer_id
    xpath: //*[@data-test="default-buy-block"]/*[@data-test="buy-block__options"]/@data-sticky-id

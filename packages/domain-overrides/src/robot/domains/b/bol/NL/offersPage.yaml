singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //li[@class="media"]
fields:
  - name: reseller_link
    xpath: .//a[@data-test="seller-link"]/@href
    regExp: (^[^?]+)
    regExpReplace: $1

  - name: offer_id 
    xpath: .//a[@data-test="seller-link"]/@data-js-href
    regExp: \?offerUid=(.+)
    regExpReplace: $1

  - name: reseller_id
    xpath: .//a[@data-test="seller-link"]/@href
    regExp: '\/(\d+)\/'
    regExpReplace: $1
  # - name: name
  #   xpath: //div[@data-test="product-title"]

  - name: price
    xpath: .//span[contains(@class, "price")]  


  - name: parent_category
    xpath: ancestor::html//*[@id="__input"]
    jq: .parent_category
  - name: child_category
    xpath: ancestor::html//*[@id="__input"]
    jq: .child_category
  - name: product_style
    xpath: ancestor::html//*[@id="__input"]
    jq: .product_style
  - name: offerURL
    xpath: ancestor::html//*[@id="__input"]
    jq: .offerURL
#   this doesn't get extracted for some reason :/
  # - name: offer_id
  #   xpath: ancestor::html//*[@id="__input"]
  #   jq: .offer_id

  - name: offerId
    xpath: ancestor::html//*[@id="__input"]
    jq: .offer_id

  - name: inputJSON
    xpath: ancestor::html//*[@id="__input"]


  - name: product_name
    xpath: ancestor::html//*[@id="__input"]
    jq: .product_name

  # listing_id
  - name: product_sku
    xpath: ancestor::html//*[@id="__input"]
    jq: .product_sku




  - name: upc_user_input
    xpath: ancestor::html//*[@id="__input"]
    jq: .upc_user_input



  - name: product_id
    xpath: ancestor::html//*[@id="__input"]
    jq: .product_id

  - name: brand_user_input
    xpath: ancestor::html//*[@id="__input"]
    jq: .brand_user_input

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:


  - name: reseller_name
    xpath: //h1[@data-test="seller_name"]
    defaultValue: 'Bol'

  - name: reseller_feedback_percent
    xpath: //*[@data-test="seller_ratings_block"]//*[@data-test="seller-rating"]
  - name: reseller_reviews
    xpath: //*[@data-test="seller_ratings_block"]//p
    regExp: ':\s*(\d+)'
    regExpReplace: $1
  - name: reseller_vat
    xpath: //div[contains(text(), "Btw nummer")]/following-sibling::div[1]




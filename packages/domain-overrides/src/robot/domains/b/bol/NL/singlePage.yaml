singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //h1[contains(@class,'page-heading')]

  # - name: 'listing_id'
  #   xpath: //div[contains(@class,'specs')]//dt[contains(text(),'EAN')]/following-sibling::dd

  - name: 'listing_id'
    xpath: //div[contains(@data-test,"taxonomy_data")]
    jq: .pdpTaxonomyObj.productInfo[].ean

  - name: 'offer_price'
    xpath: //div[contains(@class,'price-block')]//span[contains(@class,'promo-price')]/text()

  - name: 'original_price'    
    xpath: //del[contains(@class,'buy-block__list-price')]
    defaultValue: 'dummy'

  - name: 'original_price_fraction'    
    xpath: //div[contains(@class,'price-block')]//sup[contains(@class,'price__fraction')]

  - name: 'platform_category' 
    xpath: //ul[contains(@class,'breadcrumbs ')]//li[last()]

  - name: 'product_variations'
    xpath: //div[contains(@class,'feature-options')]/a/@href
    defaultValue: null

  - name: 'stock_availability'
    xpath: boolean(//div[contains(@class,'buy-block__delivery')]//div[contains(text(),'Op voorraad')])
    
  - name: 'main_image'
    xpath: //div[contains(@data-test,'current-image')]//img/@src
    downloadContent: 'text'

  - name: 'alternative_images'
    xpath: //div[contains(@class,'image-slot-thumb')]//img/@src

  - name: 'description'
    xpath: (//div[contains(@class,'product-description')]/p)[1] | (//div[contains(@class,'product-description')]/text())[2] | //div[contains(@class,'product-description')]
    
  - name: 'pack_size'
    xpath: //dt[contains(text(),'Aantal artikelen in verpakking')]/following-sibling::dd | //dt[contains(text(),'Aantal stuks in verpakking')]/following-sibling::dd
    regExp: \d+
    defaultValue: 1 
    
  - name: 'user_reviews'
    xpath: //div[contains(@class,'total-reviews')]
    regExp: \d+
    
  - name: 'average_rating'
    xpath: //div[contains(@class,'reviews-summary__avg-score')]
      
  - name: 'dimensions_unit'
    xpath: //*[contains(text(),'Overige kenmerken')]/following-sibling::dl[contains(@class,'specs__list')]//dt[contains(text(),'Product hoogte')]/following-sibling::dd
    regExp: '[a-zA-Z\s]+'
      
  - name: 'height'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Product hoogte')]/following-sibling::dd | //dl[contains(@class,'specs__list')]//dt[contains(text(),'Hoogte')]/following-sibling::dd | //li[contains(text(),'Hoogte')]
    regExp: '(\d+(\.\d+)?)'
    # regExp: '[\d,.]+'

  - name: 'depth'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Product diepte')]/following-sibling::dd | //li[contains(text(),'Totale diepte')]
    regExp: '(\d+(\.\d+)?)'
    defaultValue: '0'
    
  - name: 'width'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Product breedte')]/following-sibling::dd | //li[contains(text(),'Totale breedte')]
    regExp: '(\d+(\.\d+)?)'

  - name: 'diameter'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Diameter')]/following-sibling::dd
    regExp: '(\d+(\.\d+)?)'

  - name: 'length'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Product lengte')]/following-sibling::dd
    regExp: '(\d+(\.\d+)?)'
    defaultValue: 'dummy'

  - name: dimensions_backup
    xpath: //li[contains(text(),'Totale afmeting')]
    regExp: \d+
    defaultValue: 'dummy'

  - name: 'length_backup'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),' lengte')]/following-sibling::dd
    regExp: '(\d+(\.\d+)?)'
    
  - name: 'weight_unit'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Product gewicht')]/following-sibling::dd
    regExp: '[a-zA-Z\s]+'
    defaultValue: null
     
  - name: 'weight_raw'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Product gewicht')]/following-sibling::dd
    regExp: '(\d+(\.\d+)?)'
    defaultValue: null
    
  - name: 'materials'
    xpath: //dl[contains(@class,'specs__list')]//dt[contains(text(),'Materiaal')]/following-sibling::dd | //li[contains(text(),'Materiaal')]

  - name: 'colour'
    xpath: (//dl[contains(@class,'specs__list')]//dt[contains(text(),'Kleur')]/following-sibling::dd)[1]
    
  - name: 'product_details'
    xpath: //div[contains(@class,'product-description')]
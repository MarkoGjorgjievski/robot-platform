singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: > 
  //div[contains(@class, "buy-lists-elements")]/div/div[not(contains(@class, "item"))]
  |
  //div[@class="gps-building-info"]
fields:
  - name: eventName
    xpath: ancestor::html//head//title
    regExp: (?<=Bilety24 – )(.+)
  - name: venueName
    xpath: //div[contains(@class, "place")]//p//text()
  - name: venueAddress
    xpath: //div[@class="gps-popup"]//div[@class="info"]//text()[1]
  - name: venueCity
    xpath: //div[contains(@class, "city")]
  - name: postalCode
    xpath: //div[@class="gps-popup"]//div[@class="info"]//text()[2]
    regExp: (\d{2}\-\d{3})
  - name: eventDate
    xpath: //div[contains(@class, "date")]
    regExp: '(\d{2}\.\d{2}\.\d{4})'
  - name: eventTime
    xpath: //div[contains(@class, "date")]
    regExp: '(?<=g. )(\d{2}:\d{2})'
  - name: eventTimeDescription
    xpath: (ancestor::html//div[contains(@class, "buy-lists-elements")]//div[contains(@class, "description")])[1]
  - name: isDateTimeTBA
    defaultValue: "false"
  - name: eventNotes
    xpath: (ancestor::html//div[contains(@class, "buy-lists-elements")]//div[contains(@class, "description")])[1]
  - name: firstDepthURL
    xpath: (//div[contains(@class, "place")]//@href)[1]
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://www.bilety24.pl$1'
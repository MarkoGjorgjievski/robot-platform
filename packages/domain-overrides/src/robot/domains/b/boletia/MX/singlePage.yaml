singleRecord: true
regionsSelector: null
recordSelector: null
fields:
  - name: eventName
    xpath:  //h2[@class="c-event-info__name"]/text()
  - name: venueName
    xpath: //span[@class="c-event-info__place"]/text()
  - name: eventDateTimeISO
    xpath: //*[@type="application/ld+json"]
    jq: .startDate
  - name: addressText
    xpath: //*[@type="application/ld+json"]
    jq: .location.address.streetAddress
  - name: eventNotes
    xpath: //div[@class="c-layout"]//div[@class="c-about"]//text()
    regExp: .+
  - name: countryCode
    defaultValue: MX
  - name: isPublicPurchase
    xpath: (//button[@id="buy_tickets"]//text())[1]
    defaultValue: "0"

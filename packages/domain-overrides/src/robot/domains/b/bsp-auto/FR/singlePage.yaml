singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class,"voiture")]
fields:
  - name: category
    xpath: .//div[contains(@class, "tit_modele")]/text()
  - name: companyImageLink
    xpath: .//div/table//img/@src
    regExp: (.+)
    regExpReplace: https://www.bsp-auto.com$1
  - name: duration
    xpath: ancestor::html//div[contains(text(), "Durée")]/span
    regExp: (.+) jours
    regExpReplace: $1
  - name: endDate
    xpath: ancestor::html//input[@id="to"]/@value
  - name: endTime
    xpath: ancestor::html//select[@name="heure_d"]/option[@selected]/@value
  - name: pickUpLocation
    xpath: ancestor::html//form/div[@class="txt"][1]
  - name: price
    xpath: .//div[contains(@class, "tarif")]
  - name: startDate
    xpath: ancestor::html//input[@id="from"]/@value
  - name: startTime
    xpath: ancestor::html//select[@name="heure_a"]/option[@selected]/@value
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[contains(@column,"INVC ")]/parent::tr | 
  //form[@name="invoiceDesc"] |
  //*[contains(@column,"INVOICE ")]/parent::tr
fields:
  - name: vndID
    xpath: ancestor::html//td[contains(text(),"Account Number")]/following-sibling::td/following-sibling::td |
      //td[contains(text(),"Account Number")]/following-sibling::td/following-sibling::td
  - name: vndName
    xpath: ancestor::html//td[contains(text(),"Inv Name")]/following-sibling::td/following-sibling::td[1] |
      //td[contains(text(),"Invoice Name")]/following-sibling::td/following-sibling::td |
      ancestor::html//td[contains(text(),"Invoice Name")]/following-sibling::td/following-sibling::td
    jq: if . === "Account Number" then "" else . end
  - name: chkDte
    xpath: ancestor::html//td[contains(text(),"Payment Date")]/following-sibling::td/following-sibling::td |
      //td[contains(text(),"Payment Date")]/following-sibling::td/following-sibling::td
    regExp: (\d+)-(\d+)-(\d+)
    regExpReplace: $1$2$3
  - name: chkNo
    xpath: ancestor::html//td[contains(text(),"Payment Number")]/following-sibling::td/following-sibling::td |
      //td[contains(text(),"Payment Number")]/following-sibling::td/following-sibling::td

  - name: invDte
    xpath: //td[contains(text(),"Invoice Date")]/following-sibling::td/following-sibling::td

  - name: invNo
    xpath: //td[contains(@column,"INVC ")] |
      //td[contains(text(),"Invoice Number")]/following-sibling::td/following-sibling::td |
      //td[contains(@column,"INVOICE ")]
      

  - name: dueDte
    xpath: //td[contains(text(),"Pay Date")]/following-sibling::td/following-sibling::td |
      //td[contains(@column,"PAY")]
    regExp: (\d+)-(\d+)-(\d+)
    regExpReplace: $1$2$3

  - name: poNo
    xpath: //td[contains(@column,"PO ")] |
      //td[contains(text(),"PO ")]/following-sibling::td/following-sibling::td
  - name: grossAmt
    xpath: //td[contains(@column,"GROSS COST")] |
      //td[contains(text(),"Net Invoice Cost")]/following-sibling::td/following-sibling::td |
      //td[contains(text(),"Net Payment Amount")]/following-sibling::td/following-sibling::td |
      //td[contains(@column,"GROSS")]
    regExp: \$(.+)
    regExpReplace: $1

  - name: discAmtArray
    xpath: //td[contains(@column,"FRT DED") or contains(@column,"DISC AMT") or contains(@column,"ADJ AMT")]

  - name: adjReas

  - name: reasCodeArray
    xpath: //td[contains(@column,"RC")]
    defaultValue: "0"

  - name: invStatus
    xpath: //table//font

  - name: srchStatus
    xpath: ancestor::html//div[@id="srchStatus"]/@text
  - name: chkAmt
    xpath: ancestor::html//td[contains(text(),"Payment Amount")]/following-sibling::td/following-sibling::td
    regExp: \$(.+)
    regExpReplace: $1
  - name: netAmt
    xpath: //td[contains(@column,"NET AMT")]
  - name: strNo
    xpath: //td[contains(@column,"STR ")] |
      //td[contains(text(),"Store Number")]/following-sibling::td/following-sibling::td
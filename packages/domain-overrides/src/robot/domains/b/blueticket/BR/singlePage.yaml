singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventName
    xpath: //td[@class='nome depth_0']
  - name: eventDate
    xpath: //td[@class='data_inicio depth_0']
  - name: eventTime
    xpath: //td[@class='data_horario_exibicao depth_0']
  - name: buyTicketsButton
    xpath: //div[contains(@class, "action-bar")]/button/span/span[contains(text(), "Comprar Ingressos")]
  - name: selectTicketsIframe
    xpath: //iframe[contains(@src,"checkout")]/@src
  - name: selectTicketsTitle
    xpath: //div[@class="v-main__wrap"]//div[contains(@class, "row white--text")]
  - name: venueName
    xpath: //td[@class='local depth_0']/table/tbody/tr/td[contains(@class, 'nome ')]
  - name: venueCity
    xpath: //td[@class="cidade depth_0"]/table/tbody/tr/td[contains(@class, 'nome ')]
  - name: eventNotes
    xpath: '//div[@class="important-description"]//text() | //div[@class="important-subtitle"]//text()'
  - name: venueAddress
    xpath: //td[@class="local depth_0"]/table/tbody/tr/td[contains(@class, "endereco ")]
  - name: venueStateProvince
    xpath: //td[@class="cidade depth_0"]/table/tbody/tr/td[@class="estado depth_1"]
  - name: venueCountryCode
    defaultValue: 'BR'
  - name: firstDepthURL
    xpath: '//div[contains(@class, "action-bar")]/div/div[not(contains(text(), "Cancelado"))]'
  - name: eventUniqueId
    defaultValue: '1'
  - name: postalCode
    xpath: //td[@class="local depth_0"]/table/tbody/tr/td[contains(@class, "endereco ")]
    regExp: '[0-9\-\/]+$'
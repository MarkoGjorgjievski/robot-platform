singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "product__listing") and contains(@class, "product__grid")]/div[contains(@class,"col")]
fields:
  - name: brand
    xpath: .//div[contains(@class,"listing-brand")]
  - name: category
    xpath: ancestor::html//ol[@class="bunzl-breadcrumb"]
  - name: color
    xpath: //div[contains(@class, "listing-colour")]/span[contains(text(),"Colour")]/following-sibling::span
  - name: manufacturer
    xpath: .//div[contains(@class, "listing-manufacturer")]
    regExp: (?<=:\s).*
    defaultValue: null
  - name: price_excl_vat
    xpath: .//div/span[contains(@class, "exclVAT")]/preceding-sibling::span
    regExp: £(\d+.\d{2})
    regExpReplace: $1
  - name: price_incl_vat
    xpath: .//div/span[contains(@class, "inclVAT")]/preceding-sibling::span
    regExp: £(\d+.\d{2})
    regExpReplace: $1
  - name: currency
    xpath: .//div/span[contains(@class, "inclVAT")]/preceding-sibling::span
    regExp: (.)\d+.\d+
    regExpReplace: $1
  - name: product_code
    xpath: .//div[contains(@class, "listing-code")]
    regExp: (?<=:\s).*
  - name: product_name
    xpath: .//div[contains(@class, "listing-title")]
  - name: product_url
    xpath: .//div[contains(@class, "listing-title")]/a/@href
    regExp: (.+)
    regExpReplace: https://www.bunzlchs.com/$1
  - name: size
    xpath: .//div[contains(@class, "listing-size")]/span[contains(text(),"Size")]/following-sibling::span

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //div[contains(@class, 'card-body')]//p

  - name: listing_id
    xpath: //meta[@property='og:url']/@content
    regExp: \d+(?=\D*$)

  - name: product_variations
    xpath: //div[contains(@class,'bm-product-price-card')]//a[contains(@class, 'dropdown-item')]/@href

  - name: platform_category
    xpath: //nav[@aria-label="Breadcrumb"]/div/ul/li[position() = last() -1]

  - name: main_image
    xpath: //*[@id='bm-lightbox-link-1']//img/@src
    regExp: (.+)
    regExpReplace: https:$1
    downloadContent: 'text'
    
  - name: alternative_images
    xpath: //*[@role='listitem']//a/img/@data-src
    regExp: (.+)
    regExpReplace: https:$1

  - name: description
    xpath: //*[@itemprop='description']

  - name: pack_size 
    xpath: //div[contains(@class, 'card-body')]//p[contains(text(), 'pk')]
    regExp: (\d+)

  - name: weight_raw
    xpath: //*[@itemprop='description']
    regExp: '[Ww]eight:\s*(\d+([.,]?\d+))\s*(kg|g)\s'
    regExpReplace: $1
  
  - name: weight_unit
    xpath: //*[@itemprop='description']
    regExp: '[Ww]eight:\s*(\d+([.,]?\d+))\s*(kg|g)\s'
    regExpReplace: $3
    defaultValue: kg
    



  - name: sizes_raw
    xpath: //*[@itemprop='description']
    regExp: '[Ss]ize\s*:\W*(\d[^m"\n]+)'
    regExpReplace: $1


  - name: width
    xpath: //*[@itemprop='description']
    regExp: '([Dd]imension)s?\s*:[^\d.]*(\d+(\.?\d+)?)[^\d.]*(\d+(\.?\d+)?)?[^\d."m\n]*(\d+(\.?\d+)?)?'
    regExpReplace: $2
    defaultValue: 'null'

  - name: length
    xpath: //*[@itemprop='description']
    regExp: '([Dd]imension)s?\s*:[^\d.]*(\d+(\.?\d+)?)[^\d.]*(\d+(\.?\d+)?)?[^\d."m\n]*(\d+(\.?\d+)?)?'
    regExpReplace: $4
    defaultValue: 'null'

  - name: height
    xpath: //*[@itemprop='description']
    regExp: '([Dd]imension)s?\s*:[^\d.]*(\d+(\.?\d+)?)[^\d.]*(\d+(\.?\d+)?)?[^\d."m\n]*(\d+(\.?\d+)?)?'
    regExpReplace: $6
    defaultValue: 'null'

  - name: dimensions_unit
    xpath: //*[@itemprop='description']
    regExp: '[Dd]imensions?\s*:.*(cm|"|''|mm)'
    regExpReplace: $1
    defaultValue: 'null'

  - name: dimensions_unit_backup
    xpath: //*[@itemprop='description']
    regExp: '[Ss]ize\s*:.*(cm|"|''|mm)'
    regExpReplace: $1
    defaultValue: 'cm'




  - name: colour
    xpath: //*[@itemprop='description']
    regExp: '[Cc]olours?:\s*([\w, ]+)'
    regExpReplace: $1
    

  - name: materials_raw
    # xpath: //ul/li[contains(text(), '%')]
    xpath: //*[@itemprop='description']/p[strong[contains(text(), "Material")]]
    regExp: '[Mm]aterials?\s*:\s*([\w,%.: ]+)'
    regExpReplace: $1
    defaultValue: 'null'

  - name: materials_backup
    xpath: //*[@itemprop='description']/p[strong[contains(text(), "Material")]]/following-sibling::*[1]
    regExp: 's*([\w,%.: ]+)'


  - name: original_price
    xpath: //div[@itemprop='offers']//div[contains(@class, 'text-secondary')]/span[@itemprop='price'] | //div[@itemprop='offers']/span[contains(text(), 'WAS')]
    regExp: \d+(?:\.\d+)?

  - name: offer_price 
    xpath: //div[@itemprop='offers']//div[contains(@class, 'text-danger')]/span[@itemprop='price']

  - name: stock_availability
    defaultValue: "yes"

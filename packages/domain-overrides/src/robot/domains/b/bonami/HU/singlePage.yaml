singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[contains(@class, 'Heading_heading')]
  - name: listing_id
    xpath: //div[contains(@class, 'RightSection_productId')]
    regExp: (\d+)
  - name: product_variations
    xpath: //a[contains(@class, 'ProductVariants_desktop')]/@href | //a[contains(@class, 'ProductVariants_bubble')]/@href
  - name: offer_price
    xpath: //span[contains(@class, 'RightSection_customerPrice')]//ancestor::div[contains(@class, 'RightSection_price')]//div[contains(@class, 'RightSection_totalPrice')]//span[contains(@class, 'customerPriceAction')] | //span[contains(@class, 'RightSection_retailPrice')]//ancestor::div[contains(@class, 'RightSection_price')]//span[contains(@class, 'RightSection_customerPrice')]
    regExp: (\d+([ . ,  ]\d+)?)
  - name: original_price
    xpath: (//span[contains(@class, 'RightSection_withAction')] | //span[contains(@class, 'RightSection_retailPrice___eggy')] | //span[contains(@class, 'RightSection_active')][not(//span[contains(@class, 'RightSection_customerPrice')]//ancestor::div[contains(@class, 'RightSection_price')]//div[contains(@class, 'RightSection_totalPrice')]//span[contains(@class, 'customerPriceAction')] | //span[contains(@class, 'RightSection_retailPrice')]//ancestor::div[contains(@class, 'RightSection_price')]//span[contains(@class, 'RightSection_customerPrice')])] | //span[contains(@class, 'RightSection_customerPrice')][not(//span[contains(@class, 'RightSection_customerPrice')]//ancestor::div[contains(@class, 'RightSection_price')]//div[contains(@class, 'RightSection_totalPrice')]//span[contains(@class, 'RightSection_retailPrice_')])])[1]
    regExp: (\d+([ . ,  ]\d+)?)
  - name: platform_category
    xpath: (//div[contains(@class, 'UpperSection_upperSection')]//a[contains(@class, 'readCrumb_link')])[last() -2]
  - name: stock_availability
    xpath: //span[contains(text(), 'Kosárba')]
    defaultValue: 'no'
  - name: main_image
    xpath: (//div[contains(@class, 'ImageGallery_desktop')]//img)[last()]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: (//div[contains(@class, 'ImageGallery_desktop')]//img)[position() < last()]/@src
  - name: description
    xpath: (//div[contains(@class, 'PropertiesAndDescription_description')])[1]
#  - name: pack_size
#    xpath: not presented on the page
#    defaultValue: '1'
#    regExp: \d+
  - name: user_reviews
    xpath: //span[contains(text(), 'Értékelések')]
    regExp: (\d+)
  - name: average_rating
    xpath: //span[contains(@class, 'Rating_score_')]
  - name: dimensions_unit
    xpath:
    defaultValue: 'cm'
  - name: height
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'magasság')]/following-sibling::p
    regExp: (\d+([.,]\d+)?)
  - name: width
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'szélesség')]/following-sibling::p
    regExp: (\d+([.,]\d+)?)
  - name: depth
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'mélység')]/following-sibling::p
    regExp: (\d+([.,]\d+)?)
  - name: length
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'hosszúság')]/following-sibling::p
    regExp: (\d+([.,]\d+)?)
  - name: weight_unit
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'súly')]/following-sibling::p
    regExp: (?<=\d)[\s]*([a-zA-Z]+)
    defaultValue: 'kg'
  - name: weight_raw
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'súly')]/following-sibling::p
    regExp: (\d+([.,]\d+)?)
  - name: materials
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'anyag')]/following-sibling::p
  - name: colour
    xpath: //h1[contains(@class, 'Heading_heading')]
  - name: diameter
    xpath: //h4[contains(translate(text(), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'tmérő')]/following-sibling::p
    regExp: (\d+([.,]\d+)?)
  - name: product_details
    xpath: //div[contains(@class, 'ProductPropertyGroup_properties')]
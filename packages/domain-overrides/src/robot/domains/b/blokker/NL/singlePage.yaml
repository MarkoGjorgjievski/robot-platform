singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //h1[contains(@class, "product-name")]
  
  - name: listing_id
    # xpath: //span[contains(@class, "attribute__label") and contains(text(), "EAN")]/following-sibling::span
    xpath: //div[@data-action="Product-Show"]/@data-querystring
    regExp: (\d+)
    regExpReplace: $1
  
  - name: original_price
    xpath: //div[contains(@class, "product-detail__price")]//span[contains(@class, "strike-through")]/span|//div[contains(@class, "product-detail__price")]//span[contains(@class, "sales") and not(./preceding-sibling::span[contains(@class, "strike-through")])]/span
  
  - name: offer_price
    xpath: //div[contains(@class, "product-detail__price")]//span[contains(@class, "strike-through")]/following-sibling::span/span
  
  - name: platform_category # might require /a
    xpath: //ol[contains(@class, "breadcrumb")]/li[last()]
  
    # NOT FOUND
  - name: product_variations
    # xpath: 

  - name: stock_availability
    #test if this works
    xpath: //span[contains(@class, "product-detail__availability availability product-availability")]/@data-available

  - name: main_image
    xpath: //figure[@aria-hidden="false"]//img/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //figure[@aria-hidden="true"]//img/@src

  - name: description
    xpath: //div[@id="product-detail__longdescription"]
 
  - name: pack_size
    defaultValue: 'null'
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Aantal")]/following-sibling::span
    regExp: ^\d+$

  - name: pack_size_backup
    xpath: //h1[contains(@class, "product-name")]|//div[@id="product-detail__longdescription"]
    regExp: (\d+)(\s[Ss]tuks)
    regExpReplace: $1
    
  - name: user_reviews
    xpath: //span[contains(@class, "review-rating__amount-link")]
    regExp: (\d+)
    regExpReplace: $1

  - name: average_rating
    xpath: //section[contains(@class, "product-detail__bordered-section")]//div[contains(@class, "review-rating")]//span[contains(@class, "visually-hidden")]
    regExp: ([\d,.]+)
    regExpReplace: $1
    # this one includes only the written revies:
    # xpath: //div[contains(@class, "reviews-details__average-rating__rating")]
    
    



  - name: dimensions_unit
    defaultValue: "null"
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Afmeting")]
    regExp: \((.+)\)
    regExpReplace: $1


  - name: dimensions_unit_backup
    defaultValue: "cm"
    xpath: //div[@id="product-detail__longdescription"]
    regExp: '[aA]fmeting.*:\s*(ca)?[^cm]+(mm|cm|m)'
    regExpReplace: $2


  - name: height
    defaultValue: 'null'
    # xpath: 
  
  - name: width
    defaultValue: 'null'
    # xpath: 
    
  - name: length
    defaultValue: 'null'
    # xpath: 
    
  - name: depth
    defaultValue: 'null'
    # xpath: 
    
  - name: diameter
    defaultValue: 'null'
    # xpath: 

  - name: dimensions_raw
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Afmeting")]/following-sibling::span
    regExp: (.+)\((.+)\)
    regExpReplace: $1

  - name: dimensions_raw_labels
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Afmeting")]/following-sibling::span
    regExp: (.+)\((.+)\)
    regExpReplace: $2

  - name: dimensions_raw_backup
    xpath: //div[@id="product-detail__longdescription"]
    regExp: '[aA]fmetingen[^:(]*(\([^)]+\))?:\s*(ca\.)?([\d x.,()-]+)[cm]?m\s*(\([^)]+\))?'
    regExpReplace: $3

  - name: dimensions_raw_labels_backup
    xpath: //div[@id="product-detail__longdescription"]
    regExp: '[aA]fmetingen[^:(]*(\([^)]+\))?:\s*(ca\.)?([\d x.,()-]+)[cm]?m\s*(\([^)]+\))?'
    regExpReplace: $1$4

  - name: dimensions_raw_unlabeled
    xpath:  //span[contains(@class, "attribute__label") and contains(text(), "Afmeting")]/following-sibling::span
    regExp: '(\d[\d.,mcx ]*\d)'
    regExpReplace: $1


  - name: dimensions_raw_unlabeled_backup
    xpath: //div[@id="product-detail__longdescription"]
    regExp: '([aA]fmeting.*:?\s*(.*)?|Buitenmaat.*):( ca.)?\s*(([\d.,]+)([cmx ]*([\d.,]+))?([cmx ]*([\d.,]+))?)\s*cm'
    regExpReplace: $4



  - name: length_fallback
    xpath: //div[@id="product-detail__longdescription"]
    regExp: '[Ll]engte.*:\s*([\d.,]+)'
    regExpReplace: $1


  - name: height_fallback
    xpath: //div[@id="product-detail__longdescription"]
    regExp: '[Hh]oogte.*:\s*([\d.,]+)'
    regExpReplace: $1

  - name: weight_unit
    defaultValue: 'null'
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Gewicht")]
    regExp: \((.+)\)
    regExpReplace: $1
    # change gr to g transform

  - name: weight_unit_backup
    xpath: //div[@id="product-detail__longdescription"]
    regExp: 'Gewicht\s*:\s*(ca\.)?\s([\d.,]+)\s*(.*)'
    regExpReplace: $3


  - name: weight_raw
    defaultValue: 'null'
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Gewicht")]/following-sibling::span

  - name: weight_raw_backup
    xpath: //div[@id="product-detail__longdescription"]
    regExp: 'Gewicht\s*:\s*(ca\.)?\s([\d.,]+)'
    regExpReplace: $2

  - name: volume 
    xpath: //span[contains(@class, "attribute__label") and contains(text(), "Inhoud")]/following-sibling::span

  - name: materials
    xpath:  //div[contains(@class, "product-detail__attributes-container")] 
    regExp: \bMateriaal\s*:\s*(\w([A-Z% \/:\-()\d]+([a-z %\/:\-()\d]+)?|[a-z %:\-()\d]+(\/[a-z %\:\-()\d]+)?)(, [A-Za-z][a-z :\d%]+|, [A-Z]+(:\s*[\d%]+)?)*)
    regExpReplace: $1
    defaultValue: empty

  - name: materials_backup
    xpath:   //div[@id="product-detail__longdescription"]
    regExp: \bMateriaal\s*:\s*(\w([A-Z% \/:\-()\d]+([a-z %\/:\-()\d]+)?|[a-z %:\-()\d]+(\/[a-z %\:\-()\d]+)?)(, [A-Za-z][a-z :\d%]+|, [A-Z]+(:\s*[\d%]+)?)*)
    regExpReplace: $1


  - name: colour
    xpath:  //div[contains(@class, "product-detail__attributes-container")] | //div[@id="product-detail__longdescription"]
    regExp: Kleur\s*:\s*(.+)
    regExpReplace: $1

  - name: product_details
    xpath: //div[contains(@class, "product-detail__attributes-container")]

  - name: currency
    # xpath: 
  
  - name: listing_url
    # xpath: 

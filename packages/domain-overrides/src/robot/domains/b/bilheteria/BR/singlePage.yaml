    xpath: //td[@class="id_base depth_0"]
  - name: codPeca
    xpath: //td[@class="CodPeca depth_0"]
  - name: eventName
    xpath: //td[@class="NomPeca depth_0"]
  - name: eventDate
    xpath: //td[@class="day depth_0"] # how to add //td[@class="day depth_0"] + //td[@class="year depth_0"] ? 

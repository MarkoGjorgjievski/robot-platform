singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:


  # - name: product-data
  #   xpath: //script[@id="product-data"]
  #   jq: .

  - name: product_title
    xpath: //script[@id="product-data"]
    jq: .[0].product.name
  - name: listing_id
    xpath: //script[@id="product-data"]
    jq: .[0].product.code_a
  - name: offer_price
    xpath: //script[@id="product-data"]
    jq: .[0].product.price.o_price
  - name: original_price
    xpath: //script[@id="product-data"]
    jq: .[0].product.price.f_price
  - name: platform_category
    xpath: //script[@id="product-data"]
    jq: .[0].product.hierarchy.[-1]
  - name: product_variations
    xpath: //ul[contains(@class, "colors_list")]/li/a/div/@color | //ul[contains(@class, "product_preview-variants pdp")]/li[@class="color"]//img/@data-color
  - name: stock_availability
    defaultValue: "1"
    xpath: //button[@id="js_add_to_cart_desktop"][contains(text(), "AGOTADO")] | //button[contains(@class, "product_detail-add_to_cart")][contains(text(), "Agotado")] | //button[contains(@class, "product_detail-add_to_cart")][contains(text(), "AGOTADO")]
    regExp: "AGOTADO"
    regExpReplace: "0"
  - name: main_image
    xpath: //div[1]/div[1]/div[1]/img[contains(@class, "layout-img")] | (//img[contains(@class, "carousel-elements__item_img")])[1]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //img[contains(@class, "layout-img")]/@src | //img[contains(@class, "carousel-elements__item_img")]/@src
  - name: description
    xpath: //div[@class="container_pdd_h1_h2"] | //div[contains(@class, "product_detail-description")]
  - name: product_details
    xpath: //div[contains(@class, "block__container block__container--fit")]
  - name: product_extra_details
    xpath: //div[contains(@class, "block__title")][contains(text(), "Otros datos de interés")]/parent::dl
  - name: pack_size
    xpath: //script[@id="product-data"]
    jq: .[0].product.quantity
  - name: user_reviews
    xpath: //div[contains(@class, "bv_numReviews_text")]
    regExp: '\d+'
  - name: average_rating
    xpath: //div[contains(@class, "bv_avgRating_component_container")]
    regExp: '(\d+\.\d+)|(\d+)'

  # - name: user_reviews
  #   xpath: //td[@class="numReviews depth_1"]
  #   regExp: '\d+'
  # - name: average_rating
  #   xpath: //td[@class="average depth_2"]


  - name: dimensions_unit
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Medidas")]
    regExp: '\s(cm)|(m)|(mm)\s*'
    regExpReplace: '$1$2$3'
  - name: height
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Medidas")]
    regExp: '(\d+)\s\(alto\)|(\d+\.\d+)\s\(alto\)|(\d+,\d+)\s\(alto\)'
    regExpReplace: '$1$2$3'
  - name: width
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Medidas")]
    regExp: '(\d+)\s\(ancho\)|(\d+\.\d+)\s\(ancho\)|(\d+,\d+)\s\(ancho\)'
    regExpReplace: '$1$2$3'
  - name: length
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Medidas")]
    regExp: '(\d+)\s\(largo\)|(\d+\.\d+)\s\(largo\)|(\d+,\d+)\s\(largo\)'
    regExpReplace: '$1$2$3'
  - name: diameter
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Diámetro")]
    regExp: '(\d+\.\d+)|(\d+)\s(cm)|(m)|(mm)'
    regExpReplace: '$1$2'
  - name: depth
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Profundidad")]
    regExp: '(\d+\.\d+)|(\d+)\s(cm)|(m)|(mm)'
    regExpReplace: '$1$2'
  - name: weight_unit
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Peso")]
    regExp: '\s(g)|(kg)|(mg)\s*'
    regExpReplace: '$1$2$3'
  - name: weight_raw
    xpath: //*[contains(@class, "size-attributes__item")][contains(text(), "Peso")]
    regExp: '(\d+\.\d+)|(\d+)\s(g)|(kg)'
    regExpReplace: '$1$2'

  - name: materials
    xpath: //dt[@class="titleInfoProduct"][contains(text(), "Material")]/following-sibling::dd | //p[contains(@class, "composition__title")][contains(text(), "Material")]/parent::div/p[contains(@class, "composition__value")]
  - name: colour
    xpath: //div[contains(@class, "product_detail-colors")] | (//div[contains(@class, "product_preview-variants-thumbnail")][contains(@class, "selected")])[1]//img/@data-color
  - name: product_details
    defaultValue: ""

  - name: listing_url
    xpath: //meta[@name="twitter:url"]/@content


  - name: product_exists
    xpath: //*[@class="ratingRange depth_2"]





  

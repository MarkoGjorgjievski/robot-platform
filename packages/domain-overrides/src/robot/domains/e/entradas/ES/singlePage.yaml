singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:

  - name: eventName
    xpath: //script[@id="event-data"]
    jq: '.[0].event_name'

  - name: venueName
    xpath: //script[@id="event-data"]
    jq: '.[0].event_venue_name'

  - name: venueCity
    xpath: //script[@id="event-data"]
    jq: '.[0].event_city_name'

  - name: eventDate
    xpath: //script[@id="event-data"]
    jq: '.[0].event_date'

  - name: eventTime
    xpath: //script[@id="event-data"]
    jq: '.[0].event_date'

  - name: isDateTimeTBA
    xpath: //script[@id="event-data"]
    jq: '.[0].event_date'

  - name: isPublicPurchase
    xpath: //script[@id="event-data"]
    jq: '.[0].event_tickets_available'
  
  - name: publicPurchaseOverride
    xpath: boolean(//span[contains(@data-qa, "ticket-status") and not(contains(@data-qa, "ticket-status-mobile"))][contains(text(), "Próximamente a la venta") or contains(text(), "Cancelado")])

  - name: eventNote
    xpath: //div[contains(@class, "alert-warning")][.//div[contains(@class, "moretext-teaser")]]//div[contains(@class, "moretext-teaser")] | //div[contains(@class, "alert-warning")][not(.//div[contains(@class, "moretext-teaser")])]

  - name: postalCode
    xpath: //script[@id="event-data"]
    jq: '.[0].event_postal_code'

  - name: venueAddress
    defaultValue: 'null'
    xpath: //div[@class="venue-address"]/p

  - name: venueAddressBackup
    xpath: //span[@data-qa="event-venue"]
    regExp: '\| (.+),'
    regExpReplace: $1

  - name: onSaleDate
    xpath: //section[@data-c="onsalehint"]//h2

  - name: firstDepthURL
    xpath: //td[@class="link depth_1"] | //a[contains(@id,"item")][contains(@class,"theme-button")]/@href

  - name: eventURL
    xpath: //a[@data-qa="continue-button"][./preceding-sibling::span[not(contains(@class, "event-not-available"))]]/@href

  - name: eventUniqueId
    xpath: //meta[@property="og:url"]/@content
    regExp: '-(\d+)/'
    regExpReplace: $1

  - name: venueCountryCode
    defaultValue: 'ES'

  - name: timeCheck
    xpath: //time

  - name: onSaleDateTime
    xpath: //body[//section[@data-c="onsalecountdown"]]//script[@type="application/ld+json"]
    jq: .offers.validFrom

  - name: onSaleDate
    xpath: //body[//section[@data-c="onsalecountdown"]]//script[@type="application/ld+json"]
    jq: .offers.validFrom
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventURL
    xpath: //a[contains(@class, "m-eventListItem")]/@href
    regExp: (.+)
    regExpReplace: https://eventim.si$1
  - name: searchResultURL
    xpath: //a[contains(@class, "m-searchListItem")]/@href
    regExp: (.+)
    regExpReplace: https://eventim.si$1

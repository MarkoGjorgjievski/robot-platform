singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventName
    xpath: //div[contains(@class, 'o-eventPresentation__data m-pageHeader__sectionBlock')]/h1

  - name: venueName
    xpath: //div[contains(@class, 'o-eventPresentation__data m-pageHeader__sectionBlock')]/div[1]
    regExp: (.+), ([^,]+)
    regExpReplace: $1

  - name: venueCity
    xpath: //div[contains(@class, 'o-eventPresentation__data m-pageHeader__sectionBlock')]/div[1]
    regExp: (.+), ([^,]+)
    regExpReplace: $2

  - name: eventDate
    xpath: //div[contains(@class, 'o-eventPresentation__data m-pageHeader__sectionBlock')]/div[2]
    regExp: ', (\d+\/\d+\/\d+)( at (\d+:\d+))?'
    regExpReplace: $1

  - name: eventTime
    defaultValue: '13:00'
    xpath: //div[contains(@class, 'o-eventPresentation__data m-pageHeader__sectionBlock')]/div[2]
    regExp: ', (\d+\/\d+\/\d+)( at (\d+:\d+))?'
    regExpReplace: $3

  - name: isDateTimeTBA
    defaultValue: '1'
    xpath: //div[contains(@class, 'o-eventPresentation__data m-pageHeader__sectionBlock')]/div[2]
    regExp: ', \d+\/\d+\/\d+ at (\d+:\d+)?'
    regExpReplace: '0'

  - name: isPublicPurchase
    defaultValue: '1'

 
  - name: postalCode
    defaultValue: 'null'
    
    
  - name: venueAddress
    defaultValue: 'null'
    

  - name: eventUniqueId
    xpath: //link[@rel="canonical"]/@href
    regExp: (\d+)\/performance\.html
    regExpReplace: $1
  
  - name: eventURL
    xpath: //link[@rel="canonical"]/@href

# regex for dates
#   (\d+[.\/]\d+[.\/]\d+)


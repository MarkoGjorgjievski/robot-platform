singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[@type="application/ld+json"][2]
    jq: '.name'

  - name: listing_id
    xpath: //*[@type="application/ld+json"][2]
    jq: '.sku'

  - name: offer_price
    xpath: //*[@type="application/ld+json"][2]
    jq: '.offers.price'

  - name: original_price
    xpath: (//div[@class="product-detail-grid"]//div[@class="price-formatted"])[1]
    regExp: '(\d*.\d{1,2})|(\d*)'

  - name: platform_category
    xpath: //li[@class="breadcrumb-item"][last()]/a//text()

  # - name: product_variations
    # xpath: //li[@class="list-item"]//a//@href
    # regExp: '(\/[^"]{1,})'
    # regExpReplace: 'https://www2.hm.com$1'

  - name: stock_availability
    xpath: //*[@type="application/ld+json"][2]
    jq: 'if .offers.availability  == "http://schema.org/InStock" then 1 else 0 end'

  - name: main_image
    xpath: //*[@type="application/ld+json"][2]
    downloadContent: 'text'
    jq: '.image[0]'

  - name: alternative_images
    xpath: //*[@type="application/ld+json"][2]
    jq: '.image'

  - name: description
    xpath: //*[@type="application/ld+json"][2]
    jq: '.description'

  # - name: pack_size
    # xpath: >
    #  //li[@class="b815ab"][2]

  # - name: user_reviews
    # xpath: //*[@type="application/ld+json"][2]
    # jq: '.aggregateRating.reviewCount'
    # defaultValue: "0"

  # - name: average_rating
    # xpath: //*[@type="application/ld+json"][2]
    # jq: '.aggregateRating.ratingValue'
    # defaultValue: "0.0"

  - name: dimensions

  - name: dimensions_unit
    defaultValue: "cm"

  - name: height
    xpath: //div[@id="collapsible-dimensions"]//li[contains(.,"Height")]//text()
    regExp: '(?<=Height:\s)(\d*)|(\d*\.\d{1,3})'

  - name: width
    xpath: //div[@id="collapsible-dimensions"]//li[contains(.,"Width")]//text()
    regExp: '(?<=Width\/Depth:\s)(\d*)|(\d*\.\d{1,3})'

  - name: length
    xpath: //div[@id="collapsible-dimensions"]//li[contains(.,"Length")]//text()
    regExp: '(?<=Length:\s)(\d*)|(\d*\.\d{1,3})'

  - name: weight

  - name: weight_unit
    xpath: //div[@id="collapsible-dimensions"]//li[contains(.,"Weight")]//text()
    regExp: '([a-zA-Z]{1,10}$)'
    defaultValue: "kg"

  - name: weight_raw
    xpath: //div[@id="collapsible-dimensions"]//li[contains(.,"Weight")]//text()
    regExp: '(?<=Weight:\s)(\d*)|(\d*\.\d{1,3})'

  - name: materials
    xpath: //div[@id="collapsible-dimensions"]//td[contains(.,"Material")]//following-sibling::td

  # - name: colour
    # xpath: //*[@type="application/ld+json"][2]
    # jq: '.color'

  - name: currency
    xpath: //*[@type="application/ld+json"][2]
    jq: '.offers.priceCurrency'
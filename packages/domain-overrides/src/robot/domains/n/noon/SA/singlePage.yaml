singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: '//h1[contains(@data-qa, "pdp-name")]'

  - name: 'product_details'
    xpath: '//div[contains(@class, "oPZpQ")]'

  - name: "listing_id"
    xpath: //td[contains(text() ,"Model Number")]/following-sibling::td
    defaultValue: 'dummy'

  - name: 'offer_price'
    xpath: '//div[contains(@class, "priceNow")]'
    regExp: '\b\d+\.\d+\b'

  - name: 'original_price'
    xpath: '//div[contains(@class, "priceWas")]'
    regExp: '\b\d+\.\d+\b'

  - name: "platform_category"
    xpath: '(//div[@data-qa="breadcrumbs-list"])[last()]'

  - name: "main_image"
    xpath: //script[@id="__NEXT_DATA__"]
    regExp: image_keys":\["([^"]+)
    regExpReplace: https://f.nooncdn.com/p/$1.jpg
    downloadContent: 'text'

  - name: "alternative_images"
    xpath: ''
    defaultValue: 'dummy'

  - name: 'colour'
    xpath: //td[contains(text() ,"Colour")]/following-sibling::td

  - name: 'average_rating'
    # xpath: (//div[contains(text(), "Overall Rating")]/following-sibling::div//text())[1]
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.catalog.product.reviews.summary.averageRating


  - name: 'user_reviews'
    # xpath: //div[contains(text(), "Overall Rating")]/following-sibling::div//text()[contains(.,'rating')]
    # regExp: '\d+'
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.catalog.product.reviews.summary.ratingCount

  - name: 'product_variations_data'
    xpath: //script[@id="__NEXT_DATA__"]

  - name: 'product_variations'
    defaultValue: 'dummy'

  - name: 'stock_availability'
    xpath: 'boolean(not(//div[contains(@id, "_next")]//*[contains(text(),"Sorry! This product is not available.")] ))'

  - name: 'pack_size'
    xpath: //td[contains(text() ,"Item Qty")]/following-sibling::td
    regExp: \d+
    defaultValue: 1

  - name: 'currency'
    xpath: '//div[contains(@class, "priceNow")]'
    regExp: '(SAR)\s\d+(\.\d+)?'
    regExpReplace: '$1'

  - name: 'materials'
    xpath: //td[contains(text() ,"Material")]/following-sibling::td

  - name: 'weight_unit'
    xpath: //td[contains(text() ,"Weight")]/following-sibling::td
    regExp: '\d+(\.\d+)?\s*(\b\w+\b)$'
    regExpReplace: '$2'

  - name: 'weight_raw'
    xpath: //td[contains(text() ,"Weight")]/following-sibling::td
    regExp: '(\d+(\.\d+)?)\s*\b\w+\b$'
    regExpReplace: '$1'
  
  - name: 'size_raw'
    xpath: //td[contains(text() ,"Size")]/following-sibling::td
    
  - name: 'volume'
    xpath: //td[contains(text() ,"Capacity")]/following-sibling::td
    regExp: '([\d.,]+)\s*m?l'
    regExpReplace: '$1'

  - name: 'length'
    xpath: //td[contains(text() ,"Length")]/following-sibling::td
    regExp: '(\d+(\.\d+)?)\s*\b\w+\b$'
    regExpReplace: '$1'

  - name: 'height'
    xpath: //td[contains(text() ,"Height")]/following-sibling::td
    regExp: '(\d+(\.\d+)?)\s*\b\w+\b$'
    regExpReplace: '$1'

  - name: 'width'
    xpath: //td[contains(text() ,"Width")]/following-sibling::td
    regExp: '(\d+(\.\d+)?)\s*\b\w+\b$'
    regExpReplace: '$1'

  - name: 'depth'
    xpath: //td[contains(text() ,"Depth")]/following-sibling::td
    regExp: '(\d+(\.\d+)?)\s*\b\w+\b$'
    regExpReplace: '$1'

  - name: 'dimensions_unit'
    xpath: //td[contains(text() ,"Height")]/following-sibling::td
    regExp: '\b(\d+(\.\d+)?)\s*(\b\w+\b)$'
    regExpReplace: '$3'


  - name: product_details
    # xpath: //section[./header[contains(text(), "Overview")]]
    xpath: (//span[contains(text(), "Specifications")]/following-sibling::div)[1]


  - name: description
    # xpath: //meta[@name="description"]/@content
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.catalog.product.feature_bullets[]
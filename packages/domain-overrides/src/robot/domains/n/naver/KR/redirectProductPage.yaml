singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: channelUID
    xpath: //*[@id="preLoaded"]
    jq: 'if .channel then .channel[].channelUid else .smartStoreV2.channel.channelUid end'
  - name: details
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[] else "" end'
  - name: id
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[].id else "" end'
  - name: channel
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[].channel.channelUid else "" end'
  - name: accountNo
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[].channel.accountNo else "" end'
  - name: category
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[].category.wholeCategoryId else "" end'
  - name: lastCategoryID
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[].category.categoryId else "" end'
  - name: productNo
    xpath: //*[@id="preLoaded"]
    jq: 'if .product then .product[].productNo else "" end'

## benefits count
  - name: benefitsCount
    xpath: //*[@id='benefitsCount']
    jq: .value

## brandPage redirect
  - name: brandPageRedirect
    xpath: (//div[@id="content"]//div/a[@data-shp-area-id="pd" and @data-shp-area="list.pd"])[1]

## searchForRequests POST
  - name: benefitsOptions1
    xpath: //div[@class="postBenefits" and contains(@url, "optimize-benefits-options")][1]
    jq: '.body'
    defaultValue: '{}'
  - name: benefitsOptions2
    xpath: //div[@class="postBenefits" and contains(@url, "optimize-benefits-options")][2]
    jq: '.body'
    defaultValue: '{}'
  - name: optimizeBenefitsMain

  ## searchForRequests GET
  - name: benefits
    xpath: //div[@class="getBenefits" and contains(@url, "productNo") and contains(@url, "v1/channels")][1]
    jq: '.body'
    defaultValue: '{}'
  - name: benefitsByProducts
    xpath: //div[@class="getBenefits" and contains(@url, "by-products")]
    jq: '.body'

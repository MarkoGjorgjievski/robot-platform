    jq: '.body'
    defaultValue: '{}'
  - name: optimizationOptions1
    xpath: //div[@class="postBenefits" and contains(@url, "optimization-options")]1]
    jq: '.body'
    defaultValue: '{}'
  - name: optimizationOptions2
    xpath: //div[@class="postBenefits" and contains(@url, "optimization-options")][2]

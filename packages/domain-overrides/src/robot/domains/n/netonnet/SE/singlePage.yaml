singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //div[contains(@class,'panel-main-body')]//div/h2

  - name: listing_id
    xpath: //div[contains(@class, 'subTitle')]/span
    regExp: (\d+)

  - name: platform_category
    xpath: //ol[contains(@class, 'breadcrumb')]/li[position() = last() -1]/a

  - name: main_image
    xpath: //div[contains(@class, 'owl-item active')]//div[contains(@class, 'item')]//img/@src
    regExp: (.+)
    regExpReplace: https://www.netonnet.se$1
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[@class='owl-item']//div[contains(@class, 'item')]//img/@data-src
    regExp: (.+)
    regExpReplace: https://www.netonnet.se$1

  - name: offer_price
    xpath: //div[contains(@class, 'col-xs-6')]/div[contains(@class, 'price-big')]
    regExp: ([\d ]+)

  - name: original_price
    xpath: //div[contains(@class, 'col-xs-6')]/div[contains(@class, 'strike-through')] | //div[contains(@class, 'col-xs-12')]/div[contains(@class, 'price-big')]
    regExp: ([\d ]+)
    defaultValue: 'null'

  - name: product_details
    xpath: //div[contains(@class, 'product-usps')]

  - name: user_reviews 
    xpath: //a[@data-action='writeReview']/span[last()]
    regExp: (\d+)

  - name: average_rating
    xpath: //span[contains(@class, 'totalRating')]

  - name: description
    xpath: //div[@id='collapseFive']//div[contains(@class,'row')]

  - name: stock_availability
    xpath: //div[contains(@class, 'deliveryInfoText')] | //div[contains(@class, 'historical-product')]
    regExp: I lager
    regExpReplace: 'yes'
    defaultValue: 'no'

  - name: product_variations
    xpath: //div[contains(@class, 'swatchContainer')]/div/@data-url
    regExp: (.+)
    regExpReplace: https://www.netonnet.se$1

  - name: colour
    xpath: //div[@id='collapseOne']//table/tbody//td[contains(text(), "Färg")]/following-sibling::td
    regExp: ^[^\d]+$

  - name: materials
    xpath: //div[@id='collapseOne']//table/tbody//td[contains(text(), "material")]/following-sibling::td

  - name: pack_size
    xpath: //div[contains(@class,'panel-main-body')]//div/h2[contains(text(), 'pack')]
    regExp: (\d+)

  - name: specifications
    xpath: //div[@id='collapseOne']//table/tbody | //div[@id='collapseFive']//div[contains(@class,"row")][position() = last()]

  - name: dimensions_raw
    xpath: //div[@id='collapseOne']//table/tbody//td[contains(text(), "Mått")]/following-sibling::td

  - name: dimensions_unit
  # contains(text(), "Höjd") | contains(text(), "Längd") | contains(text(), "Bredd") | contains(text(), "Djup") | contains(text(), "Mått")
    xpath:  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Mått")]/following-sibling::td |  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Höjd")]/following-sibling::td |  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Bredd")]/following-sibling::td | //div[@id='collapseOne']//table/tbody//td[contains(text(), "Djup")]/following-sibling::td  | //div[@id='collapseOne']//table/tbody//td[contains(text(), "Längd")]/following-sibling::td
    regExp: \d\s*(mm|cm)
    regExpReplace: $1
    defaultValue: 'cm'

  - name: height
    xpath: //div[@id='collapseOne']//table/tbody//td[contains(text(), "Höjd")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1
    defaultValue: 'null'

  - name: length
    xpath: //div[@id='collapseOne']//table/tbody//td[contains(text(), "Längd")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1
    defaultValue: 'null'

  - name: width
    xpath: //div[@id='collapseOne']//table/tbody//td[contains(text(), "Bredd")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1
    defaultValue: 'null'
  
  - name: depth
    xpath:  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Djup")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1

  - name: volume
    xpath:  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Vattenbehållarens kapacitet")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1

  - name: diameter
    xpath:  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Diameter")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1

  - name: weight_raw
    xpath:  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Vikt")]/following-sibling::td
    regExp: ([\d.]+)
    regExpReplace: $1

  - name: weight_unit
    xpath:  //div[@id='collapseOne']//table/tbody//td[contains(text(), "Vikt")]/following-sibling::td
    regExp: \d\s*(kg|g)(ram)?
    regExpReplace: $1
    defaultValue: 'kg'
    
  
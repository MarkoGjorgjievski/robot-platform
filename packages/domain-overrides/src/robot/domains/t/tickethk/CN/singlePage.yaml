singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: > 
  //div[@id="buyImportantInfo" and .//text()[not(contains(., "$0"))]]
  /ancestor::html//div[contains(@class, "buyTicketsInformation")]
  //select//option[@value!=""] 
  | 
  //div[@id="buyImportantInfo" and .//text()[not(contains(., "$0"))]]
  /ancestor::html//div[contains(@class, "buyTicketsInformation")]
  //strong[contains(text(), "Date")]/ancestor::p/text()[normalize-space()!='']
fields:
  - name: eventName
    xpath: ancestor::html//h1[contains(@class, "sectionHeading")]
  - name: venueName
    xpath: ancestor::html//div[contains(@class, "buyTicketsInformation")][not(contains(@class, "perfSelecterNote"))]/p[1]/text()
  - name: eventDateTimeText
    xpath: //text()
  - name: eventNotes
    xpath: ancestor::html//div[contains(@class, "moreEventPageInfo") and .//h3[contains(text(), "Admission")]]//text()
  - name: onSaleDateTime
    xpath: > 
      ancestor::html//div[@id="buyImportantInfo"]//*[contains(
      translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'public sale') or contains(
      translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'start sales date')]
      /following-sibling::font[@size="2"]//text() 
      | 
      ancestor::html//div[@id="buyImportantInfo"]//*[contains(
      translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'public sale') or contains(
      translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'start sales date')]
      /following::text()
    regExp: '\d{1,2} \w+ \d{4} \(\w{3}\).+\d{1,2}(:\d{2})?.+'
  - name: preSaleDateTime
    xpath: >
      ancestor::html//div[@id="buyImportantInfo"]//font[@color="0000FF"]
      //text()
      | 
      (ancestor::html//div[@id="buyImportantInfo"]//font[@color="0000FF"]
      /following::text()[not(contains(., "["))])[1]
    regExp: '\d{1,2} \w+ \d{4} \(\w{3}\).+\d{1,2}(:\d{2})?.+'
  - name: venueCity
    defaultValue: "Hong Kong"
  - name: countryCode
    defaultValue: "CN"
  - name: isPublicPurchase
    xpath: ancestor::html
    defaultValue: "0"
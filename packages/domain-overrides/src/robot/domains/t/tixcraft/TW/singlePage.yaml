singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: >
  //tr[@data-key][./td[not(contains(text(), "Cancelled"))]]
  |
  //*[contains(@id, "synopsis-container")][not(//*[contains(@class, 'buy')])] 
fields:
  - name: eventName
    xpath: //td[2]
  - name: eventNameTmp
    xpath: ancestor::html//h1[@id="synopsisEventTitle"]
  - name: eventDate
    xpath: //td[1] # | ancestor::html//div[@id="activityTabContent"]//*[contains(text(), "Show Date")]
    regExp: \d{4}\/\d{2}\/\d{2}
  - name: isPublicPurchase
    defaultValue: 0
  - name: isDateTimeTBA
    defaultValue: 0
  - name: eventTime
    xpath: //td[1] # | ancestor::html//div[@id="activityTabContent"]//*[contains(text(), "Show Date")]
    regExp: \d{2}\:\d{2}
  - name: eventTimeTmp
    xpath: >
     //*[contains(@id, 'activityTabContent')]//p//span[contains(.,'演出時間') and contains(@style, 'font-family')]/text()[1]
     | 
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Show Date')]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Date & Time')]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Event Time')][not(//*[contains(text(), 'VIP')])]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'賽事時間')]
    defaultValue: 'Nothing'
  - name: eventDateTmp
    xpath: >
     //*[contains(@id, 'activityTabContent')]//p//span[contains(.,'演出時間') and contains(@style, 'font-family')]/text()[1]
     | 
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Show Date')]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Date & Time')]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Event Time')][not(//*[contains(text(), 'VIP')])]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'賽事時間')]
  - name: venueName
    xpath: //td[3] #//div[@id="gameList"]/table/tbody/tr[1]/td[3]
  - name: venueNameTmp
    xpath: >
     //*[contains(@id, 'activityTabContent')]//p//span[contains(.,'演出地點') and contains(@style, 'font-family')]/text()[1]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'Venue')]
     |
     //*[contains(@id, 'activityTabContent')]//p//text()[contains(.,'地點')]
  - name: onSaleDateTime
    xpath: >
     ancestor::html//*[@id="intro"]//*[contains(text(), "General Sale") and not(contains(text(), "Additional"))]
     |
     ancestor::html//*[@id="intro"]//*[contains(text(), "All ticket on sale")] 
     | 
     ancestor::html//*[@id="intro"]//*[contains(text(), "【售票時間】")]
     | 
     ancestor::html//*[@id="intro"]//*[contains(text(), "開賣時間")] 
     | 
     ancestor::html//*[@id="intro"]//*[contains(text(), "售票日期")] 
     | 
     ancestor::html//*[@id="intro"]//*[contains(text(), "拓元售票 全面開賣")]
     | 
     ancestor::html//*[@id="intro"]//*[contains(text(), "開賣時間")]
  - name: preSaleDate
    xpath: >
     ancestor::html//*[@id="intro"]//*[contains(text(), "Early bird tickets on sale")]
     |
     ancestor::html//*[@id="intro"]//*[contains(text(), "Presale")][1]
  - name: buyTicket
    xpath: //td[4][contains(., "Find tickets")]

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[@id="eventos"]/ul[contains(@class, "events_list")]/li | //*[@id="eventList"]/ul[contains(@class, "events_list")]/li
fields:
  - name: eventURL
    xpath: //a/@href
    jq: '"https://ticketline.sapo.pt" + .'
  - name: monthLink
    xpath: ancestor::html//*[@id="eventos"]/header/div[2]/ul[contains(@class, "month")]/li/a/@href
    jq: '"https://ticketline.sapo.pt" + .'
  - name: secondDepthURL
    xpath: //a/@href
    jq: '"https://ticketline.sapo.pt" + .'

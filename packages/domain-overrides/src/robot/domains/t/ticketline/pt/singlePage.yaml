singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[@id="eventList"]/ul/li[@itemprop="Event"] | //*[contains(@id, "calendarData_")]
fields:
  - name: eventName
    xpath: ancestor::html//h2[@class="title"]
  - name: eventNote
    xpath: ancestor::html//p[@class="age"]
  - name: eventDateTime
    xpath: //div[@class="date"]/@content
  - name: venueName
    xpath: //a/div[@class="details"]/div[@itemprop="location"]/p[@class="venue"]
  - name: venueCity
    xpath: //a/div[@class="details"]/div[@itemprop="location"]/p[@itemprop="address"]/span[@class="district"]
  - name: jsonVenueName
    xpath: //text()
    jq: '.venue.name'
  - name: jsonVenueCity
    xpath: //text()
    jq: '.venue.municipalityName'
  - name: jsonEventDateTime
    xpath: //text()
    jq: '.id.utc'
  - name: jsonIsPublicPurchase
    xpath: //text()
    jq: if (.isBlocker) then "0" else "1" end
  - name: isPublicPurchase
    xpath: self::li[not(.//*[contains(text(), 'sem_disponibilidade')])]//p[@class="buy button"]/text()
    jq: if (. == "Buy") then "1" else "0" end
  
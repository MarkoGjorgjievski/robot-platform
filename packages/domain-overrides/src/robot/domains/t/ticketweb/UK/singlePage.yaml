singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 - name: eventName
   xpath: '//script[@type="application/ld+json"][contains(text(),"name")]'
   jq: '.name'
 - name: eventDateTime
   xpath: '//script[@type="application/ld+json"][contains(text(),"startDate")]'
   jq: '.startDate'
 - name: venueName
   xpath: '//script[@type="application/ld+json"][contains(text(),"location")]'
   jq: '.location.name'
 - name: venueCountryCode
   xpath: '//script[@type="application/ld+json"][contains(text(),"addressCountry")]'
   jq: '.location.address.addressCountry'
   defaultValue: 'GB'
 - name: venueCity
   xpath: '//script[@type="application/ld+json"][contains(text(),"addressLocality")]'
   jq: '.location.address.addressLocality'
 - name: postalCode
   xpath: '//script[@type="application/ld+json"][contains(text(),"postalCode")]'
   jq: '.location.address.postalCode'
 - name: eventNotes
   xpath: '//*[contains(@class,"info-price")]//*[contains(@class,"info-content")] | //*[contains(@class,"info-item")]//p | //*[contains(@class,"terms-conditions")]'
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: firstDepthURL
    xpath: //span[@itemprop="location"]/a/@href
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://www.tickster.com$1'
  - name: eventName
    xpath: //h1[@itemprop="name"]
  - name: eventDateTime
    xpath: //span[@itemprop="startDate"]/@content
  - name: isPublicPurchase
    xpath: //a[contains(@class, "c-button--primary")][contains(text(), "Köp biljett")][@itemprop="url"]
    regExp: '([^\s]+ [^\s]+)'
    regExpReplace: '1'
    # defaultValue: '1'
    # xpath: //div[contains(@class, "c-box--warning")]//p[contains(text(), "Det är inte möjligt att köpa biljetter till detta evenemang.")]
    # regExp: '.*'
    # regExpReplace: '0'
  - name: venueName
    xpath: //span[@itemprop="location"]//span[@itemprop="name"] 
  - name: venueCity
    xpath: //h2//span[@itemprop="addressLocality"]
  - name: venueAddress
    xpath: //h2//span[@itemprop="streetAddress"]
  - name: eventURL
    xpath: //meta[@property="og:url"]/@content
  - name: eventUniqueId
    xpath: //meta[@property="og:url"]/@content
    regExp: '(?<=\/)([a-zA-Z0-9]+)(?=\/\d{4}-\d{2}-\d{2}\/)'
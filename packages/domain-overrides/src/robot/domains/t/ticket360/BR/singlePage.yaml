singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventName
    xpath: //div[@id="contents"]//div[contains(@class, "m-portlet")]//div[contains(@class, "m-portlet__body")]//h4/text()
  - name: eventDateTimeText
    xpath: //div[@id="contents"]//div[contains(@class, "m-portlet")]//div[contains(@class, "m-portlet__body")]//p//text()
  - name: venueName
    xpath: //div[@id="contents"]//div[contains(@class, "m-portlet")]//div[contains(@class, "m-portlet__body")]//div[contains(@class, "notranslate")]//strong/text()
  - name: venueFullAddressText
    xpath: //div[@id="contents"]//div[contains(@class, "m-portlet")]//div[contains(@class, "m-portlet__body")]//div[contains(@class, "notranslate")]/text()
  - name: countryCode
    defaultValue: BR
  - name: eventNotes
    xpath : //div[@id="contents"]//div[contains(@class, "m-portlet")]//div[contains(@class, "m-portlet__body")]//div[contains(@class, "col-lg-4")][last()]/text() | //div[@id="m_accordion_event"]//div[@id="m_accordion_event_item_5_body"]//text()
  - name: isFreeXPath
    xpath: //div[@id="contents"]//div[contains(@class, "m-portlet")]//div[contains(@class, "m-portlet__body")]//div[contains(@class, "col-lg-4")][last()]/text()[contains(., "ivre")]
  - name: canBuyTickets
    xpath: //div[@class="full-buy"]/a/span/span/text()[.="COMPRAR"]
  - name: ticketingComingSoon
    xpath: //div[@id='controleVendas']//h5[text()="As vendas iniciam em"]
  - name: onSaleDateTimeText
    xpath: //div[@id='controleVendas']//div[contains(@class, "soon")]/@data-due
  - name: soldOutText
    xpath: //div[@id="contents"]//h4[contains(text(), "esgotados")]
  - name: postalCode
    xpath: //script[@type="application/ld+json"][contains(text(), "postal")]/text()
    jq: '.[0].value.value[] | select(.key == ["location"]) | .value.value[] | select(.key == ["address"]) | .value.value[] | select(.key == ["postalCode"]) | .value'

#Event with ticketing coming soon: https://www.ticket360.com.br/evento/27697/ingressos-para-capital-inicial-40

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: json_data
    xpath: (//html/body/*[contains(.,"window.INITIAL_DATA")])[1] #//script[@data-ot-ignore][contains(.,"componentsData ")]
    regExp: JSON\.parse\('(.*?)'\)
    regExpReplace: $1
  - name: product_title
  - name: listing_id
  - name: offer_price
  - name: original_price
  - name: platform_category
  - name: product_variations
  - name: stock_availability
  - name: main_image
    xpath: (//*[contains(@id,'maincontent')]//img)[1]/@src
    regExp: (.+)
    regExpReplace: https://www.trademax.se$1
    downloadContent: 'text'
  - name: alternative_images
    xpath: //main/div[2]/div[1]/div/div[1]//img/@src
    regExp: (.+)
    regExpReplace: https://www.trademax.se$1
    defaultValue: 'dummy'
  - name: description    
  - name: pack_size
    defaultValue: "1"
  - name: user_reviews
    defaultValue: "0"
  - name: average_rating
    defaultValue: "0.0"
  - name: dimensions
  - name: dimensions_unit
    defaultValue: "cm"
  - name: height
    defaultValue: 0
  - name: width
    defaultValue: 0
  - name: length
    defaultValue: 0
  - name: depth
    defaultValue: 0
  - name: diameter
    xpath: (//td[contains(text(),'Diameter')]/following-sibling::td)[1]
  - name: weight
    defaultValue: 0
  - name: weight_unit
  - name: weight_raw
  - name: materials
    xpath: (//td[contains(text(),'Material')]/following-sibling::td)[1]
  - name: colour
    xpath: (//td[contains(text(),'Färg')]/following-sibling::td)[1]
  - name: product_details
    xpath: //*[contains(text(),'Översikt')]/parent::h3/following-sibling::div//ul//li



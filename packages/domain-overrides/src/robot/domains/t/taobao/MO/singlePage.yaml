singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //div[contains(@class, "item-title")]
  
  - name: listing_id
    xpath: //meta[@property="og:url"]/@content
    regExp: (\d+)\.htm
    regExpReplace: $1
  
  - name: original_price
    xpath: //span[contains(@class, "currency")]
    regExp: ([\d.]+)
  
  # doesn't appear on product pages
  # - name: offer_price
    # xpath: 
  
  - name: platform_category
    xpath: //div[@data-spm="breadcrumb"]/a[last()]
  
  # can't extract seperate links
  # - name: product_variations
    # xpath: 

  - name: stock_availability
    defaultValue: 'no'
    xpath: //div[contains(@class, "add-cart-box")]
    regExp: (.+)
    regExpReplace: 'yes'

  - name: main_image
    xpath: //div[@class="rax-view-v2 left-intro"]/div[@class="rax-view-v2 bottom"]/div[1]/img/@src
    regExp: (.+)
    regExpReplace: https:$1
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[@class="rax-view-v2 bottom"]/div[position()>1]/img/@src
    regExp: (.+)
    regExpReplace: https:$1


  - name: description
    xpath: //meta[@name="description"]/@content
 
  - name: pack_size
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "包裝數量")]
  
  - name: user_reviews
    xpath: //div[contains(@class, " rate-container")]/div[contains(@class, "top")]
    regExp: (\d+)
    regExpReplace: $1
  
  - name: average_rating
    xpath: //div[contains(@class, "positive-rate-num")]


  - name:  dimensions_raw 
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "尺寸")]
    regExp: ：([^,]+),
    regExpReplace: $1
    

  - name: dimensions_unit
    defaultValue: "cm"

  - name: height
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "高度")]
    regExp: ([.\d]+\s*(mm|cm|m)?)([^\d]*)$
    regExpReplace: $1
    defaultValue: 'null'

  - name: width
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "顏色分類")]
    regExp: ：[^寬]*寬([\d.]+(cm|mm|m)?)
    regExpReplace: $1
    # 寬
    defaultValue: 'null'
    
  - name: length
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "長度")]
    regExp: ([.\d]+\s*(mm|cm|m)?)([^\d]*)$
    regExpReplace: $1
    # thickness 厚度
    defaultValue: 'null'



  - name: weight_raw
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "毛重")]
    regExp: ([.\d]+)
    regExpReplace: $1

  - name: weight_unit
    defaultValue: "kg"

 


  - name: materials
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "材質")]
    regExp: '：(.+)'
    regExpReplace: $1  

  - name: colour
    xpath: //ul[contains(@class, "info")]/li[contains(text(), "顏色")]
    # get
    regExp: '：([^ ]+)'
    regExpReplace: $1
# \p{Han} seems to be broken
#    regExp: '(\p{Han}*[粉红橙黄绿蓝紫蓝白灰褐黑棕咖棕金银]\p{Han}*)'


  - name: product_details
    xpath: //div[@id="detail-block"]


singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventCategory
    xpath: //ol[@data-testid="breadcrumb"]/li[position()=2]/a[not(contains(@href,"artist"))] | (//ul/li[@class="breadcrumbs__item"]/a[not(contains(@href,"artist"))])[position()=1] | (//ul/li[@class="breadcrumbs__item"]/text())[position()=1]
  - name: eventCategoryURL
    xpath: //ol[@data-testid="breadcrumb"]/li[position()=2]/a[not(contains(@href,"artist"))]/@href | (//ul/li[@class="breadcrumbs__item"]/a[not(contains(@href,"artist"))]/@href)[position()=1]
  - name: eventSubcategory
    xpath: //ol[@data-testid="breadcrumb"]/li[position()=3]/a[not(contains(@href,"artist"))] | (//ul/li[@class="breadcrumbs__item"]/a[not(contains(@href,"artist"))])[position()=2] | (//ul/li[@class="breadcrumbs__item"]/text())[position()=2]
  - name: eventSubcategoryURL
    xpath: //ol[@data-testid="breadcrumb"]/li[position()=3]/a[not(contains(@href,"artist"))]/@href | (//ul/li[@class="breadcrumbs__item"]/a[not(contains(@href,"artist"))]/@href)[position()=2]
  - name: eventSeriesName
    xpath: //ol[@data-testid="breadcrumb"]/li/a[contains(@href,"artist")] | //ul/li[@class="breadcrumbs__item"]/a[contains(@href,"artist")]
  - name: eventSeriesURL
    xpath: //ol[@data-testid="breadcrumb"]/li/a[contains(@href,"artist")]/@href | (//ul/li[@class="breadcrumbs__item"]/a[contains(@href,"artist")]/@href)
  - name: eventName
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //div[@id="my-data"] | //script[@data-store="event_info"]
    jq: .name // .page.attributes.eventName
  - name: eventDateStart
    xpath: //div[@id="my-data"]
    jq: .page.attributes.eventDateStart
  - name: eventDate
    xpath: //script[@type="application/ld+json"][not(contains(.,"BreadcrumbList"))]
    jq: .startDate
  - name: eventTime
    xpath: //script[@type="application/ld+json"][not(contains(.,"BreadcrumbList"))]
    jq: .startDate
  - name: backupEventTime
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]
    jq: (if .eventDateTime then .eventDateTime | [.month,.day,.year,.time] | join(" ") else null end) // .startDate
  - name: eventTimeSlotFromPage
    xpath: //*[contains(@class, "qFqxT") and @data-section-name]/@data-section-name
  - name: eventDescription
    xpath: concat(//h4[contains(text(),"Please Note")]//following-sibling::*,//h4[contains(text(),"Event Info")]//following-sibling::*)
  - name: eventFeatures
    xpath:
  - name: eventReviewCount
    singleValue: true
    xpath:
  - name: eventReviewRating
    singleValue: true
    xpath:
  - name: eventRules
    xpath: //h4[contains(text(),"Ticket Limits")]//parent::div | //h4[contains(text(),"Further Information")]//parent::div
  - name: eventURL
    singleValue: true
    xpath: //link[@rel="canonical"]/@href
  - name: isDateTimeTBA
    defaultValue: "0"
    xpath: //section[@aria-label="Event Header"]//*[contains(text(), "Date TBA")]
    regExp: (.*)
    regExpReplace: "1"
  - name: eventStatus
    xpath: //h3[contains(text(),"General Onsale")] | //div/@eventstatusraw
    jq: if . == "Cancelled" then "CANCELLED" else "ACTIVE" end
  - name: eventStatusRaw
    xpath: //h3[contains(text(),"General Onsale")] | //div/@eventstatusraw
  - name: isPublicPurchase
    xpath: //h3[contains(text(),"General Onsale")] | //div/@eventstatusraw
    jq: if (. == "Cancelled" or . == "Postponed") then "FALSE" else "TRUE" end
  - name: isPublicPurchaseRaw
    xpath: //h3[contains(text(),"General Onsale")] | //div/@eventstatusraw
  - name: ticketsMaxPrice
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))]
    jq: .offers.highPrice
  - name: ticketsMinPrice
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))]
    jq: .offers.lowPrice
  - name: ticketsOnSaleDateTimeRaw
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"] | //div[@id="my-data"]
    jq: (.offers.availabilityStarts) // (.page.attributes.eventOnsaleDateTime) // (.onsaleStartDateTime | [.month,.day,.year,.time] | join(" "))
  - name: ticketsPreSaleDateTimeRaw
    xpath: //h3[contains(text(),"Presale") or contains(text(),"Priority")]//parent::div//parent::div//span[contains(text(),"From")]//following-sibling::span
  - name: ticketsPrices
  - name: ticketsPricesTypes
  - name: venueAddress1
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]
    jq: .location.address.streetAddress // .venue.location.streetAddress1
  - name: venueAddress2
    singleValue: true
    xpath:
  - name: venueAddressRaw
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]
    jq: .location.address.streetAddress // .venue.location.streetAddress1
  - name: venueCapacity
    singleValue: true
    xpath:
  - name: venueCity
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]  | //div[@id="my-data"]
    jq: .location.address.addressLocality // .page.attributes.city // .venue.location.city
  - name: currentCountryCode
    xpath: //div/@eventcategoryurl
    regExp: >-
      (?<=ticketmaster.)([a-z,.]+)(?=\/)
  - name: venueCountryCode
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]  | //div[@id="my-data"]
    jq: ((.venue.location.country) // (.page.attributes.country) // (.location.address.addressCountry) // "") | if .=="Belgium" then "BE" elif .=="Sweden" then "SE" elif .=="Denmark" then "DK" elif .=="Germany" then "DE" elif .=="Spain" then "ES" elif .=="ND" then "GB" else . end
  - name: isInternational
    defaultValue: "FALSE"
  - name: venueName
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]  | //div[@id="my-data"]
    jq: .location.name // .page.attributes.venueName // .venue.name
  - name: venuePostalCode
    xpath: //script[@type="application/ld+json" and not(contains(text(),"Breadcrumb"))] | //script[@data-store="event_info"]  | //div[@id="my-data"]
    jq: .location.address.postalCode // .page.attributes.zip // .venue.location.zip
  - name: venueRawText
    xpath: //span[contains(text(),"Venue")]//following-sibling::span | //div[@class="eventcard__body__venue"]
  - name: venueRawScript
    xpath: //div[@id="my-data"]
    jq: .page.attributes.venueName
  - name: venueReviewCount
    singleValue: true
    xpath:
  - name: venueReviewRating
    singleValue: true
    xpath:
  - name: venueRules
    xpath:
  - name: venueStateProvince
    xpath: //div[@id="my-data"]
    jq: .page.attributes.state
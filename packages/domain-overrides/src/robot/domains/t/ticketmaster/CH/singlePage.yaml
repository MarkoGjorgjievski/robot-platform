singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventName
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.name'
  - name: eventDateTimeStart
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.dates.startDate'
  - name: eventDateTime
    xpath: '//*[@type="application/ld+json"][contains(text(),"startDate")]'
    jq: '.startDate'
  - name: eventDateTimeDoor
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.ada.hours'
  - name: venueName
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.name'
  - name: venueCity
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.city'
  - name: eventNotes
    xpath: '//h3[@data-testid="eventDetails"]/following-sibling::div[2]/div'
  - name: venueCountryCode
    defaultValue: 'CH'

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventName
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.name'
  - name: eventDateTime
    xpath: '//script[@type="application/ld+json"][contains(text(), "startDate")]'
    jq: '.startDate'
  - name: venueName
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.name'
  - name: venueCity
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.city'
  - name: venueAddress
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.streetAddress'
  - name: postalCode
    xpath: '//script[@id="__NEXT_DATA__"]'
    jq: '.props.pageProps.initialReduxState.eventInfo.venue.zip'
  - name: venueCountryCode
    defaultValue: 'NL'
  - name: eventNote
    xpath: '//section[@data-testid="panel"]//h3[@data-testid="eventDetails"]/following-sibling::div[./h4[contains(text(), "Let op") or contains(text(), "Eventinformation")]]/div'

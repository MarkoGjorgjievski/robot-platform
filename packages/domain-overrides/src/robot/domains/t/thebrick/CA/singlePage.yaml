singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //h1[contains(@class, "product-name")]
  
  - name: listing_id
    xpath: //div[contains(@id, "product-sidebar-container")]//span[contains(@class,"variant-sku")]
    regExp: SKU:\s(.+)
    regExpReplace: $1

  - name: original_price
    defaultValue: "0"
  
  - name: offer_price
    defaultValue: "0"
    
  - name: price 
    xpath: //span[contains(@id,"productPrice")]
    regExp: (\d*),?([\d.]+)
    regExpReplace: $1$2

  - name: on_sale
    xpath: //span[contains(@id,"productPrice")]/@data-on-sale

  # target english if two variants available
  - name: platform_category
    xpath: //ol[contains(@class, "breadcrumb")]/li[last()]//span[not(contains(@class, "langFR"))]
  
  - name: product_variations
    defaultValue: "null"
  - name: variants
    xpath: //script[@id="dynamic-data-full"]/text()

  - name: stock_availability
    defaultValue: "no"
    xpath: //div[contains(@class, "available") and not(contains(@class, "not-available"))]/@id
    regExp: (.+)
    regExpReplace: "yes"

  - name: main_image
    xpath: //div[contains(@class, "zoom-gallery-slide")]//img/@src
    regExp: (.+)
    downloadContent: 'text'
    regExpReplace: https:$1
  
  - name: alternative_images
    xpath: //div[contains(@id, "carousel")]//img/@src
    regExp: (.+)
    regExpReplace: https:$1
  
  - name: description
    xpath: //div[contains(@data-pdpd, "description")]
 
  - name: pack_size
    xpath: //div[contains(@id, "pdpd-specs")]//td[p[contains(text(), "Package Size")]]/following-sibling::td/p
    regExp: (\d+)
    regExpReplace: $1

  - name: user_reviews
    xpath: //div[contains(@id, "pr-reviewdisplay")]//span[contains(@class, "pr-snippet-review-count")]
    regExp: (\d+)
    regExpReplace: $1
  
  - name: average_rating
    xpath: //div[contains(@id, "pr-reviewdisplay")]//h1[contains(@class, "pr-review-snapshot-snippets-headline")]

  - name: dimensions_unit
    defaultValue: "cm"

  - name: height
    xpath: //div[contains(@class, "product-dimensions")]//h4[text()="Dimensions"]/following-sibling::p/span[contains(text(), "Height")]
    regExp: \(([\d.]+)
    regExpReplace: $1

  
  - name: width
    xpath: //div[contains(@class, "product-dimensions")]//h4[text()="Dimensions"]/following-sibling::p/span[contains(text(), "Width")]
    regExp: \(([\d.]+)
    regExpReplace: $1

  - name: length
    xpath: //div[contains(@class, "product-dimensions")]//h4[text()="Dimensions"]/following-sibling::p/span[contains(text(), "Length")] | //div[contains(@class, "product-dimensions")]//h4[text()="Dimensions"]/following-sibling::p/span[contains(text(), "Depth")]
    regExp: \(([\d.]+)
    regExpReplace: $1
    
  - name: weight_unit
    defaultValue: "kg"

  - name: weight_raw
    xpath:  //div[contains(@class, "product-dimensions")]//h4[text()="Weight"]/following-sibling::p/span
    regExp: \(([\d.]+)
    regExpReplace: $1

  - name: materials
    xpath: //div[contains(@id, "pdpd-specs")]//td[p[contains(text(), "Material")]]/following-sibling::td/p/b

  - name: colour
    xpath: //div[contains(@id, "pdpd-specs")]//td[p[contains(text(), "Finish Colour")]]/following-sibling::td/p

  - name: product_details
    xpath: //div[contains(@role, "tabpanel")]/div[contains(@id, "pdpd-specs")] | //div[contains(@id, "tab2") ] 

  - name: listing_url
    xpath: //link[@rel="canonical"]/@href

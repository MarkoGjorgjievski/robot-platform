singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: brand
    xpath: //h1

  - name: brandVariant
    xpath: //h1

  - name: inStockOnline
    xpath: //button[contains(@data-testid,"cart-action-pdp") and @disabled]
    regExp: (.*)
    regExpReplace: 'no'
    defaultValue: 'yes'

  - name: inStockStore
    xpath: //button[.//text()[contains(., 'In-Store')] and contains(@aria-roledescription, 'selected')]
    regExp: (.*)
    regExpReplace: 'yes'
    defaultValue: 'no'

  - name: isBundle
    xpath: //button[contains(@aria-label,"Get Deal")]
    regExp: (.+)
    regExpReplace: 'yes'
    defaultValue: 'no'

  - name: bundleSKU3
    xpath: //div[contains(text(), 'Save on')]

  - name: manufacturerPartNumber
    xpath: //div[contains(@data-testid,"partNumber-container")]
    regExp: Part\s*#?\s*([A-Za-z0-9]+)
    regExpReplace: $1

  - name: masterBrand
    xpath: //h1

  - name: mutlipackFlag
    defaultValue: 'no data found'
  
  - name: mutlipackQuantity
    defaultValue: 'no data found'

  - name: packSize
    xpath: //th[contains(text(),'Container')]/following-sibling::td
    regExp: \d+(\.\d+)?
    defaultValue: 'dummy'

  - name: packSizeUnit
    xpath: //th[contains(text(),'Container')]/following-sibling::td
    regExp: '[a-zA-Z]+'
    defaultValue: 'dummy'

  - name: packSizeBackup
    xpath: //h1

  - name: productDescription
    xpath: //div[./*[@data-testid="product-description-heading"]]/div | //h2[contains(text(),'PRODUCT DESCRIPTION')]/following-sibling::div

  - name: productName
    xpath: //*[@data-testid="product-title"]

  - name: productRating
    xpath: //script[@type = 'application/ld+json' and contains(text(), '"AggregateRating"')]
    jq: .aggregateRating.ratingValue

  - name: productVariant
    xpath: //*[@data-testid="product-title"]

  - name: promotionDescription
    defaultValue: 'no data found'

  - name: quantity
    defaultValue: '1'

  - name: ratingCount
    xpath: //script[@type = 'application/ld+json' and contains(text(), '"AggregateRating"')]
    jq: .aggregateRating.reviewCount

  - name: retailPrice
    xpath: //div[contains(@data-testid,"price-fragment")]/span[contains(text(),'Total price is')]

  - name: RRP_Was
    xpath: //script[@type = 'application/ld+json' and contains(text(), '"@type":"Product"')]
    jq: .offers.priceSpecification| map(select(.priceType == "https://schema.org/ListPrice") | .price)| .[0]

  - name: sku
    xpath: //div[contains(@data-testid,"product-sku-number")]
    regExp: SKU\s*#?\s*(.+)
    regExpReplace: $1
  
  - name: specificationProfile
    xpath: //li//text()[contains(.,'Meets') and not(contains(.,'industry standards'))]
    defaultValue: 'no data found'

  - name: startingPriceType
    xpath: //*[contains(@data-m-id,'strikeThroughPrice')]
    regExp: (.+)
    regExpReplace: 'Was'
    defaultValue: 'RRP'

  - name: viscosity
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.initialProps.pageProps.dehydratedState.queries[]| select(.state?.data?.pdpResults? != null)| .state.data.pdpResults.products[].productAttributes[]| select(.name == "SAE Oil Weight")| .value
    defaultValue: empty

  - name: viscocity_backup
    xpath: //*[@data-testid="product-title"]
    regExp: \d+[Ww]-\d+

  - name: rawAvailabilityMessage
    xpath: //div[contains(@data-testid,"wrapper-add-to-cart")]/preceding-sibling::div/div[last()]//div[contains(@data-testId, 'subgroup')]

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: category
    singleValue: false
    xpath:  //nav[@aria-label="breadcrumbs"]//li[position()>1]
  - name: subCategory
    singleValue: false
    xpath: //ul[contains(@class, "breadcrumb")]//li[contains(@itemprop,"itemListElement")][position()>2]
  - name: flavour
    singleValue: false
    xpath: //div[@class="swatch-container"]//select/option | //label[contains(text(),'Flavors')]//parent::p//span[contains(@class,'disabled')]//a
  - name: pageTitle
    singleValue: true
    xpath: //head//title
  - name: name
    singleValue: false
    xpath: //h1[@class="product-details_title"] | //article[@id="main-product"]//h1
  - name: image
    singleValue: false
    xpath: //meta[@property="og:image"]/@content
    regExp: (.*alternativepods\.com)(.+)|(.+)
    regExpReplace: https://alternativepods.com$2$3
  - name: reviewCount
    singleValue: false
    # xpath: (//span[contains(@class, "jdgm-prev-badge__text") and contains(text(),"review")])[1]
    xpath: //div[@class="product-info_reviews"]//span[@class="spr-badge-caption"] | //div[@class="tabs-inner"]//header//p
    regExp: (.+)((have|has) reviewed this product)
    regExpReplace: $1
  - name: sku
    singleValue: false
    xpath: //span[contains(text(),'SKU')]//parent::p | //input[@name="product_id"]/@value
    regExp: SKU:(.+)|(\d+)
    regExpReplace: $1$2
  - name: sku2
    xpath: //@data-product-id
  - name: brandText
    singleValue: false
    defaultValue: 'Vape'
  - name: brandTextN
    singleValue: false
    defaultValue: 'VAPE'
  - name: input_brandTextN
    singleValue: false
    defaultValue: 'VAPE'
  - name: reviewsUrl
    singleValue: true
    xpath: //meta[@property="og:url"]/@content
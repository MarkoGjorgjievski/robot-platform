singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //ul[contains(@id,"collection")]//li | //div[@class="spr-review"]
fields:
  - name: id
    singleValue: false
    xpath: //div[@id="main-collection-product-grid"]/product-card//div[@class="card-figcaption-body"]/a/@data-product-id
  - name: name
    singleValue: false
    description: The product name
    xpath: //div[@id="main-collection-product-grid"]/product-card//header//h3 | //div[contains(@class,"product-info")]//h3[contains(@class,"product-title")] | //ul[contains(@id,"collection")]/li//h3/a
  - name: productUrl
    singleValue: false
    xpath: //div[@id="main-collection-product-grid"]/product-card//header//h3/a/@href | //div[contains(@class,"product-info")]//h3[contains(@class,"product-title")]/a/@href | //ul[contains(@id,"collection")]/li//h3/a/@href
    regExp: (.+)
    regExpReplace: https://alternativepods.com$1
  - name: thumbnail
    singleValue: false
    xpath: //div[@id="main-collection-product-grid"]/product-card//img/@srcset | //ul[contains(@id,"collection")]/li//@src
  - name: price
    singleValue: false
    description: The offered price for the product
    xpath: //div[@id="main-collection-product-grid"]/product-card//div[@class="product-price"]/div | //ul[contains(@id,"collection")]/li//div[@class="static"]/p[@class="price"]
  - name: brandTextN
    singleValue: false
    # defaultValue: 'Vape'
  - name: brandText
    singleValue: false
    defaultValue: 'Vape'
  - name: sku
    singleValue: false
    xpath: //div[@id="main-collection-product-grid"]/product-card//div[@class="card-figcaption-body"]/a/@data-product-id
  - name: helpfulCount
    singleValue: false
    type: NUMBER
    description: Number of people who said the review was helpful
  - name: commentCount
    singleValue: true
    type: NUMBER
    description: Number of comments on the review
  - name: brandText
    singleValue: false
    defaultValue: 'Vape'
  - name: input_brandTextN
    singleValue: false
    defaultValue: 'Vape'
  - name: name
    singleValue: false
    # xpath: ancestor::html//div[@class="productView-product"]//h1[@class="productView-title"]
    xpath: ancestor::html//div[@class="product-info_title"]//h1
  - name: sku
    singleValue: false
    xpath: ancestor::html//input[@name="product_id"]/@value
    # xpath: ancestor::html//div[@class="product-details_sku"]
    description: The store-specific product identifier
  - name: reviewDate
    singleValue: false
    # xpath: //p[@class="productReview-author"]
    xpath: //span[contains(text(),"on")]/strong//following-sibling::strong
  - name: validateReviewDate
    singleValue: false
    defaultValue: '1'
  - name: reviewDateRaw
    singleValue: false
    # xpath: //p[@class="productReview-author"]
    xpath: //span[contains(text(),"on")]/strong//following-sibling::strong
  - name: reviewRating
    singleValue: false
    # xpath: //span[@itemprop="reviewRating"]/span[@class="productReview-ratingNumber"]
    xpath: //span[@class="spr-starratings spr-review-header-starratings"]/@aria-label
    regExp: (\d)(.+)
    regExpReplace : $1
  - name: reviewRatingText
    singleValue: false
    xpath: //span[@itemprop="reviewRating"]/span[@class="productReview-ratingNumber"]
  - name: reviewText
    singleValue: false
    xpath: //p[@class="spr-review-content-body"]
  - name: reviewTitle
    singleValue: false
    # xpath: //li[@class="productReview"]//h5[@class="productReview-title"]
    xpath: //h3[@class="spr-review-header-title"]
  - name: reviewerTags
    singleValue: false
    description: The tags a reviewer has
  - name: gtin
    singleValue: true
    description: GTIN code (includes UPC/EAN)
  - name: productUrl
    singleValue: true
    description: The url of the product details page
  - name: verifiedPurchase
    singleValue: false
    # xpath: 
    description: Whether this of an item, the reviewer purchased. "Yes" if true else ""
  - name: manufacturerResponse
    singleValue: true
    description: The response of the manufacturer (if any)
  - name: syndicatedFrom
    singleValue: true
    description: Stated place the review was syndicated from
  - name: reviewUrl
    singleValue: true
    description: A direct link to the review
  - name: reviewedSku
    singleValue: false
    xpath: ancestor::html//input[@name="product_id"]/@value
    description: The SKU of the item that was reviewed (may be different from the
      sku the review was shown on). 1 if sku == reviewedSku else 0. Get sku
      value, transform will handle the value.
  - name: user
    description: The user name of the reviewer
    type: TEXT
  - name: aggregateRating
    description: The product rating
  - name: maxDays
    description: Max Days
    xpath: ancestor::html//script[@id="__input"]
    type: NUMBER
    jq: .days
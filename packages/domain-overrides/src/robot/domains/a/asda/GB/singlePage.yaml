singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[contains(@class, "pdp-main-details__title")]
 
  - name: listing_id
    xpath: //*[contains(@class, "pdp-main-details__product-code")]
    regExp: '\d+'
 
  - name: original_price
    xpath: //*[contains(@class, "co-product__price pdp-main-details__price")]
    regExp: '\d+.\d+'
    defaultValue: 0
 
  - name: exPrice
    xpath: //*[contains(@class, "co-product__was-price pdp-main-details__was-price")]
    regExp: '\d+.\d+'

  - name: platform_category
    xpath: //*[contains(@class, "asda-link asda-link--primary breadcrumb__link")][last()]/text()
 
  - name: stock_availability
    xpath: boolean(//*[contains(@class, "pdp-main-details__actions-cntr")]//*[@data-auto-id="btnAdd"])
 
  - name: main_image
    xpath: //*[contains(@class, "asda-image-zoom__container product-detail-page__zoomed-image product-detail-page__zoomed-image--selected")]//*[contains(@class, 'asda-image-zoom__zoomed-image-container asda-image-zoom__zoomed-image-container--hide')]//@src
    downloadContent: 'text'
  
  - name: alternative_images
    xpath: //*[contains(@class, "asda-image-zoom__container product-detail-page__zoomed-image")][not(contains(@class, 'selected'))]//*[contains(@class, 'asda-image-zoom__zoomed-image-container asda-image-zoom__zoomed-image-container--hide')]//@src
  
  - name: pack_size
    xpath: //*[contains(@class, "pdp-main-details__weight")]
  
  - name: user_reviews
    xpath: //*[contains(@class, 'cms-modules cms-modules--visible')]//script
    jq: '.aggregateRating.reviewCount'

  - name: average_rating
    xpath: //*[contains(@class, 'cms-modules cms-modules--visible')]//script
    jq: '.aggregateRating.ratingValue'

  - name: description
    xpath: //*[contains(@class, 'pdp-description-reviews__product-details-cntr')]/..
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title 
    xpath: //div[contains(@class,'product-content')]//h1

  - name: listing_id
    xpath: //div[contains(@class,'product-number')]//span

  - name: offer_price
    xpath: ''

  - name: original_price
    xpath: (//input[contains(@name,'price')])[1]/@value

  - name: platform_category
    xpath: //ul[contains(@class,'breadcrumbs')]//li[last()-1]

  - name: product_variations
    xpath: ''

  - name: stock_availability
    xpath: ''
    defaultValue: 'yes'

  - name: main_image
    xpath: (//div[contains(@class,'product-image-container')]//img)[1]/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[contains(@class,'product-image-container')]//img[contains(@class,'zoomImg')]/@src

  - name: description
    xpath: (//div[contains(@class,'product-details')]/text())[1]

  - name: pack_size
    xpath: ''
    defaultValue: '1'

  - name: user_reviews
    xpath: ''

  - name: average_rating
    xpath:

  - name: dimensions_unit
    xpath: //ul[contains(@class,'dimension')]//li[contains(text(),'Height')]
    regExp: :?([a-zA-Z]+)\s*$

  - name: height
    xpath: //ul[contains(@class,'dimension')]//li[contains(text(),'Height')]
    regExp: '(\d+(?:,|.\d+)?)'

  - name: depth
    xpath: //ul[contains(@class,'dimension')]//li[contains(text(),'Depth')]
    regExp: '(\d+(?:,|.\d+)?)'

  - name: width
    xpath: //ul[contains(@class,'dimension')]//li[contains(text(),'Width')]
    regExp: '(\d+(?:,|.\d+)?)'

  - name: 'weight_unit'
    xpath: //*[contains(text(),'Weight')]/following-sibling::text()
    regExp: '[a-zA-Z]+'

  - name: weight_raw
    xpath: //*[contains(text(),'Weight')]/following-sibling::text()
    regExp: '(\d+(?:,|.\d+)?)'

  - name: materials
    xpath: ''

  - name: colour
    xpath: ''

  - name: product_details
    xpath: //div[contains(@class,'product-details')]
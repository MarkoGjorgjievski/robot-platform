singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[@data-testid="product-title"]//text()

  - name: listing_id
    xpath: //script[@type="application/ld+json"][2]
    jq: '.sku'

  - name: listing_url
    xpath: //script[@type="application/ld+json"][2]
    jq: '.url'

  # - name: offer_price
  #   xpath: //script[@type="application/ld+json"][2]
  #   jq: '.offers[].price'

  - name: original_price
    xpath: //script[@type="application/ld+json"][2]
    jq: '.offers[].price'

  - name: platform_category
    xpath: //nav[@aria-label="breadcrumbs"]//li[position() = last()-1]//text()

  # - name: product_variations
  #   xpath: //li[@class="list-item"]//a//@href
  #   regExp: '(\/[^"]{1,})'
  #   regExpReplace: 'https://www2.hm.com$1'

  - name: stock_availability
    xpath: //script[@type="application/ld+json"][2]
    jq: 'if .offers[0].availability == "https://schema.org/InStock" then 1 else 0 end'

  - name: main_image
    xpath: //div[@id="product-detail"]//div[@class="relative"]//li[@id="0"]//img[@class="pdpImageBig"]//@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[@id="product-detail"]//div[@class="relative"]//li[position() > 1]//img[@class="pdpImageSmall"]//@src

  - name: description
    xpath: //div[@class="richText dangerously mt-4"]

  - name: product_details
    xpath: //div[@class="table-row"]

  - name: pack_size

  - name: user_reviews

  - name: average_rating

  - name: dimension_tittle
    xpath: //h1[@data-testid="product-title"]/../p

  - name: dimension_tmp
    xpath: //div[@class="table-row"]//*[contains(., 'Afmeting') or contains(., 'afmeting')]//following-sibling::div

  - name: dimensions

  - name: dimensions_unit
    defaultValue: "cm"

  - name: height

  - name: width

  - name: length

  - name: diameter

  - name: volume

  # - name: weight
  # #   xpath: //dt[contains(.,"Gewicht")]//following-sibling::dd
  # #   regExp: (\d{1,10}.\d{0,2})

  # - name: weight_unit
  #   xpath: //dt[contains(.,"Peso")]//following-sibling::dd
  #   regExp: ([a-zA-Z]{1,10}$)
  #   defaultValue: "kg"

  # - name: weight_raw
  #   xpath: //dt[contains(.,"Peso")]//following-sibling::dd
  #   regExp: (\d{1,10}.\d{0,2})

  - name: materials
    xpath: //div[@class="table-row"]//*[contains(., 'Materiaal') or contains(., 'materiaal')]//following-sibling::div

  - name: colour
    xpath: //div[@class="table-row"]//*[contains(., 'Kleur') or contains(., 'kleur')]//following-sibling::div

  - name: currency
    defaultValue: "EUR"
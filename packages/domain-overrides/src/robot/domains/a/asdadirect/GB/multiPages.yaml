singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, 'mini-container')]/div[not(@class)]/a |  //a[@class="text-underline-hover title"]
fields:
  - name: productURL
    xpath: "@href"
    regExp: (.+)
    regExpReplace: https://direct.asda.com$1  
    
  - name: individualProducts
    xpath: //script[@id="productData"]
    jq: '.individualProducts[] | .URL'
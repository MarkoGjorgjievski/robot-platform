singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:

  - name: product_title
    xpath: //span[@data-test='product-title']//text()

  - name: listing_id
    xpath: //span[@data-test='product-name-catNumber']//@content

  - name: offer_price
    xpath: //*[@id='windowData']
    jq: '.raw.productStore.data.prices.attributes'

  - name: original_price
    xpath: //*[@id='windowData']
    jq: '.raw.productStore.data.prices.attributes'

  - name: platform_category
    xpath: //li[@data-test='component-breadcrumb-item'][2]//span//text()

  - name: product_variations
    xpath: //*[@id='windowData']
    jq: '.raw.productStore.data.variants.attributes.variants[].partNumber'
  
  - name: stock_availability
    defaultValue: 'no'
    xpath: //button[@data-test="add-to-trolley-button-button" and not(@disabled)]
    regExp: (.+)
    regExpReplace: 'yes'

  - name: main_image
    xpath: //*[@id='windowData']
    jq: '.raw.productStore.data.media.images[0]'
    downloadContent: 'text'
  

  

  - name: alternative_images
    xpath: //ul[contains(@class, "Thumbnailsstyles__ThumbnailItem")]/li[position()>1]//img/@src
    regExp: (.+)\?
    regExpReplace: https:$1


  # - name: alternative_images_hirez
  #   xpath: //*[@id='windowData']
  #   jq: '.raw.productStore.data.media.images[1:][]'

  - name: description
    xpath: //div[@itemprop='description']/*[1]

  - name: pack_size
    # xpath: count(//li[contains(text(),'Package')])
    xpath: //span[@data-test='product-title']//text()
    regExp: ((Set|Pack) of (\d+)|(\d+) (Piece|Pack))
    regExpReplace: $3$4

  # - name: jsonData
  #   xpath: //*[@id='windowData']
  #   jq: '.'    

  - name: user_reviews
    xpath: //*[@id='windowData']
    jq: '.raw.productStore.data.ratingSummary.attributes.reviewCount'
    defaultValue: '0'

  - name: average_rating
    xpath: //*[@id='windowData']
    jq: '.raw.productStore.data.ratingSummary.attributes.avgRating'
    defaultValue: '0'

  - name: dimensions_unit
    defaultValue: 'cm'
    xpath: //div[@itemprop='description']//li
    regExp: '([^-.]*)[Ss]ize( of largest item)?\s*:?\s*((. ?[\d.]+)(\s*[,x]\s*. ?[\d.]+)?(\s*[,x]\s*. ?[\d.]+)?),?\s*(cm|mm|m)?\.$'
    regExpReplace: $7

  - name: dimensions_raw
    xpath: //div[@itemprop='description']//li
    regExp: '([^-.]*)[Ss]ize( of largest item)?\s*:?\s*((. ?[\d.]+)(\s*[,x]\s*. ?[\d.]+)?(\s*[,x]\s*. ?[\d.]+)?),?\s*(cm|mm|m)?\.$'
    regExpReplace: $3

  - name: height
    xpath: //div[@itemprop='description']//li
    regExp: 'Height[a-z ]*\s*:?\s*([\d.]+)\s*cm'
    regExpReplace: $1
    defaultValue: 'null'
  
  - name: diameter
    xpath:  //div[@itemprop='description']//li
    regExp: '[Dd]iameter\s*:?\s*([\d.]+)(cm)?\.'
    regExpReplace: $1

  
  - name: volume
    xpath:  //div[@itemprop='description']//li
    regExp: '[Cc]apacity\s*:?\s*([\d.]+)\s*(litres?|ml)\.'
    regExpReplace: $1 

  - name: depth
    xpath: //div[@itemprop='description']//li
    regExp: '[Dd]epth\s*:?\s*([\d.]+)\s*cm'
    regExpReplace: $1
    defaultValue: 'null'
  

  - name: width
    xpath: //div[@itemprop='description']//li
    regExp: '[Ww]idth\s*:?\s*([\d.]+)\s*cm'
    regExpReplace: $1
    defaultValue: 'null'
  

  - name: length
    xpath: //div[@itemprop='description']//li
    regExp: '[Ll]ength\s*:?\s*([\d.]+)\s*cm'
    regExpReplace: $1
    defaultValue: 'null'
  

  - name: weight_unit
    xpath: //li[contains(text(),'Weight')]
    regExp: Weight[a-z ]*\s*:?\s*(.[\d.]+)(k?g)
    regExpReplace: $2
    defaultValue: 'kg'

  - name: weight_raw
    xpath: //div[@itemprop='description']//li
    regExp: Weight[a-z ]*\s*:?\s*([\d.]+)(k?g)
    regExpReplace: $1

  - name: materials_raw
    xpath: //div[@itemprop='description']//li
    regExp: '(Made (from|of)|[Mm]aterial:) (.+)\.'
    regExpReplace: $3
  
  - name: materials_backup
    xpath: //h4[contains(text(), "Material")]/following-sibling::ul[1]/li


  - name: colour
    xpath: //span[@data-test='product-title']//text()
    regExp: ' - ([^\d\n -][^\d\n-]+[^\d\n -])'
    regExpReplace: $1
  # this one only works for variants:
    # xpath: //strong[contains(text(), "Colour")]
    # regExp: 'Colour: (.+)'
    

    # xpath: //*[@id='windowData']
    # jq: '.raw.productStore.data.variants.attributes.variants[0].attributes[0]'

  - name: product_details
    xpath: //div[@itemprop='description']//*[position()>1]
    # jq: jq | filter
    # regExp: (reg)*p
    # regExpReplace: website$1$2
    # defaultValue: hardcoded value if nothing matches
    # manualSelector: css#selector
    # type: NUMBER | BOOLEAN | STRING (default if omitted)

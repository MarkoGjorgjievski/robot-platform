singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@id="aod-container"]//div[@id="aod-offer"] | //div[@id="aod-container"]//div[@id="aod-pinned-offer"][not(contains(., "Brak dostępnych proponowanych opcji zakupu"))] | //link[@rel="canonical"][./ancestor::html[not(.//*[@id="aod-offer"])][not(.//*[@id="aod-pinned-offer"])]] | //div[@id="aod-container"][.//span[contains(@class, "aod-no-offer")]][.//span[contains(text(), "Brak dostępnych proponowanych opcji zakupu")]]
fields:
  - name: screenshot
    screenCapture: 'png'
    downloadContent: true

  - name: resellerName
    xpath: //*[@id="aod-offer-soldBy"]//*[@aria-label]/text()
    
  - name: outOfStockDummy
    xpath: //span[contains(text(), "Brak dostępnych proponowanych opcji zakupu")]

  - name: resellerLink
    xpath: //*[@id="aod-offer-soldBy"]//a[@aria-label]/@href

  - name: resellerId
    xpath: //*[@id="aod-offer-soldBy"]//a[@aria-label]/@href
    regExp: (?<=seller=)[^&]+

  - name: firstDepthURL
    xpath: '@href'

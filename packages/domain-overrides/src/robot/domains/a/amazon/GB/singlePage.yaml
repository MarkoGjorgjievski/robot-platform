singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@id,'offer-list')]/div[contains(@id,'offer') and not(.//text()[contains(., 'cannot be shipped')])] | //div[contains(@id,'aod-pinned-offer') and contains(@class,'aod-pinned-offer')][contains(@id,'offer') and not(.//text()[contains(., 'cannot be shipped')])and not(.//text()[contains(., 'No featured offers available')])]
# recordXPath: //div[contains(@id,'offer') and not(.//text()[contains(., 'cannot be shipped')])]
fields:
  - name: name
    xpath: ancestor::html//h5[contains(@id,'title')]

  - name: getInventory
    xpath:

  - name: aggregateRating
    xpath: ancestor::html//span[contains(@class,'reviewCount')]//a/span
    defaultValue: 0

  - name: reviewCount
    xpath: ancestor::html//a[contains(@id,'acrCustomerReviewLink')]
    regExp: \d+
    defaultValue: '0'

  - name: image
    xpath: ancestor::html//img[@id="aod-asin-image-id"]/@src

  - name: resellerName
    xpath: //div[contains(@id,'aod-offer-soldBy') and not(ancestor::div[contains(@class,'aod-hide')])]//*[contains(@aria-label, "Opens a new page")]
    defaultValue: 'Amazon'

  - name: resellerId
    xpath: //div[@id="aod-offer-soldBy"]//a/@href | //div[@offer-display-feature-name="desktop-merchant-info"]//a[@id="sellerProfileTriggerId"]/@href
    regExp: (?<=seller=)(.+)(?=&is)

  - name: resellerReviewCount
    xpath: //span[contains(@id, "seller-rating-count")]/span/text()[1]
    regExp: \d+
    defaultValue: '0'

  - name: resellerAggregateRating
    xpath: ''
    defaultValue: '0'

  - name: resellerFeedbackPercent
    xpath: //span[@id="seller-rating-count-{iter}"]/span/text()[2]
    regExp: (\d+)%
    regExpReplace: $1

  - name: fulfillmentBy
    xpath: //span[contains(text(), "Dispatches from") and not(ancestor::div[contains(@class,'aod-hide')])]/parent::div/following-sibling::div/span
    defaultValue: 'Amazon'

  - name: shippingCost
    xpath: //span[@data-csa-c-delivery-price and not(ancestor::div[contains(@class,'aod-hide')])]/@data-csa-c-delivery-price
    regExp: ([\d,.]+)

  - name: shippingCostCurrency
    defaultValue: 'GBP'

  - name: price
    xpath: //div[contains(@id,'offer')]//span[contains(@class, "price ")]/span[contains(@class,'offscreen') and not(parent::span[contains(@data-a-size,'mini')])]
    regExp: ([\d,.]+)

  - name: productDescription
    xpath: ancestor::html//div[contains(@id,'productDescription')]/p | ancestor::html//meta[contains(@name,'description')]/@content

  - name: priceCurrency
    defaultValue: 'GBP'

  - name: listPriceCurrency
    defaultValue: 'GBP'
  
  - name: currencyOverride
    defaultValue: 'GBP'

  - name: productPriceCurrency
    defaultValue: 'GBP'

  - name: brandText
    xpath: ancestor::html//a[@id="bylineInfo"]

  - name: deliveryDate
    xpath: (//span/@data-csa-c-delivery-time)[1]

  - name: resellerLink
    xpath: //div[@id="aod-offer-soldBy"]//a/@href | //div[@offer-display-feature-name="desktop-merchant-info"]//a[@id="sellerProfileTriggerId"]/@href
    regExp: (.+)
    regExpReplace: https://www.amazon.co.uk$1
    defaultValue: 'https://www.amazon.co.uk'

  - name: redirectedASIN
    xpath: ancestor::html//span[contains(text(),'ASIN')]/following-sibling::span | ancestor::html//th[contains(text(),'ASIN')]/following-sibling::td
    defaultValue: 'dummy'

  - name: redirectedASINBackup
    xpath: ancestor::html//a[contains(@href,'redirectAsin')]/@href
    regExp: redirectAsin=([A-Z0-9]{10})
    regExpReplace: $1
    defaultValue: 'dummy'

  - name: productASIN
    xpath: ancestor::html//script[contains(@data-a-state,'atwl') and contains(text(),'asin')]
    jq: .asin

  - name: domain
    defaultValue: 'https://www.amazon.co.uk'
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "a-cardui-body")][a] | //div[./ancestor::html[not(.//a[@id="apb-desktop-browse-search-see-all"])] and @data-component-type="s-search-result"][not(.//a[contains(@class, "puis-sponsored-label-text")])] | //*[@id="gridItemRoot"]//*[@data-asin]
fields:
  - name: productURL
    xpath: //h2/a/@href | //div[@id]/a[1]/@href
  - name: seeFullResult
    xpath: '//a[@id="apb-desktop-browse-search-see-all"]/@href'
    regExp: (^.*)
    regExpReplace: https://www.amazon.es$1

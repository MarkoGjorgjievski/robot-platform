singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@id="aod-container"]//div[@id="aod-offer"] | //div[@id="aod-container"]//div[@id="aod-pinned-offer"][not(contains(., "No featured offers"))] | //link[@rel="canonical"][./ancestor::html[not(.//*[@id="aod-offer"])][not(.//*[@id="aod-pinned-offer"])]]
fields:
  - name: screenshot
    screenCapture: 'png'
    downloadContent: true

  - name: resellerName
    xpath: //*[@id="aod-offer-soldBy"]//*[@aria-label]/text()

  - name: resellerLink
    xpath: //*[@id="aod-offer-soldBy"]//a[@aria-label]/@href

  - name: resellerId
    xpath: //*[@id="aod-offer-soldBy"]//a[@aria-label]/@href
    regExp: (?<=seller=)[^&]+

  - name: firstDepthURL
    xpath: //@href
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //li[contains(@id,'size_name')] | //div[contains(@id,'dp-container') and not(contains(@id,'above')) and not(//li[contains(@id,'size_name')])]

fields:
  - name: productURL
    xpath: ./@data-csa-c-item-id
    defaultValue: 'dummy'

  - name: productURLBackup
    xpath: ancestor::html//link[contains(@rel,'canonical')]/@href
    regExp: \/dp\/([A-Z0-9]+)
    regExpReplace: $1
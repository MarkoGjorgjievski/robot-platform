singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@id="aod-container"]//div[@id="aod-offer"][not(contains(., "cannot be shipped"))] | //div[@id="aod-container"]//div[@id="aod-pinned-offer"][not(contains(., "No featured offers"))]
fields:
  - name: name
    xpath: ancestor::html//div[@id="aod-pinned-offer"]//h5[@id="aod-asin-title-text"]

  - name: getInventory
    xpath:
    defaultValue: 0

  - name: reviewCount
    xpath: ancestor::html//span[@id="aod-asin-reviews-count-title"]
    defaultValue: 0

  - name: resellerReviewCount
    xpath: //span[contains(@id, "seller-rating-count")]/span/text()[1] | //span[@id="aod-asin-reviews-count-title"]
    regExp: (\d+[\.,]?\d*)
    defaultValue: 0

  - name: aggregateRating 
    xpath: ancestor::html//div[@id="aod-asin-reviews"]//@rating

  - name: resellerAggregateRating
    xpath: //div[@id="aod-offer-seller-rating"]//@rating

  - name: image
    xpath: ancestor::html//img[@id="aod-asin-image-id"]/@src

  - name: resellerName
    xpath: //div[contains(@id, 'soldBy')]//a//text()

  - name: resellerId
    xpath: //div[contains(@id, 'soldBy')]//a//@href
    regExp: (?<=seller=)(.+)(?=&is)

  - name: resellerFeedbackPercent
    xpath: //*[@id='seller-rating-count-{iter}']/span/br/following-sibling::text()
    regExp: (\d+)
    defaultValue: 0

  - name: deliveryDate
    xpath: //span[@data-csa-c-delivery-time]/@data-csa-c-delivery-time | //div[contains(@id, "DELIVERY_BLOCK")]//span[contains(@class, "error")]

  - name: shippingCost
    xpath: //span[@data-csa-c-delivery-price]/@data-csa-c-delivery-price

  - name: shippingCostCurrency
    defaultValue: 'JPY'

  - name: productId
    xpath: ancestor::html//link[@rel="canonical"]/@href
    regExp: \/dp\/(.+)
    regExpReplace: $1

  - name: price
    xpath: //span[contains(@id, "aod-price")]

  - name: brandText
    xpath: ancestor::html//tr[contains(@class, "po-brand")]/td[2]/span | //a[@id="bylineInfo"]
    regExp: (Visit the )?(.+)( Store)
    regExpReplace: $2

  - name: resellerLink
    xpath: //div[contains(@id, 'soldBy')]//a//@href
    regExp: (.+)
    regExpReplace: https://www.amazon.co.jp$1

  - name: domain
    defaultValue: 'https://www.amazon.co.jp'
    
  - name: productURL
    xpath: ancestor:html//link[@rel="canonical"]

  - name: currencyOverride
    defaultValue: 'JPY'

  - name: productDescription
    xpath: //div[contains(@id,'productDescription')]/p | ancestor::html//meta[contains(@name,'description')]/@content

  - name: fullfillmentBy
    xpath: //input[contains(@name, "addToCart")]//@aria-label
    regExp: 'from seller (.+) and price'
    regExpReplace: $1
    defaultValue: "Amazon"

  - name: redirectedASIN
    xpath: ancestor::html//span[contains(., 'ASIN')]/following-sibling::span[1]/text() | ancestor::html//th[contains(., 'ASIN')]/following-sibling::td[1]/text()

  - name: redirectedASINRAW
    xpath: ancestor::html//div[@id="adoptedData"]//@data-csa-c-asin
    regExp: (?<=asin=)(.+)(?=&ref)

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@id="aod-container"]//div[@id="aod-offer"][not(contains(., "cannot be shipped"))] | //div[@id="aod-container"]//div[@id="aod-pinned-offer"][not(contains(., "Aucune offre mise en avant"))]
fields:

  - name: name
    xpath: ancestor::html//div[@id="aod-pinned-offer"]//h5[@id="aod-asin-title-text"]

  - name: getInventory
    xpath:
    defaultValue: 0

  - name: reviewCount
    xpath: ancestor::html//span[@id="aod-asin-reviews-count-title"]
    defaultValue: 0

  - name: resellerReviewCount
    xpath: //span[contains(@id, "seller-rating-count")]/span/text()[1] | //span[@id="aod-asin-reviews-count-title"]
    regExp: (\d+[\.,]?\d*)
    defaultValue: 0

  - name: aggregateRating 
    xpath: ancestor::html//div[@id="aod-asin-reviews"]//@rating

  - name: resellerAggregateRating
    xpath: //div[@id="aod-offer-seller-rating"]//@rating

  - name: image
    xpath: ancestor::html//img[@id="aod-asin-image-id"]/@src

  - name: resellerName
    xpath: //div[contains(@id, 'soldBy')]//a//text()

  - name: resellerId
    xpath: //div[contains(@id, 'soldBy')]//a//@href
    regExp: (?<=seller=)(.+)(?=&is)

  - name: resellerFeedbackPercent
    xpath: //*[@id='seller-rating-count-{iter}']/span/br/following-sibling::text()
    regExp: (\d+)
    defaultValue: 0

  - name: deliveryDate
    xpath: //span[@data-csa-c-delivery-time]/@data-csa-c-delivery-time | //div[contains(@id, "DELIVERY_BLOCK")]//span[contains(@class, "error")]

  - name: shippingCost
    xpath: //span[@data-csa-c-delivery-price]/@data-csa-c-delivery-price

  - name: shippingCostCurrency
    defaultValue: 'JPY'

  - name: productId
    xpath: ancestor:html//span[@class='a-text-bold' and contains(., "ASIN")]/following-sibling::span[1]//text()

  - name: price
    xpath: //span[contains(@id, "aod-price")]

  - name: brandText
    xpath: ancestor::html//div[@id="feature-bullets"]//span//text()

  - name: resellerLink
    xpath: //div[contains(@id, 'soldBy')]//a//@href
    regExp: (.+)
    regExpReplace: https://www.amazon.com.be$1

  - name: domain
    defaultValue: 'https://www.amazon.com.be'
    
  - name: productURL
    xpath: ancestor:html//link[@rel="canonical"]

  - name: currencyOverride
    defaultValue: 'EUR'

  - name: productDescription
    xpath: //div[contains(@id,'productDescription')]/p | ancestor::html//meta[contains(@name,'description')]/@content


  - name: fullfillmentBy
    xpath: //span[contains(text(), "Expéditeur")]/parent::div/following-sibling::div/span

  # the other one just in case
  - name: fulfillmentBy
    xpath: //span[contains(text(), "Expéditeur")]/parent::div/following-sibling::div/span


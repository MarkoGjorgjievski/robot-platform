  - name: Program_Full_Address
    singleValue: false
    xpath: //address
  - name: Program_Address_1
    singleValue: false
    xpath: (//address//text())[1]
  - name: Program_Address_2
    singleValue: false
    xpath: (//address//text())[2]
  - name: Program_City # Fixed the address regex
    singleValue: false
    # xpath:  (//address//text())[3]
    xpath: //address/text()[last()]
    regExp: '([A-z\s\.]+), ([A-Z]+) ([\d-]+)'
    regExpReplace: '$1'
  - name: Program_State
    singleValue: false
    xpath: //address/text()[last()]
    regExp: '([A-z\s\.]+), ([A-Z]+) ([\d-]+)'
    regExpReplace: '$2'
  - name: Program_Zip_Code
    singleValue: false
    xpath: //address/text()[last()]
    regExp: '([A-z\s\.]+), ([A-Z]+) ([\d-]+)'
    regExpReplace: '$3'
  - name: Sponsoring_Institution_Number # Fixed the regex here
    singleValue: true
    xpath: //dt[contains(.,'Sponsoring Institution')]/following-sibling::dd/ul
    regExp: '\[ (\d+) \] (.+)'
    regExpReplace: '$1'
  - name: Sponsoring_Institution_Name
    singleValue: true
    xpath: //dt[contains(.,'Sponsoring Institution')]/following-sibling::dd/ul
    # regExp: '\]\s([\w\s]+)'
    # regExpReplace: '$1'

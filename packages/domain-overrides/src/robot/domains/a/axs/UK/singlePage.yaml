singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: eventName
    xpath: //div[contains(@class, "c-event--primary")]//h1[contains(@class, "c-marquee__headliner")]
  - name: venueName
    xpath: //div[contains(@class, "c-event--primary")]//a[contains(@class, "c-venue__name")]
  - name: venueAddress
    xpath: //div[contains(@class, "c-event--primary")]//div[contains(@class, "address1")]
  - name: venueCity
    xpath: //div[contains(@class, "c-event--primary")]//div[contains(@class, "address2")]
    regExp: '(^[^,]+)'
  - name: postalCode
    xpath: //div[contains(@class, "c-event--primary")]//div[contains(@class, "address2")]
  - name: eventDate
    xpath: //div[contains(@class, "c-event--primary")]//span[contains(@class, "date-wrapper")]
  - name: eventTime
    xpath: //script[@type="application/ld+json"]
    jq: '.doorTime'
  - name: onSaleDate
    xpath: //script[@type="application/ld+json"]
    jq: '.offers[0].validFrom'
  - name: eventNote
    xpath: //div[contains(@class, "c-event-description__body")]
  - name: isPublicPurchase
    xpath: //section[@id="event-ticket-options"]/div[1]/@data-event-state
    jq: '. | if . == "Get Tickets" then 1 else 0 end'

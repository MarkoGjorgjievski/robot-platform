singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h4[@class="product-title"]//text()

  - name: listing_id
    xpath: //h5[contains(.,"Article Number")]//text()
    regExp: '(?<=Article Number: )(\d+)'

  - name: listing_url
    xpath: //div[@itemprop="offers"]//link//@href

  - name: offer_price
    xpath: //span[contains(@class, 'pb-xxs')][@data-productdetailsprice]
    # regExp: (\d+\.\d{1,2})|(\d+)

  # - name: offer_price_int
  #   xpath: //div[@class="row no-gutters"]//span[@data-productdetailspriceinteger]

  # - name: offer_price_dot
  #   xpath: //div[@class="row no-gutters"]//span[@data-productdetailspricedecimal]

  # - name: offer_price_dec
  #   xpath: //div[@class="row no-gutters"]//span[@data-productdetailspricefraction]

  - name: original_price
    xpath: //hm-product-price[@id="product-price"]//span[last()]
    regExp: (\d+\.\d{1,2})|(\d+)

  - name: platform_category
    xpath: //div[contains(@class,"breadcrumb")]//div//div[4]//span//a//text()

  # - name: product_variations
  #   xpath: //div//a[@role="menuitem"]//@href
  #   regExp: '(\/[^"]{1,})'
  #   regExpReplace: 'https://www.abyat.com/en-US$1'

  - name: 'product_variations'
    xpath: //*[@id='requestData']
    jq: '.hits[].productId'

  - name: stock_availability
    xpath: //div[contains(text(),"Availability")]//span//text()
    jq: 'if (. == "Out of stock") then "0" else "1" end'

  - name: main_image
    xpath: //div[contains(@id,"image")]//div[contains(@id,"carousel")][1]//@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[contains(@id, "image")]//div[contains(@id, "carousel")][not(position()=1)]/@src

  - name: product_details
    xpath: //div[@class="spec-width"]//div//div[1]//div[@class="v-expansion-panel-content"]

  # - name: description
  #   No description

  # - name: pack_size
  #   No pack size

  # - name: user_reviews
  #   No user reviews

  # - name: average_rating
  #   No user reviews

  - name: dimensions

  - name: color_dimension
    xpath: //h5[contains(@class,"product-color-dimension")][1]//text()

  - name: dimensions_unit
    defaultValue: "cm"

  - name: height

  - name: width

  - name: length

  - name: weight

  - name: weight_unit
    xpath: //div[@aria-expanded="true"][2]//div[@class="v-expansion-panel-content"]//div[@class="row no-gutters"]//span//span[contains(., "kg") or contains(., "g")]//text()
    regExp: ([a-zA-Z]+$)

  - name: weight_raw
    xpath: //div[@aria-expanded="true"][2]//div[@class="v-expansion-panel-content"]//div[@class="row no-gutters"]//span//span[contains(., "kg") or contains(., "g")]//text()
    regExp: (\d+\.\d{1,2})|(\d+)

  - name: materials
    xpath: //div[@aria-expanded="true"][1]//div[@class="v-expansion-panel-content"]//div[@class="row no-gutters"][1]//div[contains(@class, "ps-xxs")]//span[contains(., "")][last()]//span[last()]

  - name: colour

  - name: currency
    xpath: //nav//div[@id="footer-mp-currency"]//span//text()
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: productURL
    xpath: //p[contains(@title,"")]/ancestor::div/ancestor::a[contains(@href,"/p/")]/@href
    regExp: (.+)\?
    regExpReplace: https://shop.advanceautoparts.com$1

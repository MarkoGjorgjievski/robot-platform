singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: sku
    xpath: //*[contains(text(),'"sku":"') and not(contains(@id,"__NEXT_DATA__"))]
    jq: .sku
  - name: productName
    xpath: //title
    regExp: (.+)\s\d+\s\-\sAdvance Auto Parts
    regExpReplace: $1
  - name: manufacturerPartNumber
    xpath: //title
    regExp: .+\s(\d+)\s\-\sAdvance Auto Parts
    regExpReplace: $1
  - name: productVariant
    xpath: //*[contains(text(),'"sku":"') and not(contains(@id,"__NEXT_DATA__"))]
    jq: .name
  - name: masterBrand
    xpath: //*[contains(text(),'"sku":"') and not(contains(@id,"__NEXT_DATA__"))]
    jq: .brand.name

  - name: brand
  - name: brandVariant

  - name: viscosity
    xpath: //*[@id='product-specifications']//*[contains(text(),'SAE Oil Weight')]/parent::div/following-sibling::div | //*[@id='product-specifications']//*[contains(text(),'Viscosity Grade')]/parent::div/following-sibling::div
  - name: packSize # transform
    xpath: //*[contains(text(),'"sku":"') and not(contains(@id,"__NEXT_DATA__"))]
    jq: .name
  - name: packSizeUnit # transform
    xpath: //*[contains(text(),'"sku":"') and not(contains(@id,"__NEXT_DATA__"))]
    jq: .name
  - name: quantity
    xpath: //*[contains(@aria-label,"quantity")]/@value
  - name: RRP_Was
    xpath: //*[contains(@data-testid,"price-box")]
    regExp: \d+.\d+
  # - name: RRP_WasWithoutVat
  #   xpath: //*[contains(@data-testid,"price-box")]
  - name: startingPriceType # transform
    xpath: //*[contains(@data-testid,"price-box")]
  - name: retailPrice # transform
    xpath: //*[contains(@data-testid,"price-box")]
    regExp: \d+.\d+
  # - name: retailPriceWithoutVAT
  #   xpath: //*[contains(@data-testid,"price-box")]

  # - name: VAT
  - name: promotionDescription
    xpath: //*[contains(@data-testid,"price-box")]
    regExp: \d+\.\d+(.+)\$\d+
    regExpReplace: $1

  # - name: mutlipackFlag
  # - name: mutlipackQuantity
  # - name: isBundle

  - name: inStockOnline # transform 
    xpath: //*[contains(text(),'ADD TO CART')]
  - name: inStockStore # transform
    xpath: //*[contains(text(),"Ready in")]
  - name: productDescription
    xpath: //*[contains(@id,'product-specifications')]
  - name: specificationProfile
    xpath: //*[contains(@id,'product-details')]
  - name: productRating
    xpath: //*[@id="fulfillment-error"]//*[contains(@aria-label,' out of 5 rating')]/@data-percent
  - name: ratingCount
    xpath: //*[@id="fulfillment-error"]//*[contains(text(),' reviews')]
    regExp: \d+
  - name: rawAvailabilityMessage
    xpath: //*[@data-testid="dog-ear"]//*[contains(text(),"Change")]/parent::button/parent::div/parent::div//span[not(contains(text(),"Change"))]
    

    # xpath: //xpath
    # jq: jq | filter
    # regExp: (reg)*p
    # regExpReplace: website$1$2
    # defaultValue: hardcoded value if nothing matches
    # manualSelector: css#selector
    # screenCapture: png
    # downloadContent: text
    # type: NUMBER | BOOLEAN | STRING (default if omitted)

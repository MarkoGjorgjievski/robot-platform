singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //tbody//tr[contains(@class,'TableRow')]
fields:
  - name: category
    xpath: ancestor::html//h1[contains(@class,'ategoryTitle')]
    regExp: '(.+):'
    regExpReplace: $1
  
  - name: mfr_part_number
    xpath: //div[contains(@class,'ManufacturerPartNo') and contains(@class,'PartNumber')]
  
  - name: order_code
    xpath: //div[contains(@class,'OrderCode') and contains(@class,'OrderValue')]

  - name: manufacturer
    xpath: //div[contains(@class,'ProductDescriptionTable') and contains(@class,'ProductValue')]

  - name: description
    xpath: //div[contains(@class,'ProductDescriptionTable') and contains(@class,'ProductDetails')]

  - name: stock
    xpath: //td[5]
    # xpath: //td[position() = (count(//thead//th[button[contains(text(), 'Availability')]]/preceding-sibling::th) +1)]

  - name: price
    xpath: //div[contains(@class,'PriceBreakupTable') and contains(@class,'PriceBreak-sc') and not(contains(text(),'More'))]
    
  - name: price_for
    xpath: //td[6]

  - name: contact_form
    xpath: //td[10]

  - name: contact_configuration
    xpath: //td[9]

  - name: load_type
    xpath: //td[11]

  - name: load_voltage_max
    xpath: //td[13]

  - name: load_current
    xpath: //td[14]

  - name: package_style
    xpath: //td[15]

  - name: number_of_pins
    xpath: //td[16]

  - name: relay_mounting
    xpath: //td[17]

  - name: relay_terminals
    xpath: //td[21]

  - name: forward_current_if
    xpath: //td[20]

  - name: on_state_resistance_max
    xpath: //td[22]

  - name: isolation_voltage
    xpath: //td[24]

  - name: io_capacitance_type
    xpath: //td[27]

  - name: off_state_leakage_current_max
    xpath: //td[29]

  - name: product_range
    xpath: //td[30]

  - name: operating_voltage_max
    xpath: //td[12]

  - name: switching_mode
    xpath: //td[18]

  - name: operating_voltage_min
    xpath: //td[19]

  - name: control_voltage_min
    xpath: //td[23]

  - name: control_voltage_max
    xpath: //td[25]

  - name: operating_temperature_max
    xpath: //td[28]

  - name: operating_temperature_min
    xpath: //td[26]


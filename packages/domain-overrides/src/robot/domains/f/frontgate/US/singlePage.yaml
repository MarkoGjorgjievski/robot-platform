singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "ticket-price-section")]
fields:
  
  # - name: buyTicketsURL
  #   xpath: ancestor::html//a[contains(@class, "buynow")]/@href

  
  - name: eventName
    xpath: ancestor::html//div[contains(@class, "header-image")]/img/@alt

  - name: ticketName
    xpath: //div[contains(@class,"xtix-title")]
  
  - name: eventNote
    xpath: ancestor::html//h2[contains(@class, "event-name")]/following-sibling::text()[1] | //div[contains(@class, "event")]//div[contains(@class, "age")]
  
  - name: venueName
    xpath: ancestor::html//div[contains(@class, "event-venue")]//div[contains(@class, "venue")]
    defaultValue: 'Glen Helen Regional Park'
  
  - name: venueAddress
    xpath: ancestor::html//div[contains(@class, "event-venue")]//div[contains(@class, "address")]
    regExp: '((.*), |)([ \w]+), ([A-Z]+) (\d{5})'
    regExpReplace: '$2'
    defaultValue: 'empty'
  
  - name: venueCity
    xpath: ancestor::html//div[contains(@class, "event-venue")]//div[contains(@class, "address")]
    regExp: '((.*), |)([ \w]+), ([A-Z]+) (\d{5})'
    regExpReplace: '$3'
    defaultValue: 'empty'
  
  - name: venueStateProvince
    xpath: ancestor::html//div[contains(@class, "event-venue")]//div[contains(@class, "address")]
    regExp: '((.*), |)([ \w]+)?, ([A-Z]+) (\d{5})'
    regExpReplace: '$4'
    defaultValue: 'empty'
  
  - name: postalCode
    xpath: ancestor::html//div[contains(@class, "event-venue")]//div[contains(@class, "address")]
    regExp: '((.*), |)([ \w]+)?, ([A-Z]+) (\d{5})'
    regExpReplace: '$5'
    defaultValue: 'empty'
  
  - name: eventDateTime
    xpath: ancestor::html//script[@type="application/ld+json"]
    jq: .startDate
  
  - name: isPublicPurchase
    defaultValue: '1'
  
  - name: onSaleDateTime
    xpath: ancestor::html//script[@type="text/javascript"][contains(text(), "Onsale")]/text()
    regExp: \[\'eventOnsaleStart\'\] = \'(.+)\'
    regExpReplace: '$1'
  
  - name: eventURL
    xpath: ancestor::html//meta[@property="og:url"]/@content
  
  - name: eventUniqueId
    xpath: ancestor::html//meta[@property="og:url"]/@content
    regExp: 'event\/(.+)$'
    regExpReplace: '$1'
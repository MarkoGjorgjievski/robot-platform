singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //script[@type="application/ld+json"]/text()
    defaultValue: 'No title'
  - name: offer_price
    xpath: //div[contains(@class, "sizes-body-container")]//div[contains(@class, "description-container")]//span[contains(@class, "price") and contains(@class, "onSale")]
    defaultValue: '0'
    regExp: \d+\,?\.?\d*
  - name: original_price
    xpath: //div[contains(@class, "sizes-body-container")]//div[contains(@class, "description-container")]//span[contains(@class, "price") and not(contains(@class, "onSale"))]
    regExp: \d+\,?\.?\d*
  - name: platform_category
  - name: product_variations
    defaultValue: {}
  - name: stock_availability
    defaultValue: 'yes'
  - name: main_image
    xpath: //div[contains(@class, "detail-images-container")]/a[1]/@href | //div[contains(@class, "swiper-container")]//div[contains(@class, "swiper-slide-active")]//img/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, "detail-images-container")]/a/@href | //div[contains(@class, "photo-container")]//div[contains(@class, "photo")]//img/@src
  - name: description
  - name: pack_size
    defaultValue: '1'
  - name: user_reviews
    defaultValue: '0'
  - name: average_rating
    defaultValue: '0'
  - name: dimensions_unit
    xpath: //div[contains(@class, "sizes-body-container")]//span[contains(@ng-if, "showDimensions")]//span[contains(@ng-if, "size.displayName && size.description")]//span[1] | //div[contains(@class, "sizes-body-container")]//span[contains(@ng-if, "showDimensions")]//span[contains(@ng-if, "size.displayName && !size.description")]
  - name: height
    xpath: //div[@id="add-to-cart-container"]//div[contains(@class, "sizes-body-container")]//span[contains(@class, "dimension-value")][1] | //span[contains(@class, "dimension-header") and contains(text(), "Alto")]/following-sibling::span
    regExp: \d+\,?\.?\d*
  - name: width
    xpath: //div[@id="add-to-cart-container"]//div[contains(@class, "sizes-body-container")]//span[contains(@class, "dimension-value")][2] | //span[contains(@class, "dimension-header") and contains(text(), "Ancho")]/following-sibling::span
    # regExp: \d+
  - name: depth
    xpath: //div[@id="add-to-cart-container"]//div[contains(@class, "sizes-body-container")]//span[contains(@class, "dimension-value")][3] | //span[contains(@class, "dimension-header") and contains(text(), "Fondo")]/following-sibling::span
    regExp: \d+\,?\.?\d*
  - name: weight_unit
    xpath: //div[contains(@class, "measures-block")]//div[@ng-if="size.weightToShow"]//span[last()]
    regExp: '[a-z]+'
  - name: weight_raw
    xpath: //div[contains(@class, "measures-block")]//div[@ng-if="size.weightToShow"]//span[last()]
    regExp: \d+\,?\.?\d*
  - name: materials
    xpath: //div[contains(@class, "composition-block")]//div | //div[contains(@class, 'selector-material')]//li[contains(@class, 'selected')]/span
  - name: product_details
    xpath: //md-content[contains(@class, "modal-composition")]
  - name: currency
  - name: platform_id
  - name: not_available
    xpath: //div[contains(@class, "product-no-visible-container")]
  - name: params
    xpath: //script[@type="text/javascript"][contains(text(), "inditex.i")]/text()
    regExp: iRequestParameters\s*=\s*([^;]+)
    regExpReplace: $1
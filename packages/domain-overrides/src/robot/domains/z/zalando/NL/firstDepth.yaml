singleRecord: false
regionsSelector: null
recordSelector: null
# CHANGEME "Verkrijgbare kleuren" to something targetting the color picker
recordXPath: //ul[contains(@aria-label,"Verkrijgbare kleuren")]/li[position() <= 15] | //h1[not(ancestor::html//ul[contains(@aria-label, "Verkrijgbare kleuren")]/li)]
fields:
  - name: defaultURL
    xpath: ancestor::html//meta[contains(@property,'og:url')]/@content
    regExp: (.+)
    # CHANGEME domain
    regExpReplace: https://www.zalando.nl$1

  - name: subTemplate
    xpath: //a/@href
    regExp: \/([^\/]+$)
    # CHANGEME domain
    regExpReplace: https://www.zalando.nl/$1
    defaultValue: "{defaultURL}"


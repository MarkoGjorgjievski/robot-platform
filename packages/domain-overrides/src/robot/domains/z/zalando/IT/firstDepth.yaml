singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //ul[contains(@aria-label,"Colori disponibili")]/li | //h1[not(ancestor::html//ul[contains(@aria-label, "Colori disponibili")]/li)]
fields:
  - name: defaultURL
    xpath: ancestor::html//meta[contains(@property,'og:url')]/@content
    regExp: (.+)
    regExpReplace: https://www.zalando.it$1

  - name: subTemplate
    xpath: //a/@href
    regExp: \/([^\/]+$)
    regExpReplace: https://www.zalando.it/$1
    defaultValue: "{defaultURL}"
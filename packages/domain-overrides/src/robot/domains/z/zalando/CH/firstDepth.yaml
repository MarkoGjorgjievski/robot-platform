singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //ul[contains(@aria-label,"Verfügbare Farben")]/li[position() <= 15] | //h1[not(ancestor::html//ul[contains(@aria-label, "Verfügbare Farben")]/li)]
fields:
  - name: defaultURL
    xpath: ancestor::html//meta[contains(@property,'og:url')]/@content
    regExp: (.+)
    regExpReplace: https://www.zalando.ch$1

  - name: subTemplate
    xpath: //a/@href
    regExp: \/([^\/]+$)
    regExpReplace: https://www.zalando.ch/$1
    defaultValue: "{defaultURL}"


singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //ul[contains(@aria-label,"Couleurs disponibles")]/li | //h1[not(ancestor::html//ul[contains(@aria-label, "Couleurs disponibles")]/li)]
fields:
  - name: defaultURL
    xpath: ancestor::html//meta[contains(@property,'og:url')]/@content
    regExp: (.+)
    regExpReplace: https://www.zalando.fr$1

  - name: subTemplate
    xpath: //a/@href
    regExp: \/([^\/]+$)
    regExpReplace: https://www.zalando.fr/$1
    defaultValue: "{defaultURL}"


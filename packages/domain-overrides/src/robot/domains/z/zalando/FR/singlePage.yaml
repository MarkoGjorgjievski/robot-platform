singleRecord: false
regionsSelector: null
recordSelector: null
# target only the selected size
recordXPath: //form[@name="size-picker-form"]/div/div[@data-is-selected="true"] | //*[@name="size-picker-form"]//label[@data-testid!="pdp-stockAvailable-label"][./ancestor::body//*[@name="size-picker-form"]/div/div[.//label[@data-testid="pdp-stockAvailable-label"]][last()][@data-is-selected="true"]]| //button[@id="picker-trigger"][@disabled]
fields:
  - name: productURL
    xpath: ancestor::html//link[@hreflang="fr-FR"]/@href

  - name: image
    xpath: ancestor::html//script[@type="application/ld+json"][@data-trckng-component]
    jq: .image[0]

  # - name: image
  #   xpath: ancestor::html//div[*[@re-hydration-id="re-1-3"]]//ul//li//img[@draggable="false"]/@src

  - name: price
    xpath: ancestor::html//h1/following-sibling::div//*[contains(text(), "€")]

  - name: listPrice
    defaultValue: "empty"

  - name: priceFallback
    xpath: ancestor::html//script[@type="application/ld+json"][@data-trckng-component]
    jq: .offers

  # - name: offerPrice
  #   xpath: ancestor::html//h1/following-sibling::div//*[contains(text(), "€")][./following-sibling::span[contains(text(), "%")]]
  #   regExp: ([\d,.]+)
  #   regExpReplace: $1

  # - name: listPrice
  #   xpath: ancestor::html//h1/following-sibling::div//*[contains(text(), "€")][./following-sibling::span[not(contains(text(), "%"))]]
  #   regExp: ([\d,.]+)
  #   regExpReplace: $1

  # # NEW
  # - name: offerPrice
  #   xpath: //label[@data-testid="pdp-stockAvailable-label"]

  # - name: offerPrice_raw
  #   xpath: ancestor::html//x-wrapper-re-1-4/h1/following-sibling::div[1]
  #   regExp: .*[$€£¥¢₽][\S\s]*

  # - name: listPrice
  #   xpath: ancestor::html//x-wrapper-re-1-4/h1/following-sibling::div[1]
  #   regExp: .*[$€£¥¢₽][\S\s]*

  - name: brandText
    xpath: ancestor::html//a/span/h3

  - name: sku
    xpath: //label/@for
    regExp: size-picker-(.+)
    regExpReplace: $1
    defaultValue: empty

  - name: oneSizeSku
    xpath: ancestor::html//meta[@property="og:url"]/@content
    regExp: -([^-]+-[^-]+)\.html
    regExpReplace: $10ONE000

  # missing in schema
  - name: productDescription
    xpath: ancestor::html//script[@type="application/ld+json"][@data-trckng-component]
    jq: .description

  # missing in schema
  - name: product_style
    xpath: ancestor::html//span[contains(text(),'Couleur')]/parent::span/following-sibling::span

  - name: productStyle
    xpath: ancestor::html//span[contains(text(),'Couleur')]/parent::span/following-sibling::span

  - name: productId
    xpath: ancestor::html//*[@role="term"][contains(text(), "Référence")]/following-sibling::*[@role="definition"]

  - name: name
    xpath: ancestor::html//h1

  - name: deliveryDateFallback
    xpath: ancestor::html//div[@data-trckng-component]/div[contains(.,"working") or contains(.,"days") or contains(.,"Werktage") or contains(.,"jours ou") or contains(.,"werkdagen")]//div[1]/span[1]

  # connect to what we capture from a request
  # - name: resellerId
  #   xpath: ancestor::html//*[@id='resellerID']
  #   regExp: '"(.+)"'
  #   regExpReplace: $1
  #   defaultValue: Zalando

  - name: resellerId
    xpath: ancestor::html//*[@data-testid="banner-cta-block"]/following-sibling::*[not(@data-trckng-component)]//div[not(@data-testid)]/span//button
    defaultValue: Zalando

  - name: resellerIdMap
    xpath: ancestor::html//*[@id='resellerID_MAP']

  - name: resellerName
    # xpath: ancestor::html//span[@aria-haspopup="true"]
    xpath: ancestor::html//*[@data-testid="banner-cta-block"]/following-sibling::*[not(@data-trckng-component)]//div[not(@data-testid)]/span//button
    defaultValue: Zalando

  - name: resellerNameFallback
    xpath: ancestor::html//h1/..//h3

  - name: resellerLink
    defaultValue: https://www.zalando.fr/

  - name: unitsStock
    xpath: ancestor::html//button[@id="picker-trigger"]
    regExp: \([^\d]*(\b\d\b)[^\d]*\)
    regExpReplace: $1
    defaultValue: empty

  - name: outOfStock
    xpath: //label[@data-testid!="pdp-stockAvailable-label"] | ancestor::html//p[contains(text(), "Cet article n’est plus disponible")] | ancestor::html//h2[contains(text(), "Article épuisé")]

  - name: unitsStock_backup
    xpath: ancestor::html//button/span[contains(text(), "Ajouter au panier")]
    regExp: (.+)
    regExpReplace: "999"
    defaultValue: "0"

  - name: fulfillmentBy
    xpath: ancestor::html//button/span[contains(text(), "Ajouter au panier")]
    regExp: Exécution par (.+),
    regExpReplace: $1
    defaultValue: Zalando

  - name: shippingCost
    xpath: ancestor::html//div[@data-testid="pdp-delivery-info"]/following-sibling::div/p[1]
    regExp: ([\d,.]+)
    regExpReplace: $1
    defaultValue: "0"

  - name: priceCurrency
    defaultValue: "EUR"

  - name: currencyOverride
    defaultValue: "EUR"

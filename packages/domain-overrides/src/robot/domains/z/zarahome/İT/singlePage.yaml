singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
orderedSelectorsToClickOn: ['.mas-info-link', '.not-draggable']
fields:
  - name: "product_title"
    xpath: '//title'
  - name: "listing_id"
    xpath: '//link[@rel="canonical"][1]/@href'
  - name: "original_price"
    xpath: '(//itx-product-price)[1]/p//span[contains(text(), "€")]'
    regExp: '\b\d+[,.]\d+\b'
  - name: "original_price_extra"
    xpath: '//div[contains(@class, "product-size-row")]//span[contains(@class, "price")]'
    regExp: '\b\d+\d+\b'
  - name: "original_price"
    xpath: '(//itx-product-price)[1]/p//span[contains(text(), "€")]'
    regExp: '\b\d+\d+\b'
  - name: 'offer_price'
    xpath: '(//p[contains(@class, "rebajado")]/span)[1]'
    regExp: '\b\d+[,.]\d+\b'
  - name: 'main_image'
    xpath: '(//img[contains(@class, "detail-image")])[1]/@src'
    downloadContent: 'text'
  - name: 'alternate_image'
    xpath: '//img[contains(@class, "detail-image")]/@src'
    downloadContent: 'text'
  - name: 'description'
    xpath: '//div[@id="product-description-paragraphs"]//span/text()'
  - name: 'pack_size'
    xpath: '//div[contains(@class, "header")]/h2'
    regExp: '\b(\d+)\b'
    regExpReplace: '$1'
    defaultValue: '1'
  - name: "color"
    xpath: '//itx-product-color-selector[contains(@class, "select-color-container")]/ul[contains(@class, "selecc-colores")]/li/a/img/@title'
  - name: 'product_details'
    xpath: '//md-content[contains(@class, "modal-composition")]//div[contains(@ng-repeat, "size")]//div'
  - name: "stock_availability"
    xpath: 'boolean(not(//div[contains(@class, "product-no-visible-container")]))'
  - name: 'dimensions_unit'
    xpath: '(//span[contains(@class, "first-el")])[1]/strong'
    regExp: '\d+(\.\d+)?\s*(cm|mm|m|in|inch|feet|ft)'
    regExpReplace: '$2'
  - name: "height"
    xpath: '//span[contains(@class, "first-el")]/strong | (//div[contains(@class, "dimensions")]/span)[1]'
    regExp: '\d+'
  - name: "width"
    xpath: '(//span[contains(@class, "dimension-value")])[position() = 5 or position() = 8 or position() = 11] | (//div[contains(@class, "dimensions")]/span)[2]'
    regExp: '\d+'
  - name: "depth"
    xpath: '(//span[contains(@class, "dimension-value")])[position() = 6 or position() = 9 or position() = 12] | (//div[contains(@class, "dimensions")]/span)[3]'
    regExp: '\d+'
  - name: "weight_raw"
    xpath: '//div[contains(@ng-if, "itxProductInfoDimensionsCtrl.info.showDimensions")]/div[contains(@ng-repeat, "size")]//div[contains(@ng-if, "size.weightToShow")]/span[contains(@class, "right")]/text()'
    regExp: '\d+'
  - name: "weight_unit"
    xpath: '//div[contains(@ng-if, "itxProductInfoDimensionsCtrl.info.showDimensions")]/div[contains(@ng-repeat, "size")]//div[contains(@ng-if, "size.weightToShow")]/span[contains(@class, "right")]/text()'
    regExp: '\d+([a-zA-Z]+)'
    regExpReplace: "$1"
  - name : 'materials'
    xpath: '//div[contains(@ng-repeat, "(key, compositionPart) in dialogCtrl.info.compositions")]/ul/li/span'
    regExp: '(?<=\d%)\s*(.*)'
    regExpReplace: '$1'
  - name: 'product_variations'
    xpath: "//*[contains(@type, 'application/ld+json')]"
    jq: '.[] | .offers.url'

singleRecord: false
regionsSelector: null
recordSelector: null
#recordXPath: //section[@class='performance-list-panel'] | //div[contains(@class, 'regular-section')] | //div[contains(@class, '-info-content')] | //section[contains(@class, 'sales__block')]//li[contains(@class, 'vevent')] | //section[contains(@class, 'rs_isSetupRsBtnAlert')]
# | //section[contains(@class, 'details')] - recordXpath for noResultPage.
recordXPath: //div[contains(@class, '-info-content')] | //section[@class='performance-list-panel'] |  //ul[contains(@class, 'sales__table')]//li[contains(@class, 'vevent')] | //div[contains(@class, 'regular-section')]
fields:

  #  - name: firstDepthURL
  #    xpath: ancestor::body//div[contains(@class, 'section')]//form[contains(@class, '-form')]/@action | //div[contains(@class, 'is-link')]//a/@href | ancestor::body//div[contains(@class, 'section')]//form[contains(@class, '-form')]/@action
  #    regExp: '^\.\.(.+)|\/sp(.+)'
  #    regExpReplace: 'https://ticket.pia.jp/sp$1$2'
  - name: firstDepthURL
    xpath: ancestor::body//div[contains(@class, 'section')]//form[contains(@class, '-form')]/@action | //div[contains(@class, 'spe-btn')]//a/@href | //div[contains(@class, 'is-link') and not(contains(@class, 'spe-btn'))]//a/@href



  - name: firstRestURL
    xpath: ancestor::body//div[contains(@class, 'section')]//form[contains(@class, '-form')]/@action | //div[contains(@class, 'spe-btn')]//a/@href
    regExp: '^\.\.(.+)|\/sp(.+)'
    regExpReplace: 'https://ticket.pia.jp/sp$1$2'
    defaultValue: ''
  - name: secondRestURL
    xpath: //div[contains(@class, 'is-link') and not(contains(@class, 'spe-btn'))]//a/@href
    regExp:  '^\.\.(.+)|\/pia(.+)'
    regExpReplace: 'https://t.pia.jp/pia$1$2'
    defaultValue: ''
  - name: urlTemplate
    defaultValue: 'https://ticket.pia.jp'
  - name: url
    defaultValue: '/sp/ticketInformation.do?eventCd=2341577&rlsCd=001'
  - name: posturl
    xpath: ancestor::body//div[contains(@class, 'section')]//form[contains(@class, '-form')]/@action | //div[contains(@class, 'spe-btn')]//a/@href
    regExp: (.*)
    regExpReplace: '#[!opt!]{"method": "POST", "body": "afid=&tid=&slcd=&acptNo=&firstModalFlg=true&simpleAuthFlg=true&lpViewFlg=true", "headers": {"Content-Type": "application/x-www-form-urlencoded"}}[/!opt!]'
    defaultValue: ''
  #  - name: test
  #    xpath: ancestor::body//ul[contains(@class, 'sales__table')][1]//li[contains(@class ,'vevent')]//div[contains(@class, 'is-link')]//a/@href | //form[contains(@class, 'dst-form')]/@action
  #    regExp: '^\.\.(.+)|\/sp(.+)'
  #  - name: test2
  #    xpath: ancestor::body//ul[contains(@class, 'sales__table')][1]//li[contains(@class ,'vevent')]//div[contains(@class, 'is-link')]//a/@href | //form[contains(@class, 'dst-form')]/@action
  - name: eventName
    xpath: ancestor::body//div[contains(@class, 'header-shad')]//h1[contains(@class, 'heading')] | ancestor::body//h1[contains(@class, 'head-title')] | ancestor::body//h2[contains(@class, 'main_title')][1]
  #    regExp: '(?:『(.*?)』|^(.+)$)'
  #  - name: eventName1
  #    xpath: ancestor::body//div[contains(@class, 'header-shad')]//h1[contains(@class, 'heading')]
  #  - name: eventName2
  #    xpath: ancestor::body//h1[contains(@class, 'head-title')]
  #  - name: eventName3
  #    xpath: ancestor::body//h2[contains(@class, 'main_title')][1]
  #  - name: eventName4
  #    xpath: ancestor::body//h2
  #  - name: eventName5
  #    xpath: ancestor::body//h1
  #  - name: eventName5
  #    xpath: ancestor::body//h3
  - name: notDisplayedCorrectly
    xpath: //p[contains(@class, 'lead-txt')]
  - name: venueCity
    xpath: //span[contains(@class, 'contents-title-place')] | //p[contains(@class, 'site-place')]
  #    regExp: '^(?:\((.*?)\)|^(.+)$)'
  - name: venueName
    xpath: //span[contains(@class, 'contents-title-place')] | //p[contains(@class, 'site-place')]
  - name: eventDate
    xpath: //span[contains(@class, 'title-date-day')] | //dt[contains(@class, 'event-date')]
  - name: eventTime
    xpath: //span[contains(@class, 'title-date-time')] | //dd[contains(@class, 'event-time')]
    regExp: '(^[^\s]+)'
  #    defaultValue: '13:00'
  - name: isPublicPurchase
    xpath: ancestor::body//article[contains(@class, 'notice-container')] | ancestor::body//div[contains(@class, 'block-desc')]
    regExp: (.*)
    regExpReplace: '1'
  #    defaultValue: '0'
  - name: eventNote
    xpath: ancestor::body//div[contains(@class, 'top-block-desc')] | ancestor::body//section[contains(@class, 'notice-section')]//div[contains(@class, 'content__inner')]
  - name: IsTBA
    xpath: //span[contains(@class, 'title-date-time')] | //dd[contains(@class, 'event-time')]
    regExp: (.*)
    regExpReplace: '0'
    defaultValue: '1'
  - name: eventURL
    xpath: //no-script[contains(@id, '__input')][1]


#    defaultValue: 'https://w.pia.jp/p/gamarjobaanuaraferi'
  - name: eventURLTest
    xpath: //no-script[contains(@id, '__input')]
  - name: eventURLTEST
    xpath: //no-script[contains(@id, '__input')]
    jq: paginationURL
  - name: eventURLTEST2
    xpath: //no-script[contains(@id, '__input')]
    jq: "[0].paginationURL"
  - name: urlEvent
    xpath: //no-script[contains(@id, '__input')]
    jq: .["eventURL"]

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[contains(@class, "product-details-page")]
fields:
  - name: listing_id
    xpath: //*[contains(@class, "product-sku")]/@content
    regExp: \d+
  - name: offer_price
    xpath: //span[contains(@class, "offerprice") or contains(@class, "ssr-product-price__value")]//text()
    regExp: \d+(,\d{1,2})?
  - name: original_price
    xpath: //span[contains(@class, "beforeprice")]//text()
    regExp: \d+(,\d{1,2})?
    defaultValue: "0"
  - name: product_title
    xpath: //span[@class="product-name"]
  - name: platform_category
    xpath: ancestor::html//ol[contains(@class, "breadcrumb")]/li[contains(@class, "breadcrumb-item") and not(contains(@class, "active"))][last()]//text()
  - name: product_variations
    xpath: //div[@class="product-family-select"]//select/option/@value
  - name: stock_availability
    xpath: //*[@data-drupal-selector="drupal-settings-json"]
    jq: .jysk_react.checkout.online_sales
    defaultValue: "no"
  - name: main_image
    xpath: //div[contains(@class, "carousel-product-images")]/div[contains(@class, "carousel-inner")]/div[contains(@class, "active")]/button/img/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, "carousel-product-images")]/div[contains(@class, "carousel-inner")]/div[contains(@class, "carousel-item")][not(contains(@class, "active"))]/button/img/@src
  - name: description
    xpath: //div[contains(@class, "product-details-description")]/p/text()
  - name: pack_size
    xpath: //span[@class="product-name"]
    defaultValue: 1
  - name: user_reviews
    xpath: //span[contains(@class, "ssr-product-reviews-stats__item")][last()]
    regExp: \d+
  - name: average_rating
    xpath: //span[contains(@class, "ssr-product-reviews-stats__item")][1]/text()
  - name: width
    xpath: //div[contains(@class, "product-specifications")]//td[(contains(text(), "Größe montiert") or contains(text(), "Größe Laken") or text()="Größe") and not(contains(@class, 'value'))]/following::td[1]
    defaultValue: "0"
  - name: height
    xpath: //div[contains(@class, "product-specifications")]//td[(contains(text(), "Größe montiert") or contains(text(), "Größe Laken") or text()="Größe") and not(contains(@class, 'value'))]/following::td[1]
    defaultValue: "0"
  - name: length
    xpath: //div[contains(@class, "product-specifications")]//td[(contains(text(), "Größe montiert") or contains(text(), "Größe Laken") or text()="Größe") and not(contains(@class, 'value'))]/following::td[1]
    defaultValue: "0"
  - name: depth
    xpath: //div[contains(@class, "product-specifications")]//td[(contains(text(), "Größe montiert") or contains(text(), "Größe Laken") or text()="Größe") and not(contains(@class, 'value'))]/following::td[1]
    defaultValue: "0"
  - name: diameter
    xpath: //div[contains(@class, "product-specifications")]//td[(contains(text(), "Größe montiert") or contains(text(), "Größe Laken") or text()="Größe") and not(contains(@class, 'value'))]/following::td[1] | //div[@id="Produkteigenschaften"]//table//td[contains(text(), "Durchmesser")]/following-sibling::td
    defaultValue: "0"
  - name: dimensions_unit
    xpath: //div[contains(@class, "product-specifications")]//td[(contains(text(), "Größe montiert") or contains(text(), "Größe Laken") or text()="Größe") and not(contains(@class, 'value'))]/following::td[1] | //div[@id="Produkteigenschaften"]//table//td[contains(text(), "Durchmesser")]/following-sibling::td
  - name: weight
    xpath: //div[contains(@class, "product-specifications")]//td[contains(text(), "Gesamtgewicht") or contains(text(), "Gewicht") and not(contains(@class, 'value'))]/following::td[1]
    defaultValue: "0"
  - name: materials
    xpath: //div[contains(@class, "product-specifications")]//td[contains(text(), "setzung") and not(contains(@class, 'value'))]/following::td[1] | //div[@id="Produkteigenschaften"]//table//td[contains(text(), "Material")]/following-sibling::td
  - name: colour
    xpath: //div[contains(@class, "product-specifications")]//td[not(contains(@class, "value")) and contains(text(), "Farbe") and not(contains(@class, 'value'))]/following::td[1]
  - name: product_details
    xpath: //div[contains(@class, "product-specifications")]

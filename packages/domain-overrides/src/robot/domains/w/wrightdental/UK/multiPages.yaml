singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class,'GridContainerItem')]
fields:
  - name: category
    xpath: //p[contains(@class,'SubCategorystyles__Text')]

  - name: productURL
    xpath: //a/@href
    regExp: (.+)
    regExpReplace: https://www.wrightdental.co.uk$1

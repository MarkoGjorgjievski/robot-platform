singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: (//header[contains(@class, 'ProductDetailInfoBlock-header')]/h1)[1]

  - name: listing_id
    xpath: //ol//li[contains(., 'SKU:')]
    regExp: 'SKU: (.+)'
    regExpReplace: $1

  - name: offer_price
    xpath: //span[contains(text(),'On Sale')]/ancestor::html//script[contains(@type,'application') and contains(text(),'"@type":"Product"')]
    jq: .offers.price

  - name: original_price
    xpath: //div[contains(@data-enzyme-id,'infoBlock')]//span[contains(text(),'was')]/following-sibling::s
    regExp: \d+(\.\d+)?
    defaultValue: 'dummy'

  - name: original_price_backup
    xpath: //script[contains(@type,'application') and contains(text(),'"@type":"Product"')]
    jq: .offers.price

  - name: platform_category
    xpath: //ol/li[1]
    regExp: '(.+[a-zA-Z])'

  - name: current_link
    xpath: (//head/link/@href)[1]

  - name: product_variations
    xpath: //*[@data-enzyme-id='BaseToggleInput']/@value

  - name: stock_availability
    xpath: //button[contains(text(), 'Out of Stock')]
    regExp: (.+)
    regExpReplace: 'no'
    defaultValue: 'yes'

  - name: main_image
    xpath: (//div[contains(@class, 'ProductDetailImageCarousel-image')]//img/@src)[1]
    downloadContent: 'text'

  - name: alternative_images
    xpath: (//div[contains(@class, 'ProductDetailImageCarousel-image')]//img/@src)

  - name: description
    xpath: //div[contains(@class, 'ProductOverviewInformation-content')]

  - name: pack_size
    xpath: //head//title[contains(text(), 'Set of')] | //div[contains(text(), 'Number of Items')]/parent::*//following-sibling::*[1]
    regExp: '(\b\d+\b)'
    defaultValue: '1'

  - name: user_reviews
    xpath: //script[contains(@type,'application') and contains(text(),'"@type":"Product"')]
    jq: .aggregateRating.reviewCount

  - name: average_rating
    xpath: //script[contains(@type,'application') and contains(text(),'"@type":"Product"')]
    jq: .aggregateRating.ratingValue

  - name: diameter
    xpath: //dt[contains(text(), 'Diameter')]/following-sibling::*
    regExp: '\d+'

  - name: height
    xpath: //div[contains(@class, 'ProductWeightsDimensions')]//*[text()='Overall']/following-sibling::*[1]
    regExp: '(\d+(?:\.\d+)?)cm\s*H'
    regExpReplace: $1

  - name: width
    xpath: //div[contains(@class, 'ProductWeightsDimensions')]//*[text()='Overall']/following-sibling::*[1]
    regExp: '(\d+(?:\.\d+)?)cm\s*W'
    regExpReplace: $1

  - name: length
    xpath: //div[contains(@class, 'ProductWeightsDimensions')]//*[text()='Overall']/following-sibling::*[1]
    regExp: '(\d+(?:\.\d+)?)cm\s*L'
    regExpReplace: $1

  - name: depth
    xpath: //div[contains(@class, 'ProductWeightsDimensions')]//*[text()='Overall']/following-sibling::*[1]
    regExp: '(\d+(?:\.\d+)?)cm\s*D'
    regExpReplace: $1

  - name: weight_raw
    xpath: //div[contains(@class, 'ProductWeightsDimensions')]//*[text()='Overall Product Weight']/following-sibling::*[1]
    regExp: '(.+)kg'
    regExpReplace: $1

  - name: materials
    xpath: (//*[contains(@class, 'Specifications-descriptionList')]//*[contains(text(), 'Material')]/parent::*[1]/following-sibling::*[1])[1]

  - name: colour
    xpath: //div[contains(text(), 'Colour')]/parent::*//following-sibling::*[1] | //p[contains(text(),'Colour')]/following-sibling::p

  - name: product_details
    xpath: //*[contains(@class, 'Specifications-descriptionList')]
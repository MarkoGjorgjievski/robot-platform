singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@class='BuyBox block' and //table//tr//table[@class='venue-details' and //img[contains(@src,'date.svg')] and //img[contains(@src, 'time.svg')]]] | //div[@id='Page' and not(//div[@class='BuyBox block' and //table//tr//table[@class='venue-details' and //img[contains(@src,'date.svg')] and //img[contains(@src, 'time.svg')]]])]
fields:
  - name: eventPrice
    xpath: //td//h2[contains(text(),'General admission')]//parent::td//following-sibling::td//table//tr//th[contains(text(),"Ticket price")]//following-sibling::td|//td//h2[contains(text(),'General Admission')]//parent::td//following-sibling::td//table//tr//th[contains(text(),"Ticket price")]//following-sibling::td
  - name: eventName
    xpath: ancestor::html//h
  - name: eventDateGlobal
    xpath: ancestor::html//meta[@property='fbwegottickets:date']/@content | ancestor::html//div[contains(@class, 'event-information')]//table[@class='venue-details']//tr[td/img[contains(@src, 'date')]]/td[last()]
  - name: eventDateRow
    xpath: .//th[img[contains(@src, 'date.svg')]]/following-sibling::td
  - name: eventTime
    xpath: ancestor::html//div[contains(@class, 'event-information')]//table[@class='venue-details']//tr[td/img[contains(@src, 'time')]]/td[last()] | .//th[img[contains(@src, 'time.svg')]]/following-sibling::td
    regExp: ([\d:]{4,5}[a-z]{1}m)$
  - name: eventNote
    xpath: (ancestor::html//div[contains(@class, 'event-information')]//table[@class='venue-details']//tr[td/img[contains(@src, 'person')]]/td[last()] | //div[contains(@class, 'event-information')]//table[@class='venue-details']//tr[td/img[contains(@src, 'person')]]/td[last()])[1]
  - name: isPublicPurchase
    defaultValue: "true"
    type: BOOLEAN
  - name: venueName
    xpath: (ancestor::html//table[@class='venue-details']//tr/td[img[contains(@*,'location')]]/following-sibling::*//text())[1]
    regExp: (?<=:\ ).+
  - name: venueCity
    xpath: ancestor::html//table[@class='venue-details']//tr[td[*[contains(@*,'location')]]]
    regExp: ^[^:]*
  - name: postalCodeJQ
    xpath: ancestor::html//script[contains(@type,'application/ld+json')]
    jq: .location.address
  - name: postalCode
    xpath: ancestor::html//div[@class='EventLocation']//span/text() | ancestor::html//div[@class='EventLocation']//p[br]/text() | ancestor::html//div[@class='bottomtext' and b[contains(text(), 'Venue address')]]/br[last()]/following-sibling::text()
    regExp: ([A-Z0-9]{2,4} ?[A-Z0-9]{2,4})
  - name: eventUrl
    xpath: ancestor::html//link[@rel='canonical']/@href
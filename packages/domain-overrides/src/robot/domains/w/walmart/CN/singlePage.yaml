singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1

  - name: listing_id
    xpath: //script[@type="application/ld+json"][contains(text(), "Product")]
    jq: .sku

  - name: original_price
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.product.priceInfo.wasPrice.price


  - name: offer_price
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.product.priceInfo.currentPrice.price

  - name: platform_category
    xpath: //nav[@aria-label="breadcrumb"]//li/a[contains(@class, "black")]/span/text()

  - name: stock_availability
    xpath: //script[@type="application/ld+json"][contains(text(), "Product")]
    jq: .offers.availability

  - name: product_variations_raw
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.variantProductIdMap
    # regExp: (.+)
    # regExpReplace: https://www.walmart.ca/en/ip//$1

  - name: main_image
    xpath: //div[@data-testid="hero-image-container"]//div[@data-testid="media-thumbnail"]//img/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //div[@data-testid="media-thumbnail"]//img/@src

  - name: description
    # xpath: //div[@data-testid="product-description-content"]//span/div
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.idml | "\(.shortDescription) \(.longDescription)"

  - name: user_reviews
    xpath: //script[@type="application/ld+json"][contains(text(), "Product")]
    jq: .aggregateRating.reviewCount

  - name: average_rating
    xpath: //script[@type="application/ld+json"][contains(text(), "Product")]
    jq: .aggregateRating.ratingValue

  - name: colour
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name |contains("Colour")) | .value

  - name: materials
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Material")) | .value

  - name: size_raw
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Size")) |.value
  - name: width
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Width")) |.value

  
  - name: length
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Length")) |.value

  
  - name: height
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Height")) |.value

  - name: diameter
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Diameter")) |.value
  
  - name: depth
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Depth")) |.value

  - name: weight_raw
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("Weight")) |.value

  - name: pack_size
    xpath: //script[@id="__NEXT_DATA__"]  
    jq: .props.pageProps.initialData.data.idml.specifications[] | select(.name | contains("pieces")) |.value
    regExp: \d+

  - name: product_details
    xpath: //script[@id="__NEXT_DATA__"]
    jq: '.props.pageProps.initialData.data.idml.specifications[] | "\(.name): \(.value)"'


# constants
  - name: dimensions_unit
    defaultValue: 'in'
  
  - name: weight_unit
    defaultValue: lbs
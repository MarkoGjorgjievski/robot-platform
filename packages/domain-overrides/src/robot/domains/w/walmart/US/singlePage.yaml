
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: startingPriceType
    defaultValue: 'Was'
    
  - name: isBundle
    defaultValue: 'No'
  - name: categoryChain
    # xpath: //nav[@aria-label="breadcrumb"]//li/a[not(contains(@class, "black"))]/span/text()
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.category.path[0:-1][].name

  - name: manufacturerPartNumber
    xpath: //*[@id="product-description-atf"]
    regExp: 'Manufacturer Part Number: (\w+)'
    regExpReplace: $1
    defaultValue: 'empty'

  - name: manufacturerPartNumber_backup
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.manufacturerProductId
  #   defaultValue: empty

  - name: sku
    xpath: //meta[@property="og:url"]/@content
    regExp: \/(\d+)$
    regExpReplace: $1

  - name: URL
    xpath: //meta[@property="og:url"]/@content
    

  - name: hasVariant
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.variantsMap | map(.productUrl) | join(", ")

  #  all the variant fields are generated from those 3 fields in transform:
  - name: productName
    xpath: //h1

  - name: brand
    xpath: //h1
    regExp: (John Deere|Pennzoil|Super Tech|Valvoline|Castrol|Quaker State|Motorcraft|Lucas Oil|Shell|Mobil Delvac|Havoline|Royal Purple|Delo|Chevron|Liqui Moly|Ambrosia|Briggs & Stratton|Mobil 1|Yamaha|Kawasaki|Hyper Tough|Quicksilver|DELO)
    regExpReplace: $1
    defaultValue: empty
  - name: brand_backup
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.brand


  
  - name: viscosity
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.viscosity

  - name: packSize
    xpath: //h1
    regExp: ([.\d]+\s*-?\s*(?:oz|Quarts?|Gallons?|Gal|GAL|OZ|PT|qt|QT|Qt|cc|Ounces?|Pints?|pt|gal|Liters?)|(?:Quart|Gallon|Ounce|Pint))
    regExpReplace: $1
    defaultValue: empty
  
  - name: packSize_backup
    xpath: //div[@data-testid="product-description-content"]
    regExp: ([.\d]+\s*-?\s*(?:oz|Quarts?|Gallons?|Gal|GAL|OZ|PT|qt|QT|Qt|cc|Ounces?|Pints?|pt|gal|Liters?)|(?:Quart|Gallon|Ounce|Pint))
    regExpReplace: $1
  
  - name: packSize_backup2
    xpath: //span[contains(@class, "b")][contains(., "Size")]/following-sibling::span
    regExp: ([.\d]+\s*-?\s*(?:oz|Quarts?|Gallons?|Gal|GAL|OZ|PT|qt|QT|Qt|cc|Ounces?|Pints?|pt|gal|Liters?)|(?:Quart|Gallon|Ounce|Pint))
    regExpReplace: $1
    
  - name: pricePerOunce
    xpath: //span[@data-testid="price-wrap"]//following-sibling::span[contains(text(), "¢/fl oz")]
    regExp: ([.\d]+)\s*¢\/fl oz
    regExpReplace: $1
    # xpath: //script[@id="__NEXT_DATA__"]  
    # jq: '.props.pageProps.initialData.data.product.groupMetaData?.groupComponents[]? // [{quantity: 1}][] | [.quantity] | add'

  - name: pricePerQuart
    xpath: //span[@data-testid="price-wrap"]//following-sibling::span[contains(text(), "/qt")]
    regExp: ([.\d]+)\s*\/qt
    regExpReplace: $1

  - name: retailPrice
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.priceInfo.currentPrice.price

  - name: RRP_Was
    xpath: //script[@id="__NEXT_DATA__"]
    jq: '.props.pageProps.initialData.data.product.priceInfo.wasPrice.price'
    defaultValue: empty

  
  # American website so it doesn't have VAT
  # - name: priceNoVAT
  #   defaultValue: empty
  


  - name: promoPrice
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.priceInfo.savingsAmount.amount

  - name: inStockOnline
    xpath: //script[@type="application/ld+json"][contains(text(), "Product")]
    jq: .offers.availability
    regExp: 'OUT_OF_STOCK'
    regExpReplace: 'no'
    defaultValue: 'yes'

  - name: inStockStore
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.product.fulfillmentOptions[] | select(.type=="PICKUP") | .availabilityStatus
    regExp: 'OUT_OF_STOCK'
    regExpReplace: 'no'
    defaultValue: 'yes'

  - name: specificationProfile
    # xpath: //div[./h2[contains(., "Specifications")]]/following-sibling::div
    xpath: //div[@data-testid="product-description-content"]

  - name: productDescription
    xpath: //div[@data-testid="product-description-content"]

  - name: productRating
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.reviews.roundedAverageOverallRating
    # jq: .props.pageProps.initialData.data.reviews.customerReviews[] | "\(.reviewTitle//"")\n\(.reviewText)"

  - name: ratingCount
    xpath: //script[@id="__NEXT_DATA__"]
    jq: .props.pageProps.initialData.data.reviews.totalReviewCount

  - name: rawAvailabilityMessage
    xpath: //label[./*[@id="fulfillment-Pickup"]]

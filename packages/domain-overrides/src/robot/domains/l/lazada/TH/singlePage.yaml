singleRecord: false
regionsSelector: null
recordSelector: null
#  we skip the first one because it's a default [0] variant which duplicates one of the existing variants
recordXPath: (//script[contains(@id, "moduleData-skuInfos")])[position() > 1]
fields:
    # CHANGEME to your country
  - name: country
    defaultValue: 'TH'
    # CHANGEME to your currency code
  - name: currencyOverride
    defaultValue: 'THB'

  - name: name
    xpath: ancestor::html//script[@id="moduleData-product"]
    jq: .title
    
  - name: aggregateRating
    xpath: ancestor::html//script[@id="moduleData-product"]
    jq: .rating.score
    
  - name: reviewCount
    xpath: ancestor::html//script[@id="moduleData-product"]
    jq: .rating.total
    
  - name: resellerName
    xpath: ancestor::html//script[@id="moduleData-seller"] 
    jq: .name
    defaultValue: Lazada

  - name: resellerId
    xpath: ancestor::html//script[@id="moduleData-seller"]  
    jq: .shopId
    
  - name: resellerLink
    xpath: ancestor::html//script[@id="moduleData-seller"]  
    jq: .url
    
  - name: resellerAggregateRating
    xpath: ancestor::html//script[@id="moduleData-seller"]  
    jq: .percentRate  
    
  - name: resellerFeedbackPercent
    xpath: ancestor::html//script[@id="moduleData-seller"]  
    jq: .percentRate  
    
  - name: shippingCostSku
    xpath: '.'
    jq: .key

  - name: shippingCost
    xpath: (//*[contains(@class, "item__shipping-fee ")])[1]
    regExp: '(\d+\.\d+)'
    regExpReplace: '$1'
    
  - name: deliveryDateSku
    xpath: '.'
    jq: .key

  - name: deliveryDate
    xpath: //div[contains(@class, "delivery-option-item__time")]
    
  - name: imagesSku
    xpath: '.'
    jq: .key

  - name: productId
    xpath: '.'
    jq: .value.itemId
    
  - name: offerPrice
    xpath: '.'
    jq: .value.price.salePrice.value
    
  - name: unitsStock
    xpath: '.'
    jq: .value.stock
    
  - name: brandText
    xpath: '.'
    jq: .value.dataLayer.brand_name

  - name: listPrice
    xpath: '.'
    jq: .value.price.originalPrice.value
    
  - name: productDescription
    xpath: ancestor::html//script[@id="moduleData-product"]
    jq: .desc

  - name: productHighlights
    xpath: ancestor::html//script[@id="moduleData-product"]
    jq: .highlights
    
  - name: productSKU
    xpath: '.'
    jq: .value.skuId
  
  - name: parentCategory
    xpath: ancestor::html//ul/li[contains(@class, "breadcrumb_item")][last()-2]//a
  
  - name: childCategory
    xpath: ancestor::html//ul/li[contains(@class, "breadcrumb_item")][last()-1]//a  
  
  - name: itemNumber
    xpath: '.'
    jq: .value.itemId
  
  - name: productURL
    xpath: '.'
    jq: .key

  - name: productStyle
    xpath: '.'
    jq: .key

  - name: skuMap
    xpath: ancestor::html//script[@id="moduleData-skus"]

  - name: propertyMap    
    xpath: ancestor::html//script[@id="moduleData-properties"]

  - name: imagesMap
    xpath: ancestor::html//script[@id="moduleData-skuGalleries"]

  - name: deliveryMap
    xpath: ancestor::html//script[@id="moduleData-deliveryOptions"]
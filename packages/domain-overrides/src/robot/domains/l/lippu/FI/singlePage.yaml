singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:

  - name: eventName
    xpath: //script[@id="event-data"]
    jq: '.[0].event_name'

  - name: venueName
    xpath: //script[@id="event-data"]
    jq: '.[0].event_venue_name'

  - name: venueCity
    xpath: //script[@id="event-data"]
    jq: '.[0].event_city_name'

  - name: eventDate
    xpath: //script[@id="event-data"]
    jq: '.[0].event_date'

  - name: eventTime
    xpath: //script[@id="event-data"]
    jq: '.[0].event_date'

  - name: isPublicPurchase
    xpath: //script[@id="event-data"]
    jq: '.[0].event_tickets_available'

  - name: publicPurchaseOverride
    xpath: boolean(//div[contains(@class, "ticket-type-unavailable-sec")][contains(text(), "not available") or contains(text(),  "No longer deliverable" ) or contains(text(),  "Sold out" )])

  - name: eventNotes

    xpath: //div[contains(@class, "alert-warning")] | //div[contains(@class, "alert-warning")]//a/@data-href

  - name: postalCode
    xpath: //script[@id="event-data"]
    jq: '.[0].event_postal_code'

  - name: venueAddress
    defaultValue: 'null'
    xpath: //div[@class="venue-address"]/p

  
  - name: venueAddressBackup
    xpath: //span[@data-qa="event-venue"]
    regExp: '\| (.+),'
    regExpReplace: $1

  - name: venueAmenities
    xpath: //div[@class="detailed-rating"]//div[@class="detailed-rating-item"]

  - name: onSaleDate
    xpath: //section[@data-c="onsalehint"]//h2

  - name: firstDepthURL
    xpath: //td[@class="link depth_1"] | //a[contains(@id,"item")][contains(@class,"theme-button")]/@href

  - name: eventURL
    xpath: //a[@data-qa="continue-button"]/@href

  - name: eventUniqueId
    xpath: //meta[@property="og:url"]/@content
    regExp: '-(\d+)/'
    regExpReplace: $1

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //div[contains(@class,'title-zone')]//h2[contains(@class,'title')] 

  - name: 'listing_id'
    xpath: //div/@data-id

  - name: 'offer_price'
    xpath: //meta[contains(@property,'og:price:amount')]/@content

  - name: 'original_price'    
    xpath: //span[contains(@class,'price-info line-through') and not(contains(@style,'hidden'))]
    regExp: '[\d.,]+'
    defaultValue: 'dummy'

  - name: 'platform_category' 
    xpath: //nav[contains(@class, 'breadcrumb-container')]//li[last()-1]//span

###################### Fields for variations ###########################################
  - name: 'product_variations'
    defaultValue: 'dummy'

  - name: 'product_variations_colors'
    xpath: "//button[contains(@class,'filter-item color') and not(ancestor::div[@disabled]) and not(ancestor::*[@style[contains(., 'display: none')]])]/@value"
    defaultValue: null

  - name: 'product_variations_size'
    xpath: "//button[contains(@class,'filter-item size') and not(ancestor::div[@disabled]) and not(ancestor::*[@style[contains(., 'display: none')]])]/@value"

  - name: 'base_url'
    xpath: //meta[contains(@property,'url')]/@content
########################################################################################

  - name: 'stock_availability'
    xpath: boolean((//button[contains(@id, 'btnAddToBasket')])[1])
    
  - name: 'main_image'
    xpath: //div[contains(@class, 'item active')]/picture/img/@src
    downloadContent: 'text'

  - name: 'alternative_images'
    xpath: //div[contains(@class, 'item')]/picture/img/@src

  - name: 'description'
    xpath: //div[contains(@id,'description')] | //div[contains(@id,'mainProductDescription')]
    
  - name: 'pack_size'
    xpath: "" 
    defaultValue: 1 
    
  - name: 'user_reviews'
    xpath: //span[contains(@class,'number-of-reviews')]
    regExp: \d+
    
  - name: 'average_rating'
    xpath: (//div[contains(@class,'rating-container')]//span[contains(@class,'review-number')])[1]
      
  - name: 'dimensions_unit'
    xpath: 
    defaultValue: 'cm'

  - name: 'dimensions_data'
    xpath: //meta[contains(@property,'og:description')]/@content
      
  - name: 'height'
    xpath: //div[contains(@class, '-description-attr')]/text()[contains(.,'Tailles')]/following-sibling::span
    defaultValue: 'dummy'

  - name: 'width'
    xpath:  //div[contains(@class, '-description-attr')]/text()[contains(.,'Tailles')]/following-sibling::span
    defaultValue: 'dummy'

  - name: 'depth'
    xpath: (//div[contains(@id, 'Description')]//text()[contains(., 'Profondeur')])[1]
    regExp: (?<=:\s\*)([\d.,]+)|(\d+(\.\d+)?)
    defaultValue: 'dummy'
    
  - name: 'length'
    xpath: (//div[contains(@id, 'mainProductDescription')]//text()[contains(., 'Longueur')])[1]
    regExp: (?<=:\s\*)([\d.,]+)|(\d+(\.\d+)?)
    defaultValue: 'dummy'
    
  - name: 'weight_unit'
    xpath: 
    defaultValue: null
     
  - name: 'weight_raw'
    xpath: //div[contains(@id, 'Description')]//text()[contains(.,'Poids')]
    regExp: (?<=:\s\*)([\d.,]+)|(\d+(\.\d+)?)
    defaultValue: 'dummy'
    
  - name: 'materials'
    xpath: > 
      //div[contains(@id,'mainProductDescription')]/p//*[contains(text(),'Caractéristiques')]/following-sibling::text()[contains(.,'Matière')] 
      | 
      //div[contains(@id,'mainProductDescription')]/p/following-sibling::text()[contains(.,'Matière ')] 
      | 
      //div[contains(@id,'mainProductDescription')]//*[contains(text(),'Matière')]/following-sibling::text()
      |
      //div[contains(@id,'mainProductDescription')]//ul/li
      |
      //div[contains(@id,'mainProductDescription')]//td[contains(text(),'Matériau')] /following-sibling::td
      |
      //div[contains(@id,'mainProductDescription')]/p/text()[contains(.,'Matière ')] 
      |
      //div[contains(@id,'mainProductDescription')]//text()[contains(.,'%')]

  - name: 'colour'
    xpath: //div[@data-colorname]/@data-colorname
    
  - name: 'product_details'
    xpath: //div[contains(@id, 'mainProductDescription')]

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: main_image
    xpath: //meta[@property="og:image"]/@content
    downloadContent: "text"

  - name: alternative_images
    xpath: //div[@id="product-carousel"]//ul//li//img/@src
    regExp: (https.+)
    regExpReplace: $1

  - name: average_rating
    xpath: //*[@class="dataJsonLd"]
    jq: .aggregateRating.ratingValue

  - name: user_reviews
    xpath: //*[@class="dataJsonLd"]
    jq: .aggregateRating.reviewCount

  - name: colour
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Kolor") or contains(text(), "kolor")]]//td

  - name: depth
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Głębokość (w cm)") or contains(text(), "Głębokość całkowita (w cm)")]]//td

  - name: width
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Szerokość (w cm)") or contains(text(), "Szerokość całkowita (w cm)")]]//td

  - name: length
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Długość (w cm)") or contains(text(), "Długość całkowita (w cm)")]]//td
    
  - name: height
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Wysokość (w cm)") or contains(text(), "Wysokość całkowita (w cm)")]]//td

  - name: weight
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Waga")]]//td

  - name: dimensions_aggregated
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Wymiary")]]//td

  - name: diameter
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Średnica (w cm)")]]//td
    
  - name: description
    xpath: //div[@class="o-product-detail-informations__description"]

  - name: listing_id
    xpath: //*[@class="dataJsonLd"]
    jq: .sku

  - name: product_title
    xpath: //*[@class="dataJsonLd"]
    jq: .name

  - name: crossed_price 
    xpath: //div[@id="product-price"]//span[@data-cerberus="CROSSED_PRICE"]
    regExp: ([0-9,\.]+)
    regExpReplace: $1

  - name: current_price
    xpath: //*[@class="dataJsonLd"]
    jq: .offers.price

  - name: platform_category
    xpath: //nav[@id="component-breadcrumb"]//li[last()-1]//a

  - name: product_variations
    xpath: //ul[@class="product-variants__list"]//li//a/@href
    regExp: (.+)
    regExpReplace: https://www.leroymerlin.pl$1

  - name: stock_availability
    defaultValue: "yes"
    # jq: if . == "temporarily-unavailable" then "no" else "yes" end
    # defaultValue: "yes"

  - name: pack_size
    xpath: //*[@class="dataJsonLd"]
    jq: .name
    defaultValue: "1"

  - name: dimensions
    defaultValue: "cm"

  - name: weight_unit
    defaultValue: "kg"

  - name: materials
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr[.//th[contains(text(), "Materiał")]]//td

  - name: product_details
    xpath: //table[@data-cerberus="TABLE_AttributesProduct"]//tr
    defaultValue: ""

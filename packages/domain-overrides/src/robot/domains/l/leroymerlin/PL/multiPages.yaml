singleRecord: false
recordXPath: //*[contains(@class, 'js-list-products') or @class="component-childrencategories" or contains(@class, "ProductBlockWrapper")]//a
fields:
  - name: productURL
    xpath: //@href
    regExp: (.+)
    regExpReplace: https://www.leroymerlin.pl$1
  
  - name: firstDepthURL
    xpath: ancestor::html//*[@class="component-childrencategories"]//a//@href
    regExp: (.+)
    regExpReplace: https://www.leroymerlin.pl$1

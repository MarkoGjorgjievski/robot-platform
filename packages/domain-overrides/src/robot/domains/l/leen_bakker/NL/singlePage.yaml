singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: (//h1)[1]
  - name: listing_id
    xpath: //*[contains(text(), 'EAN nummer')]/ancestor::div[1]//span
#  - name: offer_price
#    xpath: //div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-cssveg')]
#  - name: original_price
#    xpath: (//div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-cssveg')]/../../span)[1]
  - name: offer_price
    xpath: //p[contains(@class, 'chakra-text') and contains(text(), 'Je bespaart')]/ancestor::div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-cssveg')]
  - name: original_price
#    xpath this is also valid and can be used: (//div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-cssveg')]//ancestor::div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-ueycy')] | //div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-cssveg') and not (//span[contains(@class, 'css-1bh9inw')])])[1]
    xpath: ((//div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-ueycyn')]) | //div[contains(@class, 'css-1ev5i8e')]//span[contains(@class, 'css-cssveg')])[1]
  - name: platform_category
    xpath: //ol//li[last()-1]//a
  - name: product_variations
    xpath: //div[contains(@class, 'chakra-menu__menu-list')]//a/@href
  - name: stock_availability
    xpath: //*[contains(text(), 'In winkelmandje')][@disabled]
    defaultValue: 'yes'
  - name: main_image
    xpath: (//a[contains(@id, 'MagicZoomViewer')]//img)[1]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //a[contains(@data-zoom-id, 'MagicZoomViewer')]//img/@src
  - name: description
    xpath: //div[contains(@itemprop, 'description')]
  - name: pack_size
    xpath: (//h1)[1]
  - name: user_reviews
    xpath: ((//h1)[1]/../a/span)[2]
  - name: average_rating
    xpath: ((//h1)[1]/../a/span)[2]
#    regExp: '^(\d+(\.\d+)?)'
#  #    defaultValue: 'no average_rating on this specific product'
#  #  - name: dimensions
#  #    xpath:
#  #    defaultValue: 'in sub fields'
  - name: dimensions_unit
    xpath: (//h1)[1]
    defaultValue: 'cm'
  - name: height
    xpath: (//*[contains(text(), 'Product afmetingen (cm)')])[1]/../span[contains(@class, 'chakra-text')]
#    regExp: '(\d+)'
  - name: width
    xpath: (//*[contains(text(), 'Product afmetingen (cm)')])[1]/../span[contains(@class, 'chakra-text')]
#    regExp: '(\d+)'
  - name: length
    xpath: (//*[contains(text(), 'Product afmetingen (cm)')])[1]/../span[contains(@class, 'chakra-text')]
  - name: diameter
    xpath: (//*[contains(text(), 'Product afmetingen (cm)')])[1]/../span[contains(@class, 'chakra-text')]
#  #    defaultValue: 'length is not set'
#  #  - name: weight
#  #    xpath:
#  #    defaultValue: 'weight is not set'
#  #  - name: weight_unit
#  #    xpath:
#  #    defaultValue: 'weight is not set'
#  #  - name: weight_raw
#  #    xpath:
#  #    defaultValue: 'weight is not set'
  - name: materials
    xpath: (//*[contains(text(), 'Materiaal')]/ancestor::div[1]//span)[1]
  - name: colour
    xpath: (//*[contains(text(), 'Kleur')]/ancestor::div[1]//span)[1]
  - name: product_details
    xpath: (//div[contains(@class, 'css-1b4r0ir')])[2]








singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: dummyField
    xpath: //div[@class='address']

  - name: brand
    xpath: //h1

  - name: brandVariant
    xpath: //h1

  - name: inStockOnline
    xpath: //script[contains(text(),"['__PRELOADED_STATE__'")]
    regExp: '"buyNowButtonFeatureActive":(.*?),'
    regExpReplace: $1
    defaultValue: 'no'

  - name: inStockStore
    xpath: //div[contains(@class,'pickup-wraper')]/label[contains(@class,'checked')]
    regExp: (.*)
    regExpReplace: 'yes'
    defaultValue: 'no'

  - name: isBundle
    xpath: //h6[contains(text(),'Package Quantity')]/ancestor::td/following-sibling::td

  - name: manufacturerPartNumber
    xpath: //p[contains(text(),'Model')]
    regExp: '#\s*(.+)'
    regExpReplace: $1

  - name: masterBrand
    xpath: //script[contains(text(),"['__PRELOADED_STATE__'")]
    regExp: '"brand":"(.*?)"'
    regExpReplace: $1

  - name: mutlipackFlag
    defaultValue: 'no data found'
  
  - name: mutlipackQuantity
    defaultValue: 'no data found'

  - name: packSize
    xpath: //h6[contains(text(),'Unit') and contains(text(),'Quantity')]/ancestor::td/following-sibling::td//p
    defaultValue: 'dummy'

  - name: packSizeUnit
    xpath: //h6[contains(text(),'Unit') and not(contains(text(),'Quantity'))]/ancestor::td/following-sibling::td//p
    defaultValue: 'dummy' 
 
  - name: packSizeBackup
    xpath: //h1

  - name: productDescription
    xpath: //span[contains(text(),'Overview')]/ancestor::div[contains(@class,'AccordionWrapper')]//span[contains(@class,'accordion-content')]

  - name: productName
    xpath: //h1[contains(@class,'product-brand-description')]

  - name: productRating
    xpath: (//div[contains(@class,'avgrating')])[1]

  - name: productVariant
    xpath: //h1

  - name: promotionDescription
    defaultValue: 'no data found'

  - name: quantity
    xpath: //h6[contains(text(),'Package Quantity')]/ancestor::td/following-sibling::td
    defaultValue: '1'

  - name: ratingCount
    xpath: (//div[contains(@data-testid,"price-fragment")]/span[contains(text(),'Total price is')])[1]
    regExp: \d+

  - name: retailPrice
    xpath: (//div[contains(@class,'PriceUIstyles__WrapperComponentInner')]/span[contains(@class,'screen-reader')])[1]
    regExp: \d+(\.\d{2})?

  - name: RRP_Was
    xpath: (//span[contains(@class,'was-price')]/text())[1]
    regExp: \d+(\.\d{2})?
    defaultValue: 'dummy'

  - name: sku
    xpath: //p[contains(text(),'Item')]
    regExp: '#\s*([a-zA-Z0-9]+)'
    regExpReplace: $1
  
  - name: specificationProfile
    xpath: //span[contains(text(),'Overview')]/ancestor::div[contains(@class,'AccordionWrapper')]//span[contains(@class,'accordion-content')]

  - name: startingPriceType
    xpath: (//span[contains(@class,'was-price')]/text())[1]
    regExp: (.+)
    regExpReplace: 'Was'
    defaultValue: 'RRP'

  - name: viscosity
    xpath: //script[contains(text(),"['__PRELOADED_STATE__'")]
    regExp: '"key":"Oil Weight","value":"([A-Za-z0-9-]+)"'
    regExpReplace: $1

  - name: rawAvailabilityMessage
    xpath: //div[contains(@class,'delivery-option') and contains(@class,'isSelected') or contains(@class,'no-selection')]

singleRecord: true
fields:
  - name: main_image
    xpath: //div[@class="zdjecie-glowne"]//img/@src
    downloadContent: 'text'

  - name: listing_id
    xpath: //*[@type="application/ld+json"]
    jq: .mpn
  
  - name: product_title
    xpath: //*[@type="application/ld+json"]
    jq: .name

  - name: alternative_images
    xpath: //div[contains(@class, "zdjecia-male")]//a/@href

  - name: description
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"opis")]
    defaultValue: ""

  - name: old_price
    xpath: //div[@class="md-price"]//span[@class="md-old-price"]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: current_price
    xpath: //*[@type="application/ld+json"]
    jq: .offers.price

  - name: platform_category
    xpath: //div[contains(@class, "breadcrumbs")]//li[last()-1]//span

# as link: https://www.merkurymarket.sk/vrobok/skrinka-do-kuchyne-bianka-60-dp210-2f,25166.html
# as options: https://www.merkurymarket.sk/vrobok/rohova-sedacia-suprava-margo-l-riviera-41,103921.html
  - name: product_variations
    xpath: > 
      //div[@class="zakladka-opis"]//div[@class="lista"]//a/@href |
      //div[@class="zakladka-opis"]//div[contains(@class,"variants")]//input[@data-link]/@data-link

  - name: pack_size
    xpath: //*[@type="application/ld+json"]
    jq: .name
    defaultValue: "1"

  - name: height_cm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Výška") and contains(text(),"cm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1
  
  - name: height_mm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Výška") and contains(text(),"mm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: depth_cm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Hĺbka") and contains(text(),"cm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1 
  
  - name: depth_mm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Hĺbka") and contains(text(),"mm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: width_cm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Šírka") and contains(text(),"cm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: width_mm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Šírka") and contains(text(),"mm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: length_cm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Dĺžka") and contains(text(),"cm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: length_mm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Dĺžka") and contains(text(),"mm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: diameter_cm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Średnica")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1
  
  - name: diameter_mm
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Średnica") and contains(text(),"mm")]]//div[contains(@class, "value")]
    regExp: (\d+,?\d*)
    regExpReplace: $1

  - name: colour
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and text()="Farba:"]]//div[contains(@class, "value")]
  
  - name: weight_raw
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and contains(text(),"Hmotnosť")]]//div[contains(@class, "value")]

  - name: materials
    xpath: >
      //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//div[@class="cecha" and .//div[@class="label" and 
      (contains(text(),"Poťahová") or contains(text(), "Konštrukcia") or contains(text(), "Materiál:"))
      ]]

  - name: product_details
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]
    defaultValue: ""

  - name: stock_availability
    xpath: //div[@class="zakladka-opis"]//div[contains(@class,"dane")]//span[contains(@class, "dostepny")]
    jq: if . == "tovar je dostupný" then "yes" else "no" end
    defaultValue: "yes"

  # no rating
  - name: average_rating
    defaultValue: null

  # no reviews
  - name: user_reviews
    defaultValue: null

  - name: dimensions_unit
    defaultValue: "cm"

  - name: weight_unit
    defaultValue: "kg"
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: "//h1[@class='product__title']"   

  - name: 'listing_id'
    xpath: "//input[contains(@name, 'product-id')]/@value"    

  - name: 'offer_price'
    xpath: "//*[@class[contains(., 'final-price')]//text() or @class[contains(., 'js-price')]]//text()[not(ancestor::div[@style='display: none;'])]"

  - name: 'original_price'    
    xpath: "//*[@class[contains(., 'js-compare-price')]]//text()"  

  - name: 'platform_category' 
    xpath: ''  

  - name: 'product_variations_link'
    xpath: concat(//link[@rel='canonical']/@href,'?variant=') 

  - name: 'product_variations'
    xpath: '//select/option[@data-variant-info]/@value | //select[contains(@class,"product-variant-selector")]/option/@value'  

  - name: 'stock_availability'
    xpath: "" 
    defaultValue: 'yes'   

  - name: 'main_image'
    xpath: "(//div[@class='product__image']//img[contains(@data-src,'www')]/@data-src)[1]"
    downloadContent: 'text'     

  - name: 'alternative_images'
    xpath: "//div[contains(@class,'product__thumb')]//img//@data-src"

  - name: 'description'
    xpath: "//div[@class='product__description']"   

  - name: 'pack_size'
    xpath: "count(//div[@class='product__pack']/div)"  

  - name: 'user_reviews'
    xpath: "(//div[@data-average-rating]/@data-number-of-reviews)[1]" 

  - name: 'average_rating'
    xpath: "(//div[@data-average-rating]/@data-average-rating)[1]" 

  - name: 'dimensions_unit'
    xpath: ""     
    defaultValue: 'cm'  

  - name: 'measurements'   
    xpath: "//li[contains(text(), 'Medidas')]"

  - name: 'width'
    xpath: "(//select[contains(@class, 'product-variant-selecto')]/option)[1]"     
    defaultValue: 'dummy'

  - name: 'length'
    xpath: "(//select[contains(@class, 'product-variant-selecto')]/option)[1]" 
    defaultValue: 'dummy'

  - name: 'height'
    xpath: "(//li[contains(text(),'Altura')][not(ancestor::div[contains(@class, 'comparison')])])[1]"  
    regExp: \d+
    defaultValue: 'dummy' 

  - name: 'weight_unit'
    xpath: "//li[contains(text(), 'Peso')]"
    regExp: ..$

  - name: 'weight_raw'
    xpath: "//*[contains(text(), 'Peso')]"     
    regExp: (\d+,\d+)

  - name: 'materials'
    xpath: "//*[contains(text(), 'Materiales')]/following-sibling::div"   

  - name: 'colour'
    xpath: "(//input[@name='color'])[1]/@value"

  - name: 'product_details'
    xpath: "//div[@class='specs__body']//ul/li | //div[@class='specs__body']//p | //div[@class='product__features']/ul/li" 
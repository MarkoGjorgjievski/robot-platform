singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[contains(@class, 'text-primary-accent font-regular ds-headline-s inline-block before:content-[attr(data-line)]')]
 
  - name: listing_id
    xpath: //*[@id = 'product-details']//*[contains(@class, 'text-primary-light font-regular ds-caption')] | //*[@id = 'product-description']//*[contains(@class, 'text-primary-light font-regular ds-caption')]
    regExp: (?<=Rif.\s)(.*)
 
  - name: offer_price
    xpath: //*[contains(@class, 'text-primary font-regular ds-strike-price-l')]
    regExp: (.*)(?=\s€)
 
  - name: original_price
    xpath: //*[contains(@class, 'text-primary-accent font-semibold ds-body-l')]
    regExp: (.*)(?=\s€)
 
  - name: platform_category
    xpath: //*[@data-el="ds-breadcrumb-link"][last()]
 
  - name: stock_availability
    xpath: boolean(//*[@data-el="shipping-add-to-cart-button"])

  - name: main_image
    xpath: //*[@data-el="media-gallery"]//*[@data-el="ds-image"][1]//*/@src | //*[@data-el="product-media-gallery"]//*[@data-el="ds-image"][1]//*/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //*[@data-el="media-gallery"]//*[@data-el="ds-image"][position() > 1]//*/@src

  - name: description
    xpath: //*[@id = 'product-description']//*[contains(@data-el, "product-description-block__rich-text")]
 
  - name: materials
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Materiale')]//following-sibling::td
 
  - name: colour
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Colore')]//following-sibling::td
 
  - name: weight_raw
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Peso')]//following-sibling::td
    regExp: \d\S*
 
  - name: height
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Altezza')]//following-sibling::td
    regExp: \d\S*
 
  - name: depth
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Profondità')]//following-sibling::td
    regExp: \d\S*
 
  - name: length
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Lunghezza')]//following-sibling::td
    regExp: \d\S*
 
  - name: user_reviews
    xpath: //*[@href="#customer-reviews"]/text()
    regExp: \d+
 
  - name: average_rating
    xpath: //*[contains(@class, 'text-primary-accent font-bold ds-headline-m !leading-[1]')]
 
  - name: product_variations
    xpath: //*[contains(@data-el, "product-variants--colors")]//*[contains(@data-el, "ds-thumbnail-group")]//a/@href | //*[contains(@data-el, "ds-dialog__content")]//a[not(contains(@class, "cursor-pointer"))]/@href
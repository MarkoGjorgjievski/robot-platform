singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "accordion__detail-wrapper")]//details[contains(@id, "tickets")]
fields:
  - name: eventName
    xpath: //details//h2[contains(@class, "tickets-block__item-title")]
  - name: venueName
    xpath: //details//span[contains(@class, "accordion__item-title-wrapper")]/span[contains(@class, "accordion__item-subtitle")]
  - name: venueAddress
    xpath: //details//div[contains(@class, "tickets-block__item-text")][p[2]]/p[2]/text()[1] | //details//div[contains(@class, "tickets-block__item-text")][not(p[2])]/p[1]/text()[1]
  - name: venueCountryCode
    xpath: 
    defaultValue: 'NL'
  - name: eventDate
    xpath: //details//span[contains(@class, "accordion__item-title-wrapper")]/span[contains(@class, "accordion__item-title")]
  - name: eventTime
    xpath: //details//span[contains(@class, "accordion__item-text")]
  - name: isPublicPurchase
    xpath: //details//div[contains(@class, "tickets-block__ticket-form-wrapper") and not(contains(@class, "u-hidden"))]//a/span[contains(text(), "KOOP KAARTEN")]
  - name: isTBA
    xpath:
  - name: eventURL
    xpath: //link[@rel="canonical"]/@href
  - name: eventNotes
    xpath: ancestor::html//div[@id="tickets-modal--0"]//div[contains(@class, "tickets-modal__content is--active")]/div/p/text()
  - name: onSaleDate
    xpath: //p[@data-date]/@data-date
  - name: onSaleDateTime
    xpath: //p[@data-time]/@data-time
  # - name: preSaleDate 
  #   xpath: ancestor::html//h2[contains(@class, "newsletter-form__title")][//text()[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'meld je aan voor de presale')]]/following-sibling::div/div[1]/text()

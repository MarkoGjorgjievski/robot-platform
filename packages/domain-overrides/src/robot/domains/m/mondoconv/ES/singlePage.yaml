singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //td[contains(@class, "items depth_2")]//td[contains(@class, "name depth_3")]
  
  - name: listing_id
    xpath: //td[contains(@class, "sku depth_3")]
  
  - name: original_price
    xpath: //td[contains(@class, "minimum_price depth_4")]//td[contains(@class,"regular_price_excl_tax")]//td[contains(@class, "value")]
  
  - name: offer_price
    xpath: //td[contains(@class, "minimum_price depth_4")]//td[contains(@class,"final_price_excl_tax")]//td[contains(@class, "value")]
  
  - name: platform_category
    # xpath: //td[contains(@class, "mc_techspecs_template depth_3")]
    xpath: //td[@class="categories depth_3"]//tr[1]/td[@class="name depth_4"]
  
  - name: product_variations
    xpath: //td[contains(@class, "mc_available_colors depth_3")]//td[contains(@class, "url depth_4")] | //td[contains(@class, "mc_product_variants")]//td[contains(@class, "url depth_4")]
    regExp: (.+)
    regExpReplace: https://www.mondoconv.es$1

  - name: stock_availability
    xpath: //td[contains(@class, "stock_status depth_3")]
    defaultValue: 'no'
    regExp: (.+)
    regExpReplace: 'yes'
  
  - name: main_image
    xpath: //td[contains(@class,"mc_product_listing_images depth_3")]//td[contains(@class, "main")]
    downloadContent: 'text'
    # regExp: https(.+)
    # regExpReplace: http$1
    
    
  
  - name: alternative_images
    xpath: //td[contains(@class, "media_gallery_entries depth_3")]//td[contains(@class, "large")]//td[contains(@class, "url")]
    
    # regExp: https(.+)
    # regExpReplace: http$1
  
  - name: description
    xpath: //td[contains(@class, "mc_inline_description") and contains(@class, "depth_2")] 
 
  - name: pack_size
    xpath: //td[contains(@class, "quantita depth_3")]//td[contains(@class, "value")]
  
  - name: user_reviews
    xpath: //td[contains(@class, "review_count depth_3")]
    # defaultValue: "0"
  
  - name: average_rating
    xpath: //td[contains(@class, "rating_summary depth_3")]
    # defaultValue: "0"


  # - name: dimensions
  #   defaultValue: "null"

  - name: dimensions_unit
    defaultValue: "cm"

  - name: height
    xpath: //td[contains(@class, "products")]//td[contains(@class, "mc_dimension_height depth_3")]
  
  - name: width
    xpath: //td[contains(@class, "products")]//td[contains(@class, "mc_dimension_width depth_3")]
    
  - name: length
    xpath: //td[contains(@class, "products")]//td[contains(@class, "mc_dimension_depth depth_3")]
    
  - name: diameter
    xpath: //td[contains(@class, "mc_inline_description") and contains(@class, "depth_2")] 
    regExp: '[Dd]iametro[^\d]*(\d+([.,]\d+)?)'
    regExpReplace: $1
  # - name: weight
  #   # couldn't find

  - name: weight_unit
    defaultValue: "kg"

  - name: weight_raw
    # couldn't find


  - name: materials
    xpath: //td[contains(@class, "mc_color_information depth_3")]//td[contains(@class, "description")]

  - name: colour
    xpath: //td[contains(@class, "mc_color_information depth_3")]//td[contains(@class, "description")]

  - name: product_details
    xpath: //td[contains(@class, "mc_features depth_2")] | //td[contains(@class, "mc_maintenance depth_2")] | //td[contains(@class, "mc_pdf_manuals")]//td
    # this mosaic is mostly images and advertising text, will add if requested but seems not needed
    # //td[contains(@class, "mc_box_mosaico depth_3")]//td[contains(@class, "value")] | 
  - name: currency
    xpath: //td[contains(@class, "minimum_price depth_4")]//td[contains(@class,"regular_price_excl_tax")]//td[contains(@class, "currency")]
  
  - name: listing_url
    xpath: //td[contains(@class, "canonical_url depth_3")]
    regExp: (.+)
    regExpReplace: https://www.mondoconv.es/$1

  

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[@data-el="ds-text"]

  - name: listing_id
    xpath: //*[@id="product-description"]//p[1]
    regExp: (?<=Réf.\s)(.*)

  - name: original_price 
    xpath: //*[contains(@class, 'text-primary font-regular ds-strike-price-l')] | //div[@data-el='product-page-content__prices'][not(.//*[contains(@class, 'text-primary font-regular ds-strike-price-l')])]//p
    regExp: (.*)(?=\s€)

  - name: offer_price 
    xpath: //*[contains(@class, 'text-primary-accent font-semibold ds-body-l')] 
    regExp: (.*)(?=\s€)

  - name: platform_category
    xpath: //*[@data-el='ds-breadcrumb']//a[position() = last() - 1]

  - name: product_variations
    xpath: //div[@data-el='ds-thumbnail-group']//a/@href
    regExp: (.+)
    regExpReplace: https://www.maisonsdumonde.com$1
    
  - name: stock_availability
    xpath: //li[1]//div[@data-el='product-service-card__body']//p
    regExp: 'Disponible'
    regExpReplace: 'yes'
    defaultValue: 'no'

  - name: main_image
    xpath: //*[@data-el="media-gallery"]//*[@data-el="ds-image"][1]//*/@src 
    downloadContent: 'text'

  - name: alternative_images
    xpath: //*[@data-el="media-gallery"]//*[@data-el="ds-image"][position() > 1]//*/@src

  - name: materials
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Matière')]//following-sibling::td

  - name: description
    xpath: //div[@data-el='product-description-block__rich-text']

  - name: user_reviews
    xpath: //*[@href="#customer-reviews"]/text()
    regExp: \d+

  - name: average_rating
    xpath: //section[@id='customer-reviews']/div[contains(@class,'container')]//div/p

  - name: height
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Hauteur')]//following-sibling::td
    regExp: \d\S*

  - name: depth
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Profondeur')]//following-sibling::td
    regExp: \d\S*

  - name: length
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Longueur')]//following-sibling::td
    regExp: \d\S*

  - name: diameter
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Diamètre')]//following-sibling::td
    regExp: \d\S*

  - name: colour
    xpath: //*[contains(@class, "container container-grid mt-6")]//*[contains(@data-el, "ds-row__label") and contains(., 'Couleur')]//following-sibling::td
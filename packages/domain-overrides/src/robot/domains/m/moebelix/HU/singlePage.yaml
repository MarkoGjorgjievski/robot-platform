singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[contains(@data-purpose, 'productName.heading')]
  - name: listing_id
    xpath: //div[contains(@data-purpose, 'product.productNumber')]
    regExp: (\d+)
  - name: offer_price
    xpath: (//div[contains(@data-purpose, 'product.price.old')]//ancestor::div[contains(@data-purpose, 'productDetailPage.data.rightContainer')]//div[contains(@data-purpose, 'product.price.current')])[1]
    regExp: (\d{1,3}(?:\s\d{3})*)
  - name: original_price
    xpath: (//*[contains(@data-purpose, 'product.price.old')]/s | //*[contains(@data-purpose, 'product.price.current')])[1]
    regExp: (\d{1,3}(?:\s\d{3})*)
  - name: platform_category
    xpath: (//nav[contains(@aria-label, 'breadcrumbs')]//li)[2]
  - name: product_variations
    xpath: //fieldset//input/@value
    regExp: '[^,]+'
  - name: stock_availability
    xpath: (//div[contains(@data-purpose, 'productDetailPage.data.rightContainer')]//button[contains(@data-purpose, 'checkout.addtocart')])[1]/@disabled
    defaultValue: 'yes'
  - name: main_image
    xpath: (//img[contains(@data-purpose, 'imageSlider.stageImage')])[1]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: (//img[contains(@data-purpose, 'imageSlider.stageImage')])[position() > 1]/@src
  - name: description
    xpath: //div[contains(@class, 'rah-static--height')]
  - name: pack_size
    xpath: //section//div[contains(@class, 'rah')]
    defaultValue: '1'

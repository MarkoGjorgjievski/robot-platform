singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //div[contains(@class,'page-price-title')]
   
  - name: 'listing_id'
    xpath: //div[contains(@class,'properties-list-item')]/span[contains(text(),'货号')]/following-sibling::span

  - name: 'offer_price'
    xpath: //div[contains(@class,'page-price-display')]//span[contains(@class,'display-price-value')]
    regExp: \d+
    defaultValue: null

  - name: 'original_price'
    xpath: //div[contains(@class,'page-price-display')]//span[contains(@class,'display-price-original')]
    regExp: \d+
    defaultValue: 'dummy'

  - name: 'platform_category' 
    xpath: ''

  - name: 'product_variations_data'
    xpath: //*[@id='requestData']
    defaultValue: null 

  - name: 'product_variations'
    defaultValue: 'dummy' 

  - name: 'stock_availability'
    xpath: "" 
    defaultValue: 'yes' 

  - name: 'main_image'
    xpath: //div[contains(@class,'swiper-slide-active')]//img/@src | (//div[contains(@class,'swiper-slide')]//img/@src )[1]
    downloadContent: 'text'    

  - name: 'alternative_images'
    xpath: //div[contains(@class,'swiper-slide')]//img/@src    

  - name: 'description'
    xpath: //div[contains(@class,'page-details-title')]

  - name: 'pack_size'
    xpath: ""  
    defaultValue: 1

  - name: 'user_reviews'
    xpath: "" 
    defaultValue: '0'   

  - name: 'average_rating'
    xpath: "" 
    defaultValue: null 

  - name: 'dimensions_unit'
    xpath: //div[contains(@class,'page-details-material') and contains(. ,'码')]
    regExp: /.{0,2}$/
    defaultValue: 'cm'  

  - name: 'dimensions_data'
    xpath: //div[contains(@class,'page-details-material') and contains(. ,'码')]

  - name: 'height' 
    defaultValue: 'dummy'  

  - name: 'width' 
    defaultValue: 'dummy'

  - name: 'length'  
    defaultValue: 'dummy'

  # - name: 'depth'
  #   xpath: "//td[contains(text(), 'Djup')]/following-sibling::td"
  # - name: 'diameter'
  #   xpath: //span[contains(@class,'js-product-variant-name')]

  - name: 'weight_unit'
    xpath: ""

  - name: 'weight_raw'
    xpath: ""

  - name: 'materials'
    xpath: //div[contains(@class,'properties-list-item')]/span[contains(text(),'素材')]/following-sibling::span
     
  - name: 'colour'
    xpath: //div[contains(@class,'page-details-material') and contains(. ,'色')]

  - name: 'product_details'
    xpath: //div[contains(@class,'page-details-material')]

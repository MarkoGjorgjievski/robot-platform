singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[contains(@class,"mfr-part-num")]
fields:
  - name: pdPage
    xpath: //*[contains(@class,"mfr-part-num")]//a[contains(@id,"lnkMfrPartNumber")]/@href
    regExp: (.+)
    regExpReplace: https://www.mouser.com$1
  
  - name: mfr_part_number
    xpath: //a[contains(@id,"lnkMfrPartNumber")]

  - name: mouser_part_num
    xpath: ancestor::tr//*[contains(@class,"mpart-number-lbl")]

  - name: manufacturer
    xpath: ancestor::tr//*[contains(@id,"lnkSupplierPage")]

  - name: description
    xpath: ancestor::tr//*[contains(@class,"desc-column")]
  
  - name: stock
    xpath: ancestor::tr//*[@column="Availability"]//span
  
  - name: price
    xpath: ancestor::tr//*[contains(@class,"PriceBreakQuantity") or contains(@class,"PriceBreakPrice")]/parent::tr
  
  - name: type
    xpath: ancestor::tr//*[@column="Type"]
  
  - name: package_case
    xpath: ancestor::tr//*[@column="Package/Case"]
    
  - name: shielding
    xpath: ancestor::tr//*[@column="Shielding"]
    
  - name: inductance
    xpath: ancestor::tr//*[@column="Inductance"]
    
  - name: tolerance
    xpath: ancestor::tr//*[@column="Tolerance"]
    
  - name: maximum_dc_current
    xpath: ancestor::tr//*[@column="MaximumDCCurrent"]
    
  - name: maximum_dc_resistance
    xpath: ancestor::tr//*[@column="MaximumDCResistance"]
    
  - name: saturation_current
    xpath: ancestor::tr//*[@column="SaturationCurrent"]
    
  - name: minimum_operating_temperature
    xpath: ancestor::tr//*[@column="MinimumOperatingTemperature"]
    
  - name: maximum_operating_temperature
    xpath: ancestor::tr//*[@column="MaximumOperatingTemperature"]
    
  - name: q_minimum
    xpath: ancestor::tr//*[@column="QMinimum"]
    
  - name: self_resonant_frequency
    xpath: ancestor::tr//*[@column="SelfResonantFrequency"]
    
  - name: termination_style
    xpath: ancestor::tr//*[@column="Termination"]
    
  - name: length
    xpath: ancestor::tr//*[@column="Length"]

  - name: width
    xpath: ancestor::tr//*[@column="Width"]
    
  - name: height
    xpath: ancestor::tr//*[@column="Height"]
    
  - name: diameter
    xpath: ancestor::tr//*[@column="Diameter"]
    
  - name: core_material
    xpath: ancestor::tr//*[@column="CoreMaterial"]
    
  - name: qualification
    xpath: ancestor::tr//*[@column="Qualification"]
    
  - name: series
    xpath: ancestor::tr//*[@column="Series"]
    
  - name: package_type
    xpath: ancestor::tr//*[@column="Packaging"]
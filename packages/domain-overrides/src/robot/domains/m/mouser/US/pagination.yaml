singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: mfr_part_number
    xpath: //*[@id="spnManufacturerPartNumber"]
  - name: part_number
    xpath: //*[contains(@id,"pdpMainContentDiv")]//*[contains(@id,"divMouserPartNum")]
  - name: manufacturer
    xpath: //*[contains(@id,"lnkManufacturerName")]
  - name: description
    xpath: //*[contains(@id,"spnDescription")]
  - name: stock
    xpath: //*[contains(@class,"pdp-pricing-header")]
  - name: price
    xpath: //*[contains(@id,"pricebreakqty") or contains(@headers, "unitpricecolhdr")]
  - name: type
    xpath: //*[contains(@id,"pdp_specs_SpecList[3]")]//*[contains(@class,"attr-value-col")]
  - name: package_case
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Package/Case:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: shielding
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Shielding:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: inductance
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Inductance:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: tolerance
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Tolerance:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: maximum_dc_current
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Maximum DC Current:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: maximum_dc_resistance
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Maximum DC Resistance:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: saturation_current
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Saturation Current:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: minimum_operating_temperature
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Minimum Operating Temperature:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: operating_temperature
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Maximum Operating Temperature:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: q_minimum
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Q Minimum:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: self_resonant_frequency
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Self Resonant Frequency:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: termination_style
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Termination:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: length
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Length:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: width
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Width:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: height
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Height:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: diameter
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Diameter:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: core_material
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Core Material:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: qualification
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Qualification:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: series
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Series:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]
  - name: package_type
    xpath: //*[contains(@id,"pdp_specs_SpecList")]//*[contains(text(),"Packaging:")]/parent::td/following-sibling::td[contains(@class, "attr-value")]

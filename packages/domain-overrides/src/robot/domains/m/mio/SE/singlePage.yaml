singleRecord: true
fields:
  - name: main_image
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.media[0].url
    downloadContent: 'text'

  - name: alternative_images
    xpath: (//div[contains(@class, "product__Left")])[2]//img/@src

  - name: colour
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.richSpecifications.Specifikationer.Detaljer[] | select(.key== "colorDescription")

  - name: dimensions_values
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.richSpecifications.Specifikationer

  - name: description
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.description.long

  - name: listing_id
    xpath: //*[@id="page_json_data"]
    jq: ".cells.main.data.product.m3Id"

  - name: original_price
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.price.originalPrice
    defaultValue: "0"

  - name: product_title
    xpath: //*[@id="page_json_data"]
    jq: .data.meta.title

  - name: json
    xpath: //*[@id="page_json_data"]
    jq: '.'

  - name: offer_price
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.price.price
    defaultValue: "0"
  
  - name: platform_category_from_breadcrumbs
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.breadcrumbs[0].name

  - name: platform_category_from_product_type
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.productType

  - name: platform_category
    xpath: //*[@id="page_json_data"]

  - name: product_variations
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.adjacent[0][1:][].id

  - name: stock_availability
    defaultValue: "yes"

  - name: pack_size
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.description.short

  - name: materials
    xpath:  //*[@id="page_json_data"]
    jq: .cells.main.data.product.richSpecifications.Specifikationer

  - name: product_details
    xpath: //*[@id="page_json_data"]
    jq: .cells.main.data.product.richSpecifications.Specifikationer
    defaultValue: ""

  # no rating
  - name: average_rating
    defaultValue: null

  # no reviews
  - name: user_reviews
    defaultValue: null

  - name: dimensions_unit
    defaultValue: "cm"

  - name: weight_unit
    defaultValue: "kg"
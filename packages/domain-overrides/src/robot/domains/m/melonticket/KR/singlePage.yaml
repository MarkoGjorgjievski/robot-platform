singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //li[contains(@class, "item_date")]/button
fields:
  - name: eventName
    xpath: ancestor::html//div[contains(@class, "box_consert_txt")]/p[contains(@class, "tit")]
  - name: venueName
    xpath: ancestor::html//dt[contains(text(), "Venue")]/following-sibling::dd[1]
  # - name: eventTime
  #   xpath: 
  - name: isPublicPurchase
    defaultValue: '1'
  - name: eventNote
    xpath: ancestor::html//dt[contains(text(), "Rating")]/following-sibling::dd[1]
  - name: isTBA
    defaultValue: '0'
  - name: eventURL
    xpath: ancestor::html//meta[@property="og:url"]/@content

# api data
  - name: prodId
    xpath: parent::li/@data-prodid
  - name: perfDay
    xpath: parent::li/@data-perfday
  - name: pocCode
    xpath: parent::li/@data-poccode
  - name: perfTypeCode
    xpath: parent::li/@data-perftypecode
  - name: sellTypeCode
    xpath: parent::li/@data-selltypecode
  - name: seatCntDisplayYn
    xpath: parent::li/@data-seatcntdisplayyn
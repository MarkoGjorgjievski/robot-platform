singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //ul//li[last()]//span[@itemprop='name']
  - name: listing_id
    xpath: //div[contains(text(),'Artikelnummer :')]/text()
    regExp: \d+
  - name: offer_price
    xpath: //div[contains(@class,'articleInformation__price')]//div[contains(@class,'articlePricesNew__price--discount')]//span//text()
  - name: original_price
    xpath: //div[contains(@class,'articleInformation__price')]/div/div[1]/*[1]//text()
  - name: platform_category
    xpath: //ul[contains(@class,"breadcrumb__listContainer")]/li[last()-1]/a/span//text()
  - name: product_variations
    xpath: //div[contains(@class,'articleInformation')]//*[@data-target][not(@data-target='_self')]/@data-target
  - name: stock_availability
    xpath: //div[@id='additional-page-marker']/@data-additional-page-marker
    jq: '.deliveryTimeData.stockAvailability'
    defaultValue: 'true'
  - name: main_image
    xpath: //div[contains(@class,'articleImageForADS__image')][@data-image-index='0']//a//@href
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class,'articleImageForADS__image')][@data-image-index!='0']//a//@href
  - name: description
    xpath: //div[contains(@class, 'articleDescriptionV2__description')]//text()
  - name: pack_size
    xpath: //div[contains(text(),'Anzahl Packstücke:')]//..//div[contains(@class,'articleFeature__subElementValue')]
  - name: user_reviews
    xpath: //div[contains(@class,'averageRating__numberOfRatings')]//text()
    regExp: \d+
    defaultValue: '0'
  - name: average_rating
    xpath: //div[contains(@class,'reviews__averageRating')]//div[contains(@class,'container')]//div[contains(@class,'averageRating__number')]//text()
    defaultValue: '0'
  - name: dimensions_unit
    xpath: //div[contains(text(), 'Gesamtbreite:')]//..//div[contains(@class, 'articleFeature__subElementValue')]//text()
    regExp: ([a-z]+)
    defaultValue: 'cm'
  - name: height
    xpath: //div[contains(text(), 'Gesamthöhe:')]//..//div[contains(@class, 'articleFeature__subElementValue')]//text() | //div[contains(@class,'bundleItem')]//li[contains(@class,'bulletList')]//span[contains(text(),'Gesamthöhe')]
    regExp: \d+\,*\d*
  - name: diameter
    xpath: //div[contains(text(), 'Durchmesser:')]//..//div[contains(@class, 'articleFeature__subElementValue')]//text() | //div[contains(@class,'bundleItem')]//li[contains(@class,'bulletList')]//span[contains(text(),'Durchmesser')]
    regExp: \d+\,*\d*
  - name: width
    xpath: //div[contains(text(), 'Gesamtbreite:')]//..//div[contains(@class, 'articleFeature__subElementValue')]//text() |  //div[contains(@class,'bundleItem')]//li[contains(@class,'bulletList')]//span[contains(text(),'Gesamtbreite')]
    regExp: \d+\,*\d*
  - name: depth
    xpath: //div[contains(text(), 'Gesamttiefe:')]//..//div[contains(@class, 'articleFeature__subElementValue')]//text() |  //div[contains(@class,'bundleItem')]//li[contains(@class,'bulletList')]//span[contains(text(),'Gesamttiefe')]
    regExp: \d+\,*\d*
  - name: length
    xpath: //div[contains(text(), 'Gesamtlänge:')]//..//div[contains(@class, 'articleFeature__subElementValue')]//text() |  //div[contains(@class,'bundleItem')]//li[contains(@class,'bulletList')]//span[contains(text(),'Gesamtlänge:')]
    regExp: \d+\,*\d*
  - name: weight_unit
    xpath: //div[contains(text(), 'Packstück 1:')]//..//div[contains(text(),'Gewicht:')]
    regExp: 'Gewicht: \d+\,*\d* ([a-z]+)'
    regExpReplace: $1
  - name: weight_raw
    xpath: //div[contains(text(),'Gewicht:')]
    regExp: 'Gewicht: (\d+\,*\d*)'
    regExpReplace: $1
  - name: materials
    xpath: //div[contains(text(),'Material')][contains(@class,'articleFeature__subElement')]//..//*[position()>1]//text()
  - name: colour
    xpath: //div[contains(text(),'Farbe')][contains(@class,'articleFeature__subElement')]//../div[2]//text()
  - name: product_details
    xpath: //div[contains(text(), 'Ausstattung') or contains(text(), 'Hinweise')][contains(@class,'headline')]//..//div[contains(@class,'articleFeature__element')]
    # jq: jq | filter
    # regExp: (reg)*p
    # regExpReplace: website$1$2
    # defaultValue: hardcoded value if nothing matches
    # manualSelector: css#selector
    # type: NUMBER | BOOLEAN | STRING (default if omitted)

singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class, "review-card")]
fields:
  - name: review_id
    xpath: .//a[contains(@class, "rc__open-review hp-btn-link")]/@href

  - name: review_title
    xpath: .//h1
  - name: review_body
    xpath: .//div[contains(@class, "rc__body")]
  - name: username
    xpath: .//a[contains(@href, "/profile")][not(./div)]
  - name: review_date
    xpath: .//div[contains(@class, "star-new")]/parent::div/text()
  - name: rating
    xpath: //div[contains(@class, "star-new")]/ul/li[1]/@class
    regExp: '\d+'
  - name: location #missing

  - name: helpfulness_count #missing
  - name: tags 
    xpath: //span[contains(@class, "pill")]
  
  # might require extra pagination stage
  - name: response_text
  - name: response_date 

  - name: trustscore # for trustpilot only
  - name: images #missing

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: (//div[contains(@class, 'prod_title_container')]//h2[contains(@class, 'prod_title')])[1]
  - name: listing_id
    xpath: //p[contains(@class, 'product-single__sku')]
    regExp: '(\d+)'
  - name: offer_price
    xpath: //div[contains(@class, 'product__price-container')]//span[2]/preceding-sibling::span
  - name: original_price
    xpath: (//div[contains(@class, 'product__price-container')]//span[2]) | //div[contains(@class, 'product__price-container')]//span[contains(@id, 'ProductPrice')]
  - name: platform_category
    xpath: //script[contains(text(), "buddhaCrosssell.collectionHandle=")]
#  - name: product_variations
#    xpath: (//div[@class='generalOverlay__content'])[1]//button//@data-target | (//div[contains(@class, 'articleInformation__configure--allArticleTiles ')])[1]/img/@data-target
  #    defaultValue: 'no product_variations on this specific product'
  - name: stock_availability
    xpath: //button[@id='AddToCartSold' and contains(@style, 'display:none')]
    defaultValue: 'no'
  - name: main_image
    xpath: //div[contains(@class, 'product-single__media')]//img[contains(@class, 'ProductImg-product-template')]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, 'prod_thumbs_slider')]//img[contains(@class, 'ProductImg-product')]/@src
  - name: description
    xpath: //div[contains(@class, 'prod_des_container')]
#  - name: pack_size
#    xpath: (//div[contains(@class, 'articleDescriptionV2__featuresRight')])[2]/div/div[3]//div[contains(@class, 'articleFeature__subElementValue')]
#  - name: user_reviews
#    xpath: //div[contains(@class, 'averageRating__numberOfRatings')]
#    #    defaultValue: 'no user_reviews on this specific product'
#    regExp: '(\d+)'
#  - name: average_rating
#    xpath: (//div[contains(@class, 'averageRating__number')])[1]
#    regExp: '^(\d+(\.\d+)?)'
  #    defaultValue: 'no average_rating on this specific product'
  #  - name: dimensions
  #    xpath:
  #    defaultValue: 'in sub fields'
  - name: dimensions_unit
    xpath: //span[contains(@class, 'f_s_value')]
    regExp: '(\D+)$'
  - name: height
    xpath: //span[contains(@class, 'f_con')]//*[contains(text(), 'Altezza')]/parent::*//span[contains(@class, 'f_s_value')]
    regExp: '(\d+)'
  - name: width
    xpath: //span[contains(@class, 'f_con')]//*[contains(text(), 'Larghezza ')]/parent::*//span[contains(@class, 'f_s_value')]
    regExp: '(\d+)'
  - name: length
    xpath: //span[contains(@class, 'f_con')]//*[contains(text(), 'Lunghezza ')]/parent::*//span[contains(@class, 'f_s_value')]
    regExp: '(\d+)'
  - name: diameter
    xpath: //div[contains(@class, 'prod_des_container')] | (//h3[contains(text(), 'diametro')])[1]
#    regExp: 'ø(\d+)cm'
  #  - name: weight
  #    xpath:
  #    defaultValue: 'weight is not set'
#  - name: weight_unit
#    xpath: (//div[contains(@class, 'prod_title_container')]//h2[contains(@class, 'prod_title')])[1]
#    regExp: '(\D+)$'
#  - name: weight_raw
#    xpath: (//div[contains(@class, 'prod_title_container')]//h2[contains(@class, 'prod_title')])[1]
#    regExp: '(\d+)\s*(kg|g|lbs|oz)'
  - name: materials
    xpath: //div[@class='prod_des_container']/text()[contains(., 'Materiale')]
#  - name: colour
#    xpath: (//h3[contains(@class, 'prod_model')])[1] | (//div[@class='description']/text()[contains(., 'Colore:')])[1]
  - name: colour
    xpath: (//div[@class="prod_des_container"]/text()[contains(., 'Colore')])[1] | (//div[@class="prod_des_container"])[not(//div[@class="prod_des_container"]/text()[contains(., 'Colore')])]
  - name: product_details
    xpath: //div[contains(@class, 'prod_feature_container')]//span[contains(@class, 'f_con')]


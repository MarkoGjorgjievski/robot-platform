singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:

  - name: original_price
    defaultValue: '0'
    xpath: //*[contains(@class, 'hdca-product__description-pricing-price-value')]
    regExp: \d\S*

  - name: offer_price
    xpath: //*[contains(@class, 'hdca-product__description-pricing-was')]
    regExp: \d\S*

  - name: product_title
    xpath: //*[contains(@class, 'hdca-product__description-title-product-name')] | //h1[@itemprop="name"]

  - name: listing_id
    xpath: //*[contains(@class, 'acl-breadcrumbs__item') and @itemscope ='false'] | //div[@id="gallery-partner-productID"]
    regExp: '\d*'

  - name: platform_category
    xpath: //*[contains(@class, 'acl-breadcrumbs__item')][last() - 1]//a

  - name: main_image
    xpath: //*[@itemprop="image"]/@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //*[contains(@class,'hdca-product__gallery-carousel')]//ngu-tile//img/@src

  - name: average_rating
    xpath: //*[contains(@class, 'bv_avgRating_component_container notranslate')]

  - name: user_reviews
    xpath: //*[contains(@class, 'bv_numReviews_component_container')]//*[contains(@itemprop, 'reviewCount')]

  - name: description
    xpath: //*[contains(@evtperfname, 'product-overview-component')]

  - name: colour
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Colour') and contains(.,'Swatch')]//following-sibling::dd[1]

  - name: stock_availability
    xpath: boolean(//*[contains(@data-qa, 'wdio-pip-product-atc')])

  - name: product_variations
    xpath: //*[contains(@class, 'acl-swatch-group__swatches')]//*[not(contains(@class, 'active'))]//a/@href
    regExp: (.*)
    regExpReplace: https://www.homedepot.ca$1

  - name: materials
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Material')]//following-sibling::dd[1][not(contains(text(), 'Not Applicable') or contains(text(), 'Holder Not Included'))]

  - name: product_details
    xpath: //*[contains(@class, 'acl-pt--medium acl-pb--large') and not(contains(@class, 'small'))][last()]

  - name: weight_raw
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Assembled Weight')]//following-sibling::dd[1]
    regExp: ([\d.]+)
    regExpReplace: $1
    

  - name: weight_unit
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Assembled Weight')]
    regExp: '(?<=\(in\s)(.*)(?=\))'

  - name: dimensions_unit
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Assembled Depth')]
    regExp: '(?<=\(in\s)(.*)(?=\))'

  - name: depth
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Assembled Depth')]//following-sibling::dd[1]
    regExp: ([\d.]+)
    regExpReplace: $1

  - name: height
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Assembled Height')]//following-sibling::dd[1]
    regExp: ([\d.]+)
    regExpReplace: $1
    

  - name: width
    xpath: //*[contains(@class, 'acl-title acl-weight--bold')][contains(.,'Assembled Width')]//following-sibling::dd[1]
    regExp: ([\d.]+)
    regExpReplace: $1
    

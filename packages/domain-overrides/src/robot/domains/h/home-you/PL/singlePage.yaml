singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
 
  - name: product_title
    xpath: //*[contains(@data-cy, "product_name")]|//*[contains(@data-cy, "product_grouped_name")]
  
  - name: listing_id
    # sometimes doesn't load
    # xpath: //*[contains(@data-cy, "product_sku")]
    xpath: //meta[@property="product:retailer_part_no"]/@content
  
  - name: original_price
    defaultValue: '0'
    xpath: //meta[contains(@property, "product:original_price:amount")]/@content
  
  - name: offer_price
    xpath: //meta[contains(@property, "product:sale_price:amount")]/@content
  
  - name: platform_category
    xpath: //nav[contains(@class, "breadcrumbs")]//ul/li[last()-1]/a
  
  - name: product_variations
    xpath: //div[contains(@class, "base-carousel__carousel")]/div[contains(@data-cy, "product_")]//h4/a/@href
    regExp: (.+)
    regExpReplace: https://home-you$1

  - name: stock_availability
    defaultValue: '0'
    xpath: //script[@id="event-data"]
    jq: .[] | select(.event=="productDetail").ecommerce.detail.products[0].inStock
    
  - name: main_image
    xpath: //div[contains(@data-cy, "product_gallery")]/div[contains(@class, "relative")]//img[1]/@src | //div[contains(@data-cy, "product_gallery")]/img[1]/@src
    downloadContent: 'text'    
  
  - name: alternative_images
    xpath: //div[contains(@data-cy, "product_gallery")]/div[contains(@class, "relative")]//img/@src

  - name: description
    xpath: //div[contains(text(), "opis produktu:")]/following-sibling::div/div[1]
 
  - name: pack_size
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "liczba sztuk")]/following-sibling::*
    regExp: ([.\d]+)
    regExpReplace: $1

  # NOT FOUND
  - name: user_reviews
    # xpath: 
  # NOT FOUND
  - name: average_rating
    # xpath: 

  # - name: dimensions_unit
  #   defaultValue: "cm"

  - name: volume
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "pojemność")]/following-sibling::* 
    regExp: (\d+([,.]\d+)?)
    regExpReplace: $1


  - name: height
    defaultValue: 'null'
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "wysokość")]/following-sibling::*
    regExp: (\d+([,.]\d+)?)
    regExpReplace: $1

  - name: width
    defaultValue: 'null'
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "szerokość")]/following-sibling::*
    regExp: (\d+([,.]\d+)?)
    regExpReplace: $1


  - name: length
    defaultValue: 'null'
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "długość")]/following-sibling::* 
    regExp: (\d+([,.]\d+)?)
    regExpReplace: $1

  - name: depth
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "głębokość")]/following-sibling::*
    regExp: (\d+([,.]\d+)?)
    regExpReplace: $1


  - name: diameter
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "średnica")]/following-sibling::*
    regExp: (\d+([,.]\d+)?)
    regExpReplace: $1

  - name: dimensions_raw
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "rozmiar")]/following-sibling::* 

  # - name: weight_unit
  #   defaultValue: "kg"
  
  # NOT FOUND
  - name: weight_raw
    # xpath: 

  - name: materials
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "materiał")]/following-sibling::*

  - name: colour
    xpath: //section[contains(@aria-labelledby, "details")]//*[contains(@class, "break-words") and contains(text(), "kolor")]/following-sibling::*

  - name: product_details
    xpath: //section[contains(@aria-labelledby, "details")]/div/ul/li[1]


singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: //div[contains(@class,'homeco_content_header')]
fields:
  - name: Agent
    xpath: ancestor::html//div[contains(@class,'agent-details')]//td[contains(text(),'Contact')]/following-sibling::td/a/@href
    regExp: agent=(.+)
    regExpReplace: $1
  
  - name: Name
    xpath: ancestor::html//td[contains(text(),'Agent')]/following-sibling::td
    regExp: ^Contact\s(.+)
    regExpReplace: $1

  - name: rawName
    xpath: ancestor::html//td[contains(text(),'Agent')]/following-sibling::td

  - name: City
    xpath: ancestor::html//h4[contains(@class,'blue_header')]/a
    regExp: ^(.*?)\s*Property$
    regExpReplace: $1

  - name: rawCity
    xpath: ancestor::html//h4[contains(@class,'blue_header')]/a
  
  - name: Address
    xpath: ancestor::html//td[contains(text(),'Address:')]/following-sibling::td
  
  - name: LeadingWebsiteAdvertising
    xpath: ancestor::html//h2[contains(text(),'Online Advertising Profile')]/following-sibling::ul[1]/li
  
  - name: OtherListings
    xpath: ancestor::html//p[contains(text(),'Property listings')]/following-sibling::ul[1]/li

  - name: URL
    xpath: ancestor::html//div[contains(@class,'agent-details')]//td[contains(text(),'Contact')]/following-sibling::td/a/@href
    regExp: agent=(.+)
    regExpReplace: https://www.home.co.uk/search/agents/details.htm?agent=$1

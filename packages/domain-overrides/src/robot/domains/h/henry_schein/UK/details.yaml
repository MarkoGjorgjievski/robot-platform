singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: category
    xpath: //div[contains(@class,  "breadcrumb")]//div[@id="divCatName"]

  - name: code
    xpath: //script[@type="application/ld+json"]
    jq: .sku
  - name: description
    xpath: //script[@type="application/ld+json"]
    jq: .description

  - name: image
    xpath: //script[@type="application/ld+json"]
    jq: .image
  
  - name: MPN
    xpath: //script[@type="application/ld+json"]
    jq: .mpn

  - name: MPNBackup
  - name: name
    xpath: //script[@type="application/ld+json"]
    jq: .name

  # AUTOMATIC
  # - name: sourceURL

  - name: uom
    defaultValue: empty

  - name: uomWithUnits
    xpath: //li/h2[contains(@class, "product-title")]/text()
    regExp: \b([\d./]+)\s*(pk|[mc]?l|[mc]m|L|sheets?|$|"|'|[Ii]nch|[km]?g)(\s|$)
    regExpReplace: '$1$2'

  - name: uomSetsAndKits
    xpath: //li/h2[contains(@class, "product-title")]/text()
    regExp: (Intro|Bottle|Starter|Preparation|Prep|A.B|)\s+([Kk]it|[Ss]et|Refill|Vial|Pack)(?! of)

  - name: uomSetOf
    xpath: //li/h2[contains(@class, "product-title")]/text()
    regExp: '[Ss]et of \d+'

# login required

  - name: availability
    xpath: //section[contains(@class, "product-desc")]//div[@data-inventory-item-code]/following-sibling::p
  
  - name: price
    xpath: //li[.//div[@data-inventory-item-code]][not(@class)]//span[contains(@class, "price-mod")]
    regExp: £([\d.]+)
    regExpReplace: $1
  
  - name: specialPrice
    xpath: //li[.//div[@data-inventory-item-code]][not(@class)]//span[contains(@class, "amount")]
    regExp: £([\d.]+)
    regExpReplace: $1

  
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: platform_category
    xpath: //*[contains(@data-hb-namespace, "breadcrumb")]//*//*/li[last()]//a

  - name: product_details
    xpath: //*[@id="attribute"]//li

  - name: product_title
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").title else .[]|select(.__typename=="Product").title end

  - name: listing_id
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").abstractProductId else .[]|select(.__typename=="Product").abstractProductId end
 
  - name: original_price
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").defaultPrice.price else .[]|select(.__typename=="Product").defaultPrice.price end
    defaultValue: 0
 
  - name: stock_availability
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").offerDV.canBeAddedToCart else .[]|select(.__typename=="Product").offerDV.canBeAddedToCart end

  - name: main_image
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").mainImage.url else .[]|select(.__typename=="Product").mainImage.url end
    downloadContent: 'text'

  - name: alternative_images
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").mediaList[].url else .[]|select(.__typename=="Product").mediaList[].url end

  - name: description
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").description else .[]|select(.__typename=="Product").description end
 
  - name: materials
    xpath: //*[contains(@id,"scriptDate")]
    jq: if .[]|.__typename == "Merchant" then .[]|with_entries( select(.key|contains("product"))).[]|select(.__typename=="Product").attributeList[]|select((.key|contains("Materiál")), (.key|contains("materiál"))).value else .[]|select(.__typename=="Product").attributeList[]|select((.key|contains("Materiál")), (.key|contains("materiál"))).value end
 

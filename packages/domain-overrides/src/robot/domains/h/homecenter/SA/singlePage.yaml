singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[@id="product-details-name"]
 
  - name: listing_id
    xpath: //*[@id="product-actions-form"]//*[contains(@name, "baseProduct")]//@value
 
  - name: offer_price
    xpath: //*[contains(@class, "product-price") and not(contains(@class, 'float'))]//*[contains(@id, "products-details-price-old")]
    regExp: \d+
 
  - name: original_price
    xpath: //*[contains(@class, "product-price") and not(contains(@class, 'float'))]//*[contains(@id, "products-details-price-current")]
    regExp: \d+
 
  - name: platform_category
    xpath: //*[contains(@id, 'breadcrumb') and contains(@class, 'active')]
 
  - name: stock_availability
    xpath: boolean(//*[@id="product-stock" and contains(text(), 'In Stock')])

  - name: main_image
    xpath: //*[@id="gallery-wrap"]//div[contains(@class, 'active')]//img//@src
    downloadContent: 'text'

  - name: alternative_images
    xpath: //*[@id="gallery-wrap"]//div[not(contains(@class, 'active'))]//img//@src

  - name: description
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@id, "product-summary")] | (//div[contains(@id, "product-overview")]//ul)[1]
 
  - name: materials
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-group-desc-table')]//*[contains(text(),'Material') or contains(text(),'material')]//following-sibling::div
 
  - name: colour
    xpath: //*[@id="product-sets"]//*[contains(text(), 'Colour:') and contains(@class, "title")]//* | //*[@id="products-list-swatch"]//*[contains(@class, 'jcf-radio') and contains(@class, 'unchecked')]//*//@data-product-coloren
 
  - name: weight_raw
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-v2')][contains(., 'Weight')][not(contains(., 'GSM'))]//*[not(contains(text(), 'Weight'))]
    regExp: \d\S*

  - name: weight_unit
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-v2')][contains(., 'Weight')][not(contains(., 'GSM'))]//*[contains(text(), 'Weight')]
    regExp: (?<=\()(.*)(?=\))
 
  - name: height
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-v2')][contains(., 'Height')]//*[not(contains(text(), 'Height'))]
    regExp: \d\S*
 
  - name: width
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-v2')][contains(., 'Width')]//*[not(contains(text(), 'Width'))]
    regExp: \d\S*

  - name: depth
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-v2')][contains(., 'Depth')]//*[not(contains(text(), 'Depth'))]
    regExp: \d\S*
 
  - name: length
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-v2')][contains(., 'Length')]//*[not(contains(text(), 'Length'))]
    regExp: \d\S*
 
  - name: user_reviews
    xpath: //*[contains(@class, 'name-review-container')]//*[@id="product-star-link"]
 
  - name: average_rating
    xpath: //*[contains(@id, "review-section-heading")]//*[@id="review-section-full-total-value"]
 
  - name: product_variations
    xpath: //*[contains(@class, "desktop-ext-size-dropdown")]//li//@value

  - name: productUrl
    xpath: //*[@rel="canonical"]//@href

  - name: pack_size
    xpath: //*[contains(@id, "product-details-col-2")]//*[contains(@class, 'attribute-group-desc-table')]//*[contains(text(),'Unit Components') or contains(text(),'material')]//following-sibling::div
    regExp: \d+

  - name: pack_dimensions
    xpath: //*[contains(@id, "product-details-col-2")]//*[@id="setproduct-dimension-list"]//li/text()

  - name: product_details
    xpath: (//div[contains(@id, 'product-overview-v2')])[1]

  - name: diameter
    xpath: (//div[contains(@class, 'attribute-group-desc-horizontal1')]//p[contains(@class, 'attribute-v2-name') and contains(text(), 'Diameter')]/following-sibling::p[contains(@class, 'attribute-v2-value')])[1]
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //div[@data-testid="productNameComponent"]/div
  - name: listing_id
    xpath: //link[@rel="canonical"]/@href
  - name: offer_price
    defaultValue: '0'
  - name: original_price
    xpath: //script[@id="__NEXT_DATA__"]
  - name: platform_category
    xpath: 
  - name: product_vars
    xpath: //script[@id="__NEXT_DATA__"]
  - name: stock_availability
    xpath: //script[@type="application/ld+json"][1]
    jq: 'if select(.offers.availability == "https://schema.org/InStock") then "yes" else "no" end'
  - name: main_image
    xpath: //script[@type="application/ld+json"][1]
    downloadContent: 'text'
    jq: '.image'
  - name: alternative_images
    xpath: //div[@data-testid="imageViewerThumbs"]//div[contains(@class, "slick-slide")]/div/div/div/img[@data-nimg="true"]/@src
  - name: description
    xpath: //h4/span[contains(text(), "Product Information")]/ancestor::h4/following-sibling::p
  - name: pack_size
    defaultValue: '1'
  - name: user_reviews
    defaultValue: '0'
  - name: average_rating
    defaultValue: '0'
  - name: dimensions
    xpath:
  - name:     dimensions_unit
    xpath:  //div[@data-expanded="panel-dimensions"]//div[@data-index="0"]//ul/li[1]/span[3]
    regExp: '[a-z]+'
  - name:     height
    xpath: //div[@data-expanded="panel-dimensions"]//div[@data-index="0"]//ul/li[1]/span[3]
    regExp: '\d+'
  - name:     diameter
    xpath:
  - name:     depth
    xpath: //div[@data-expanded="panel-dimensions"]//div[@data-index="0"]//ul/li[3]/span[3]
    regExp: '\d+'
  - name:     width
    xpath: //div[@data-expanded="panel-dimensions"]//div[@data-index="0"]//ul/li[2]/span[3]
    regExp: '\d+'
  - name:     length
    xpath:
  - name: weight
    xpath:
  - name:     weight_unit
    xpath:
  - name:     weight_raw
    xpath:
  - name: materials
    xpath: //h4[@data-testid="chooseMaterial"]/span | //ul[@data-testid="materialList"]/li[1]//span[1]
  - name: colour
    xpath: //h4[@data-testid="colourSelected"]/span
  - name: product_details
    xpath: //ul[@data-testid="product-description-list"]/li/p
  - name: currency
    xpath: //script[@type="application/ld+json"][1]
    jq: '.offers.priceCurrency'
  - name: country
    xpath:
  - name: platform_id
    xpath:
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: price
    xpath: //div[contains(@class, "product-info-price")]//span[@data-price-type="oldPrice"]/span | //div[contains(@class, "product-info-price")][not(.//span[@data-price-type="oldPrice"])]//span[@data-price-type="finalPrice"]/span
    regExp: \d+\,?\.?\d*
  - name: code
    xpath: //div[contains(@class, "product-info-stock-sku")]/div[contains(@class, "sku")]//div[contains(@class, "value")]
  - name: name
    xpath: //h1/span[@data-ui-id="page-title-wrapper"]
  - name: category
    xpath: //ul[contains(@class, "viewcatlist")]/li/a[1]
  - name: specialPrice
    xpath: //div[contains(@class, "product-info-price")]//span[contains(@class, "special-price")]//span[@data-price-type="finalPrice"]/span
    regExp: \d+\,?\.?\d*
  - name: uom
    xpath: //h3[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contents') or contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contains')]/following-sibling::ul/li[p]/p/text() | //h3[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contents') or contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contains')]/following-sibling::ul/li[not(.//p)]/text() | //h3[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contents') or contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contains')]/following-sibling::ul/li[span]/span/text() | //div[@id="description"][not(.//h3[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contents') or contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contains')]/following-sibling::ul)]//div[contains(@class, "product attribute description")]/div/div[last()]//ul/li/text() | //div[contains(@class, "product attribute description")]/div[not(.//*)]/text() | //h3[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contents') or contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'contains')]/following-sibling::p
  - name: availability
    xpath: //div[@title="Availability"]/span
  - name: sourceURL
    xpath: //link[@rel="canonical"]/@href
  - name: image
    xpath: //div[@id="mtImageContainer"]/div/a/@href
  - name: image_alt
    xpath: //div[@id="mtImageContainer"]//figure/img/@alt
  - name: description
    xpath: //div[contains(@class, "product attribute overview")]/div/text() | //div[contains(@class, "product attribute overview")]/div/p/text()

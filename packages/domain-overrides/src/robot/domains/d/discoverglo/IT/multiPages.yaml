singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@id="productListingContainer"]//div[@class="bat-productlistings-card"] | //td[@class="items depth_4"]/table/tbody/tr
fields: 
  - name: brandText
    singleValue: false
    defaultValue: 'Glo'
  - name: name
    singleValue: false
    xpath: //div[@class="bat-productlistings-card-name"]//a
  - name: productUrl
    singleValue: false
    xpath: //div[@class="bat-productlistings-card-name"]//a/@href
    regExp: (.+)
    regExpReplace: https://www.discoverglo.com$1
  - name: reviewCount
    singleValue: false
    xpath: //div[contains(@class,"price-rating")]//span[contains(@class,'number-review')]
  - name: sku
    singleValue: false
    xpath: '@data-sku'
  - name: reviewDate
    # xpath: //div[contains(@class,"review-container")]//span[@class="review-by"]|//tr//td[@class="created_at depth_5"]
    xpath: //td[@class="created_at depth_5"]
    regExp: (\d+-\d+-\d+)
    regExpReplace: $1
  - name: url
    xpath: ancestor::html//*[@id="__input"]
    regExp: (productUrl":")(.*)(","category":)
    regExpReplace: $2
  - name: reviewRating
    # xpath: //div[contains(@class,"review-container")]//div[@class="rating-upper"]/@rating|//tr//td[@class="value depth_6"]
    xpath: //td[@class="value depth_6"]
  - name: reviewText
    # xpath: //div[contains(@class,"review-container")]//p[@class="text"]|//tr//td[@class="text depth_5"]
    xpath: td[@class='text depth_5']
  - name: reviewTitle
    # xpath: //div[contains(@class,"review-container")]//h3[contains(@class, "title")]|//tr//td[@class="summary depth_5"]
    xpath: //td[@class="summary depth_5"]
  - name: sourceUrl
    xpath: ancestor::html//*[@id="__input"]
    regExp: (productUrl":")(.*)(","category":)
    regExpReplace: $2
  - name: pageTitle
    # xpath: //div[contains(@class,"review-container")]//div[@class="rating-upper"]/@page-title|//tr//td[@class="name depth_3"]
    xpath: ancestor::html//td[@class="name depth_3"]

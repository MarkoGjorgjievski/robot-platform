singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: image
    singleValue: true
    # xpath: //div[@data-active="true"]/@href
    xpath: //div[contains(@class, "large")]/img/@src
  - name: brandText
    singleValue: true
    xpath: //span[@data-ui-id="page-title-wrapper"]/@brand
    defaultValue: Glo
  - name: color
    singleValue: false
    xpath: //span[@data-ui-id="page-title-wrapper"]/@colors | //span[contains(text(),'Colore')]//parent::div//following-sibling::div[1]//button//@title
  - name: name
    singleValue: true
    xpath: //h1[contains(@class, "title")]
  - name: reviewCount
    singleValue: true
    # regExp: (.+)\s?recensioni
    # regExpReplace: $1
    # xpath: //span[@itemprop="reviewCount"]
    xpath: //span[contains(@class, "reviewsNumber")]
    regExp: (\d+)
    regExpReplace: $1
  - name: reviewsUrl
    singleValue: true
    xpath: //meta[@property="content-path"]/@content
    # regExp: (.+)(shop)(.+)
    # regExpReplace: https://www.discoverglo.com/it/it/shop$3
    # xpath: //link[@rel="canonical"]/@href
    # regExp: (.+)
    # regExpReplace: $1#product-review-container
  - name: sku
    singleValue: true
    # xpath: //form/@data-product-sku
    xpath: //bat-producthero-gloit/@data-model
    regExp: sku":"(\d+)(.+)
    regExpReplace: $1
  - name: pageTitle
    singleValue: true
    xpath: //head//title
  - name: category
    singleValue: false
    defaultValue: null
    # xpath: //link[@rel="canonical"]/@category
  - name: skuReviews
    xpath: //bat-reviewslist-gloit/@data-model
    regExp: (.+)sku":"(.+)(","slotHTML".+)
    regExpReplace: $2

singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[contains(@class, 'product_title')]
  - name: listing_id
    xpath: //span[@class='sku']
  - name: offer_price
    xpath: (//span[contains(@class, 'woocommerce-Price-amount amount')])[2]
    regExp: '[\d,]+(?:\.\d+)?'
  - name: original_price
    xpath: (//span[contains(@class, 'woocommerce-Price-amount amount')])[1]
    regExp: '[\d,]+(?:\.\d+)?'
  - name: platform_category
    xpath: (//div[contains(@class, 'la-breadcrumb-content')]//div[contains(@class, 'la-breadcrumb-item')]//a)[last()]
#  - name: product_variations
#    xpath: //img[contains(@data-nimg, 'fill') and not(@draggable)]/ancestor::a[1]/@href
  - name: stock_availability
    xpath: //p[contains(@class, 'stock')]
  - name: main_image
#    xpath: (//img[contains(@role, 'presentation')]/@src)[1]
    xpath: (//div[contains(@class, 'woocommerce-product-gallery__image')])[1]//a/@href
    downloadContent: 'text'
  - name: alternative_images
#    xpath: (//img[contains(@role, 'presentation')])[position()>1]/@src
    xpath: (//div[contains(@class, 'woocommerce-product-gallery__image')])[position()>1]//a/@href
  - name: description
    xpath: (//div[contains(@class, 'tab-content')])[1] | //div[contains(@class, 'woocommerce-product-details__short-description')]

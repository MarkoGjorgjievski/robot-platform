singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //header/h1
  - name: listing_id
    xpath: //header/span
  - name: original_price
    xpath: //div[contains(@class, "originalPrice")]
  - name: offer_price
    xpath: //div[contains(@class, "newPrice")]
  - name: platform-category
    xpath: //div[contains(@class, "content-wrap")]/div[contains(@class, "text-sm")]/a[last()]/text()
  - name: product_variations
    xpath: //a[contains(@class, "pattern")]/@href
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://www.decodom.sk$1'
  - name: stock_availability
    defaultValue: '1'
  - name: main_image
    xpath: //div[contains(@class, "w-full")]/div/div[1]/img[1]/@src
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://www.decodom.sk$1'
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class, "w-full")]/div/div[1]/a/img/@src
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://www.decodom.sk$1'
  - name: description
    xpath: //div[@id='information']//h3[contains(text(), 'Popis')]/.././div[contains(@class, "prose")]
  - name: dimensions_unit
    default: cm
  - name: width
    xpath: //ul[preceding-sibling::h3[contains(., 'Rozmery')] or following-sibling::h3[contains(., 'Rozmery')]]/li[contains(text(), "Šírka")] | //div[label[text()='Rozmery']]/select/option[@selected="selected"]
  - name: height
    xpath: //ul[preceding-sibling::h3[contains(., 'Rozmery')] or following-sibling::h3[contains(., 'Rozmery')]]/li[contains(text(), "Výška")] | //div[label[text()='Rozmery']]/select/option[@selected="selected"]
  - name: depth
    xpath: //ul[preceding-sibling::h3[contains(., 'Rozmery')] or following-sibling::h3[contains(., 'Rozmery')]]/li[contains(text(), "Hĺbka")] | //div[label[text()='Rozmery']]/select/option[@selected="selected"]
  - name: weight_unit
    defaultValue: kg
  - name: weight_raw
    xpath: //ul[preceding-sibling::h3[contains(., 'Rozmery')] or following-sibling::h3[contains(., 'Rozmery')]]/li[contains(text(), "Hmotnosť")]
  - name: materials
    xpath: //ul[preceding-sibling::h3[contains(., 'Technic')] or following-sibling::h3[contains(., 'Technica')]]/li[contains(text(), "Materi")] | //div[label[text()='Materiál']]/select/option[@selected="selected"]
  - name: colour
    xpath: //span[contains(., 'Farba')]/../span[2]
  - name: product_details
    xpath: //div[@id='information']//h3[contains(text(), 'Technick')]/../.././/p | //div[@id='information']//h3[contains(text(), 'Technick')]/../.././/ul
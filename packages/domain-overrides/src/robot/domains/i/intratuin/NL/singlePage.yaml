singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1//span[@data-ui-id='page-title-wrapper']//text()
  - name: listing_id
    xpath: //div[contains(@class,'main')]//td[text()='EAN']//..//td[2]//text()
  - name: offer_price
    xpath: //div[@class='product-info-line']//span[contains(@class,'special-price')]//span[@data-price-type='finalPrice']//@data-price-amount
  - name: original_price
    xpath: //div[@class='product-info-line']//span[contains(@class,'old-price')]//span[@data-price-type='oldPrice']//@data-price-amount | //div[@class='product-info-line']//span[contains(@class,'final_price')]//span[@data-price-type='finalPrice']//@data-price-amount
  - name: platform_category
    xpath: //div[contains(@class,'breadcrumbs')]//ul//li[descendant::a][last()]
  - name: stock_availability
    xpath: //div[contains(@class,'box-tocart')]//button[not(@disabled)]//text()
    defaultValue: 'false'
  - name: main_image
    xpath: //div[contains(@class,'gallery-placeholder hidden-gallery')]//div[contains(@class,'fotorama__nav__frame')][position()=1]//img//@src | //div[contains(@class,'gallery-placeholder hidden-gallery')]//div[contains(@class,'fotorama__stage__frame')][position()=1]//img//@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@class,'gallery-placeholder hidden-gallery')]//div[contains(@class,'fotorama__nav__frame')][position()!=1]//img//@src
  - name: description
    xpath: //div[contains(@class,'main')]//div[contains(@class,'product attribute description')]//div[contains(@class,'value')]//text()
  - name: pack_size
    defaultValue: '1'
  - name: user_reviews
    xpath: //span[contains(@class,'average-score-users')]
    regExp: \d+
    defaultValue: 0
  - name: average_rating
    xpath: //div[@class='average-score']
    defaultValue: 0
  - name: dimensions_unit
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Afmetingen')]
    regExp: Afmetingen \(([a-z]+)\)
    regExpReplace: $1
  - name: height
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Hoogte ')]//..//td[2]//text()
  - name: length
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Lengte')]//..//td[2]//text()
  - name: diameter
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Diameter')]//..//td[2]//text()
  - name: width
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Breedte ')]//..//td[2]//text()
  - name: weight_unit
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Gewicht')]
    regExp: Gewicht \(([a-z]+)\)
    regExpReplace: $1
  - name: weight_raw
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Gewicht')]//..//td[2]//text()
  - name: materials
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Materiaal')]//..//td[2]//text()
  - name: colour
    xpath: //div[contains(@class,'main')]//td[contains(text(),'Kleur')]//..//td[2]//text()
  - name: product_details
    xpath: //div[contains(@class,'main')]//tbody//tr[position()!=1]

    # jq: jq | filter
    # regExp: (reg)*p
    # regExpReplace: website$1$2
    # defaultValue: hardcoded value if nothing matches
    # manualSelector: css#selector
    # type: NUMBER | BOOLEAN | STRING (default if omitted)

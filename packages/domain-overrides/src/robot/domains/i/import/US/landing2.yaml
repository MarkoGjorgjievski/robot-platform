singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: subTemplate
    xpath: //pre[starts-with(text(),'{"error":')][contains(text(),"brand.naver.com/main/products")]
    regExpReplace: /window-products/main/{id}?subdomain=shopping&attempts=2&NID_AUT={otherCookieNIDAUT}&NID_SES={otherCookieNIDSES}
    regExp: .*
    defaultValue: /{brandFailedURL}?subdomain={subdomainVariant}&attempts=2&NID_AUT={smartstoreCookieNIDAUT}&NID_SES={smartstoreCookieNIDSES}
  - name: subdomainVariant
    xpath: //pre[starts-with(text(),'{"error":')][contains(text(),"-307)")][./ancestor::html/head/link[contains(@id,"addedURL")][contains(@href,"level=1")]]
    regExpReplace: brand
    regExp: .*
    defaultValue: smartstore
  - name: smartstoreFailedURL
    xpath: //pre[starts-with(text(),'{"error":')][contains(text(),"smartstore.naver.com")][contains(text(),"404)")][./ancestor::html/head/link[contains(@id,"addedURL")][contains(@href,"level=2")]]
  - name: brandFailedURL
    xpath: //pre[starts-with(text(),'{"error":')][contains(text(),".naver.com")][./ancestor::html/head/link[contains(@id,"addedURL")][contains(@href,"level=1")]]
    regExp: (?<=naver\.com\/)[^']+
  - name: secondFailedURL
    xpath: //pre[starts-with(text(),'{"error":')][contains(text(),".naver.com")][./ancestor::html/head/link[contains(@id,"addedURL")][contains(@depth,"1")]]
    regExp: (?<=naver\.com\/)[^']+
  - name: productNo
    xpath: //pre
    regExp: '(?<=productNo":\s?")[^"]+(?=",\s?"channel)'
  - name: channel
    xpath: //pre
    regExp: '(?<=channel":\s?")[^"]+'
  - name: category
    xpath: //pre
    regExp: '(?<=category":\s?")[^"]+'
  - name: details
    xpath: //pre
    regExp: '(?<=details":\s?).*(?=,\s?"productBenefitsAll)'
  - name: productBenefitsAll
    xpath: //pre
    regExp: '(?<=productBenefitsAll":\s?).*(?=,\s?"benefitsByProducts")'
  - name: benefitsByProducts
    xpath: //pre
    regExp: '(?<=benefitsByProducts":\s?).*(?=,\s?"optimizeBenefitsMain")'
  - name: optimizeBenefitsMain
    xpath: //pre
    regExp: '(?<=optimizeBenefitsMain":\s?).*(?=,\s?"optimizeBenefitsMainRequest)'
  - name: optimizeBenefitsMainRequest
    xpath: //pre
    regExp: '(?<=optimizeBenefitsMainRequest":\s?).*(?=,\s?"benefitsDelivery)'
  - name: benefitsDelivery
    xpath: //pre
    regExp: '(?<=benefitsDelivery":\s?).*(?=,\s?"benefitsOptions1)'
  - name: benefitsOptions1
    xpath: //pre
    regExp: '(?<=benefitsOptions1":\s?).*(?=,\s?"benefitsOptions2)'
  - name: benefitsOptions2
    xpath: //pre
    regExp: '(?<=benefitsOptions2":\s?).*(?=,\s?"optimizeBenefitsMulti)'
  - name: optimizeBenefitsMulti
    xpath: //pre
    regExp: '(?<=optimizeBenefitsMulti":\s?).*(?=,\s?"benefitsMain)'
  # - name: benefitsMain
  # - name: benefits
  - name: inflowBenefits
    xpath: //pre
    regExp: '(?<=inflowBenefits":\s?).*(?=,\s?"gradeBenefits)'
  - name: gradeBenefits
    xpath: //pre
    regExp: '(?<=gradeBenefits":\s?).*(?=,\s?"benefitsCount)'
  - name: benefitsCount
    xpath: //pre
    regExp: '(?<=benefitsCount":\s?).*(?=,\s?"naverID)'
  - name: naverId
    xpath: //pre
    regExp: '(?<=naverID":\s?").*(?=",\s?"NNB)'
  - name: NNB
    xpath: //pre
    regExp: '(?<=NNB":\s?").*(?="})'
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //*[contains(@id, "passedInputs")]
fields:
  - name: id
    xpath: //text()
    regExp: (?<=\/)\d+(?=["\?])
  - name: input
    xpath: //text()
  - name: url
    xpath: //text()
    jq: .competitorurl // .productURL
  - name: cookieNIDAUT
    xpath: ancestor::html//*[@id="added_cookies"]//text()
    jq: 'map(select(.name=="NID_AUT"))[0].value'
  - name: cookieNIDSES
    xpath: ancestor::html//*[@id="added_cookies"]//text()
    jq: 'map(select(.name=="NID_SES"))[0].value'
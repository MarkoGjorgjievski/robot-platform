singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //meta[@name='og:title']//@content

  - name: listing_id
    xpath: //div[contains(@class, 'pip-product__left-bottom-container')]//span[contains(@class,'pip-product-identifier__value')]//text()

  - name: offer_price
    xpath: //*[contains(@class,'js-price-package')]//span[contains(@class,'pip-temp-price-module__current-price')]//span[contains(@class, 'pip-temp-price__sr-text')] | //em//span[contains(@class, 'pip-temp-price__sr-text')]
    regExp: \d+\,*\d*
    defaultValue: 0

  - name: original_price
    xpath: //*[contains(@class,'js-price-package')]//div[contains(@class,'pip-temp-price-module__addons')]//span[contains(@class, 'pip-temp-price__sr-text')] | //*[contains(@class,'js-price-package')]//span[contains(@class,'pip-temp-price-module__comparison-price')]//span[contains(@class,'pip-temp-price__sr-text')]
    regExp: \d+\,*\d*
    defaultValue: '-1'

  - name: platform_category
    xpath: //div[contains(@class,'hnf-page-container--breadcrumb')]//ol//li[position()>last()-2 and position()<last()]//span//text()

  - name: product_variations
    xpath: //a[contains(@class,'pip-product-styles__link')]//@href
    defaultValue: null

  - name: stock_availability
    xpath: //button[contains(@class,'pip-delivery-section')]//span[contains(@class,'pip-status__label')]//text()
    defaultValue: 'true'

  - name: main_image
    # xpath: //div[@id='pip-media-1']//img//@src
    xpath: (//div[contains(@class, 'js-product-gallery')]//div[contains(@class, 'pip-product-gallery__main-section')]//img)[1]/@src
    downloadContent: 'text'

  - name: alternative_images
    # xpath: //div[contains(@id,'pip-media')][position()>1]//img//@src
    xpath: //div[contains(@class, 'js-product-gallery')]//div[@class="pip-product-gallery__thumbnails"]//img/@src
    defaultValue: []

  - name: description
    xpath: //p[contains(@class, 'pip-product-summary__description')]//text()
  - name: pack_size
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Quantité/paquet')]/../text()
    # xpath: //*[contains(text(), 'Ce produit se compose')]
    defaultValue: 1
    regExp: \d+

  - name: user_reviews
    xpath: //div[contains(@class,'pip-price-package')]//span[contains(@class,'pip-rating__label')]//text()
    regExp: \d+
    defaultValue: 0

  - name: average_rating
    xpath: //div[contains(@class,'pip-product__subgrid product-pip js-product-pip')]//@data-hydration-props
    jq: '.pipPriceModule.productReviewsProps.averageRatingProps.rating'
    defaultValue: 0

  - name: dimensions_unit
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Longueur')]/../text()
    defaultValue: 'cm'
    regExp: ([a-z]+)
    regExpReplace: $1

  - name: height
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Hauteur')]/../text()
    # xpath: (//span[contains(text(),'Hauteur')]/../text())[1]
    regExp: \d+\.*\d*

  - name: length
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Longueur')]/../text()
    # xpath: (//span[contains(text(),'Longueur')]/../text())[1]
    regExp: \d+\.*\d*

  - name: width
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Largeur')]/../text()
    # xpath: (//span[contains(text(),'Largeur')]/../text())[1]
    regExp: \d+\.*\d*

  - name: depth
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Profondeur')]/../text()
    # xpath: (//span[contains(text(),'Profondeur')]/../text())[1]
    regExp: \d+\.*\d*

  - name: diameter
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Diamètre')]/../text()
    # xpath: (//span[contains(text(),'Diamètre')]/../text())[1]
    regExp: \d+\.*\d*

  - name: weight_unit
    xpath: //span[contains(text(),'Poids')]/../text()
    regExp: ([a-z]+)
    regExpReplace: $1

  - name: weight_raw
    xpath: //span[contains(text(),'Poids')]/../text()
    regExp: \d+\.*\d*

  - name: materials
    xpath: //div[contains(@class,'pip-accordion__content--inner')][.//span[contains(@class,'pip-product-details__material-header')]]//dl[not(.//dt)]//dd | //div[@class='pip-product-details']//span[contains(text(), "Matériau")]/parent::*//div[not(./preceding-sibling::span[contains(text(), "Entretien")])]/dl
    # //div[@class='pip-product-details']//span[contains(text(), "Matériau")]/parent::*//div[not(./preceding-sibling::span[contains(text(), "Entretien")])]


  - name: materialsLeft
    xpath: //div[contains(@class,'pip-product-details__container')][.//span[contains(@class,'pip-product-details__material-sub-header')]]//span[contains(@class,'pip-product-details__material-sub-header')] | //div[contains(@class,'pip-accordion__content--inner')][.//span[contains(@class,'pip-product-details__material-header')]]//dl//dt
    regExp: '(.+):'
    regExpReplace: $1
  - name: materialsRight
    xpath: //div[contains(@class,'pip-product-details__container')][.//span[contains(@class,'pip-product-details__material-sub-header')]]//dd | //div[contains(@class,'pip-accordion__content--inner')][.//span[contains(@class,'pip-product-details__material-header')]]//dl//dd

  - name: colour
    xpath: (//span[contains(@class, 'description-text')])[1] 

  - name: product_details
    xpath: //div[contains(@class,'pip-product-details__container')]/p//text()

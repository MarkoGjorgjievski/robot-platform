singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: '//div[contains(@class,"mastercard__image")]'
fields:
  - name: 'productURLs'
    xpath: //a[contains(@class, 'product__image-link')]/@href
  - name: 'productURL'
    defaultValue: 'dummy'
  - name: 'totalProduct'
    xpath: 'ancestor::html//progress/@max'
    defaultValue: 10

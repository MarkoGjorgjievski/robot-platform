singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: '//span[contains(@class, "pip-header-section__title--big")]'    

  - name: 'listing_id'
    xpath: '(//span[contains(@class, "pip-product-identifier__value")])[1]'    

  - name: 'offer_price'
    xpath: '(//div[contains(@class, "pip-product__buy-module-container")]//span[contains(@class, "pip-temp-price__integer")])[2]'
    defaultValue: null

  - name: 'original_price'   
    xpath: '(//div[contains(@class, "pip-product__buy-module-container")]//span[contains(@class, "pip-temp-price__integer")])[1]'

  - name: 'platform_category' 
    xpath: "//ol[contains(@class, 'breadcrumb')]//li[last()-1]/a/span"     

  - name: 'product_variations'
    xpath: '//div[@class="pip-product-styles__style-picker"]//a/@href'
    defaultValue: null 

  - name: 'stock_availability'
    xpath: "" 
    defaultValue: 'yes'  

  - name: 'main_image'
    xpath: '//div[@data-type="MAIN_PRODUCT_IMAGE" or @data-type="INSPIRATIONAL_IMAGE"][1]//img/@src'   
    downloadContent: 'text'

  - name: 'alternative_images'
    xpath: '//button[@class="pip-media-grid__image-button"]/span/img/@src'  

  - name: 'description'
    xpath:  '//p[contains(@class, "pip-product-summary__description")]'  

  - name: 'pack_size'
    xpath: '(//*[contains(text(), "Package quantity")])[1]/following-sibling::text()[1]'  
    defaultValue: 1

  - name: 'user_reviews'
    xpath: '//div[@id="pip-buy-module-content"]//span[@class="pip-rating__label"]//text()'
    defaultValue: '0'    

  - name: 'average_rating'
    xpath: '//div[@data-product-rating]/@data-product-rating'
    defaultValue: null 

  - name: 'dimensions_unit'
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Height')]/../text() | //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Width')]/../text() | //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Length')]/../text()
    defaultValue: 'cm'  

  - name: height
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Height:') or contains(text(), 'height')]/../text()
    regExp: \d+\.*\d*

  - name: length
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Length:') or contains(text(), 'length')]/../text()
    regExp: \d+\.*\d*

  - name: width
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Width:') or contains(text(), 'width')]/../text()
    regExp: \d+\.*\d*

  - name: depth
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Depth:') or contains(text(), 'depth')]/../text()
    regExp: \d+\.*\d*

  - name: diameter
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Diameter:') or contains(text(), 'diameter')]/../text()
    regExp: \d+\.*\d*

  - name: 'weight_unit'
    defaultValue: 'kg'

  - name: 'weight_raw'
    xpath: //div[contains(@class,'product-dimensions__measurement-container')]//span[contains(text(), "Weight")]/following-sibling::text()

  - name: 'volume'
    xpath: '(//*[contains(text(), "Volume")])[1]/following-sibling::text()[1]'  

  - name: 'materials'
    xpath: //div[contains(@class, 'pip-product-details__container')]//dl//dt[not(contains(text(), 'Comfort filling:'))]/parent::dl|//div[span[contains(@class, 'pip-product-details__material-header')]]//dd

  - name: 'colour'
    xpath: //div[contains(@class,'js-price-package')]//span[contains(@class,'pip-header-section__description-text')]//text()

  - name: 'product_details'
    xpath: '//p[@class="pip-product-details__paragraph"]'

singleRecord: true
regionsSelector: null
recordSelector: null
# recordXPath: null
fields:

  - name: 'product_title'
    xpath: //*[contains(@class, "pip-header-section__title--big")]

  - name: 'listing_id'
    xpath: (//span[contains(@class, 'pip-product-identifier__value')])[1]

  - name: 'offer_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[2]
    regExp: '([0-9]+([.,]?[0-9]{0,2})?)'
    regExpReplace: '$1'

  - name: 'original_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[1]
    regExp: '([0-9]+([.,]?[0-9]{0,2})?)'
    regExpReplace: '$1'

  - name: 'platform_category'
    xpath: //ol[contains(@class, 'breadcrumb')]//li[last()]

  - name: 'product_variations'
    xpath: (//*[contains(@class, 'rec-product-fragment--no-bottom-padding')]//@href)[position() mod 2 = 1]

  - name: 'stock_availability'
    xpath: 
    defaultValue: 'yes'

  - name: 'main_image'
    xpath: (//span[contains(@class, 'main')]/img/@src)[1]
    downloadContent: 'text'
    
  - name: 'alternative_images'
    xpath: (//span[contains(@class, 'pip-media-grid')]/img/@src)[position() > 1]

  - name: 'description'
    xpath: //*[contains(@class, 'pip-product-summary__description')]

  - name: 'pack_size'
    xpath: //span[contains(@class, 'pip-product-dimensions__measurement-value')]
    regExp: '(\d+)'

  - name: 'user_reviews'
    xpath: (//*[contains(@class, "pip-rating__label")])[1]

  - name: 'average_rating'
    xpath: //div[@data-product-rating]/@data-product-rating

  - name: 'dimensions_unit'
    xpath: (//*[contains(text(), "Width")])[1]/following-sibling::text()[1]

  - name: 'height'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Altura') or contains(text(), 'Height')]/following-sibling::text()[1]
    regExp: '(\d+)' 

  - name: 'diameter'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Diámetro') or contains(text(), 'Diameter')]/following-sibling::text()[1]
    regExp: '(\d+)'  

  - name: 'depth'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Fondo') or contains(text(), 'Depth')]/following-sibling::text()[1]
    regExp: '(\d+)'

  - name: 'width'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Ancho') or contains(text(), 'Width')]/following-sibling::text()[1]
    regExp: '(\d+)'

  - name: 'length'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Longitud') or contains(text(), 'Length')]/following-sibling::text()[1]
    regExp: '(\d+)'

  - name: 'weight_unit'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Peso') or contains(text(), 'Weight')]/following-sibling::text()[1]

  - name: 'weight_raw'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Peso') or contains(text(), 'Weight')]/following-sibling::text()[1]
    regExp: '(\d+)'

  - name: 'materials'
    xpath: //div[contains(@class, 'pip-product-details__container')]//dl

  - name: 'colour'
    xpath: (//span[contains(@class, 'description-text')])[1]  

  - name: 'product_details'
    xpath: //div[contains(@class, 'pip-product-details__container')]



  

    
    
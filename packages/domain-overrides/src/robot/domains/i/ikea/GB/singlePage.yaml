singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //meta[@name='og:title']//@content
  - name: listing_id
    xpath: //div[contains(@class, 'pip-product__left-bottom-container')]//span[contains(@class,'pip-product-identifier__value')]//text()
  - name: offer_price
    xpath: //*[contains(@class,'js-price-package')]//span[contains(@class,'pip-temp-price-module__current-price')]//span[contains(@class, 'pip-temp-price__sr-text')] | //em//span[contains(@class, 'pip-temp-price__sr-text')]
    regExp: \d+\.*\d*
    defaultValue: 0
  - name: original_price
    xpath: //*[contains(@class,'js-price-package')]//div[contains(@class,'pip-temp-price-module__addons')]//span[contains(@class, 'pip-temp-price__sr-text')] |  //*[contains(@class,'js-price-package')]//span[contains(@class,'pip-temp-price-module__comparison-price')]//span[contains(@class,'pip-temp-price__sr-text')]
    regExp: \d+\.*\d*
    defaultValue: '-1'
  - name: platform_category
    xpath: //ol//li[position()>last()-2 and position()<last()]//span//text()
  - name: product_variations
    xpath: //a[contains(@class,'pip-product-styles__link')]//@href
    defaultValue: null
  - name: stock_availability
    xpath: //button[contains(@class,'pip-delivery-section')]//span[contains(@class,'pip-status__label')]//text()
    defaultValue: 'true'
  - name: main_image
    xpath: //div[@id='pip-media-1']//img//@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[contains(@id,'pip-media')][position()>1]//img//@src
  - name: description
    xpath: //p[contains(@class, 'pip-product-summary__description')]//text()
  - name: pack_size
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Package quantity')]/../text()
    regExp: \d+
  - name: user_reviews
    xpath: //div[contains(@class,'pip-price-package')]//span[contains(@class,'pip-rating__label')]//text()
    regExp: \d+
    defaultValue: 0
  - name: average_rating
    xpath: //div[contains(@class,'pip-product__subgrid product-pip js-product-pip')]//@data-hydration-props
    jq: '.pipPriceModule.productReviewsProps.averageRatingProps.rating'
    defaultValue: 0
  - name: dimensions_unit
    xpath: //span[contains(text(),'Height')]/../text()
    regExp: ([a-z]+)
    regExpReplace: $1
    defaultValue: 'cm'
  - name: height
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Height')]/../text()
    regExp: \d+\.*\d*
  - name: length
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Length')]/../text()
    regExp: \d+\.*\d*
  - name: width
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Width')]/../text()
    regExp: \d+\.*\d*
  - name: depth
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Depth')]/../text()
    regExp: \d+\.*\d*
  - name: diameter
    xpath: //*[contains(@class,'pip-product-dimensions__dimensions-container')]//span[contains(text(),'Diameter')]/../text()
    regExp: \d+\.*\d*
  - name: weight_unit
    xpath: //span[contains(text(),'Weight')]/../text()
    regExp: ([a-z]+)
    regExpReplace: $1
  - name: weight_raw
    xpath: //span[contains(text(),'Weight')]/../text()
    regExp: \d+\.*\d*
  - name: materials
    xpath: //div[contains(@class, 'pip-product-details__container')]//dl//dt[not(contains(text(), 'Comfort filling:'))]/parent::dl
  - name: colour
    xpath: //div[contains(@class,'js-price-package')]//span[contains(@class,'pip-header-section__description-text')]//text()
  - name: product_details
    xpath: //div[contains(@class,'pip-product-details__container')]/p//text()
    # jq: jq | filter
    # regExp: (reg)*p
    # regExpReplace: website$1$2
    # defaultValue: hardcoded value if nothing matches
    # manualSelector: css#selector
    # type: NUMBER | BOOLEAN | STRING (default if omitted)

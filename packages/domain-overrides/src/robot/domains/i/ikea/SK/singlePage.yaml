singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //*[contains(@class, "pip-header-section__title--big")]

  - name: 'listing_id'
    xpath: (//span[contains(@class, 'pip-product-identifier__value')])[1]

  - name: 'offer_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[2]
    regExp: '([0-9]+([.,]?[0-9]{0,2})?)'
    regExpReplace: '$1'

  - name: 'original_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[1]
    regExp: '([0-9]+([.,]?[0-9]{0,2})?)'
    regExpReplace: '$1'

  - name: 'platform_category'
    xpath: //ol[contains(@class, 'breadcrumb')]//li[last()-1]

  - name: 'product_variations'
    xpath: //*[contains(@class, 'pip-product-styles__items')]//a/@href

  - name: 'stock_availability'
    xpath: 
    defaultValue: 'yes'

  - name: 'main_image'
    xpath: (//span[contains(@class, 'main')]/img/@src)[1]
    downloadContent: 'text'

  - name: 'alternative_images'
    xpath: (//span[contains(@class, 'pip-media-grid')]/img/@src)[position() > 1]

  - name: 'description'
    xpath: //*[contains(@class, 'pip-product-summary__description')]
    
  - name: 'pack_size'
    xpath: //div[contains(@class, 'pip-product-dimensions__package-count')]
    regExp: '(\d+)'
    defaultValue: 1

  - name: 'user_reviews'
    xpath: (//*[contains(@class, "pip-rating__label")])[1]

  - name: 'average_rating'
    xpath: //div[@data-product-rating]/@data-product-rating

  - name: 'dimensions_unit'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Šírka') or contains(text(), 'Výška')]/following-sibling::text())[1]
    regExp: '[A-Za-z]+'

  - name: 'width'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Šírka')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'

  - name: 'height'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Výška')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'

  - name: 'length'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Dĺžka')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'

  - name: 'depth'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Hĺbka')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'

  - name: 'diameter'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Priemer')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'
  
  - name: 'weight_raw'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Hmotnosť')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'
  
  - name: 'weight_unit'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Hmotnosť')]/following-sibling::text())[1]
    regExp: '[A-Za-z]+'

  - name: 'volume'
    xpath: (//p[contains(@class, 'pip-product-dimensions__measurement-wrapper')]/span[contains(text(), 'Objem')]/following-sibling::text())[1]
    regExp: '[0-9,.]+'

  - name: 'materials'
    xpath: //div[contains(@class, 'pip-product-details__container')]//dl

  - name: 'colour'
    xpath: //div[@class="pip-product-styles__style-picker"]//span[@class="pip-list-view-item__addon"]
  
  - name: 'product_details'
    xpath: //div[contains(@class, 'pip-product-details__container')]
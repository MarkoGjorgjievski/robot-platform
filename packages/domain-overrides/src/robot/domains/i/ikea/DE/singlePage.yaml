singleRecord: true
regionsSelector: null
recordSelector: null
# recordXPath: '//div[contains(@class, "pip-page-container")]'
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //*[contains(@class, "js-price-package pip-price-package")]//*[contains(@class, "pip-header-section__container-text")]

  - name: 'listing_id'
    xpath: (//span[contains(@class, 'pip-product-identifier__value')])[1]
  
  - name: 'offer_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[2]
    regExp: '([0-9]+([.,]?[0-9]{0,2})?)'
    regExpReplace: '$1'

  - name: 'original_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[1]
    regExp: '([0-9]+([.,]?[0-9]{0,2})?)'
    regExpReplace: '$1'
  
  - name: 'platform_category'
    xpath: //ol[contains(@class, 'breadcrumb')]//li[last()]//following-sibling::text()[1]
  
  - name: 'product_variations'
    xpath: //a[contains(@class,'pip-product-styles__link')]//@href
  
  - name: 'stock_availability'
    xpath: 
    defaultValue: 'yes'

  - name: 'main_image'    
    xpath: (//span[contains(@class, 'main')]/img/@src)[1]
    downloadContent: 'text'
  
  - name: 'alternative_images'
    xpath: (//*[contains(@class, 'product-gallery__media')]//img/@src)[position() > 1]

  - name: 'description'
    xpath: //*[contains(@class, "pip-product-summary__description")]

  

  - name: 'pack_size'
    # defaultValue: 'null'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Anzahl')]/following-sibling::text()[1]
    regExp: '(\d+)'
    regExpReplace: $1


  # - name: 'pack_size_backup'
  #   xpath: //ol[contains(@class, 'breadcrumb')]//li[last()]//following-sibling::text()[1]
  #   regExp: '(\d+)-tlg'
  #   regExpReplace: $1

    # Anzahl pro Verpackung: 6 Stück
  - name: 'user_reviews'
    xpath: (//*[contains(@class, "pip-rating__label")])[1]

  - name: 'average_rating'
    xpath: //div[@data-product-rating]/@data-product-rating

  - name: 'dimensions_unit'
    xpath: (//*[contains(text(), "Breite")])[1]/following-sibling::text()[1]

  - name: 'height'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'höhe') or contains(text(), 'Höhe')]/following-sibling::text()[1]
    regExp: '([\d.]+)'

  - name: 'diameter'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Durchmesser') or contains(text(), 'Ø')]/following-sibling::text()[1]
    regExp: '([\d.]+)'

  - name: 'depth'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Tiefe')]/following-sibling::text()[1]
    regExp: '([\d.]+)'

  - name: 'width'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Breite')]/following-sibling::text()[1]
    regExp: '([\d.]+)'

  - name: 'length'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Länge')]/following-sibling::text()[1]
    regExp: '([\d.]+)'
  
  - name: 'weight_unit'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Gewicht')]/following-sibling::text()[1]
    regExp: '(\d+(\.\d+)?)\s*(\D+)?'

  - name: 'weight_raw'
    xpath: //div[contains(@class, 'pip-product-dimensions__')]//span[contains(text(), 'Gewicht')]/following-sibling::text()[1]
    regExp: '([\d.]+)'

  - name: 'materials'
    xpath: //div[contains(@class, 'pip-product-details__container')]//dl

  - name: 'colour'
    xpath: (//span[contains(@class, 'description-text')])[1] 
  
  - name: 'product_details'
    xpath: //div[contains(@class, 'pip-product-details__container')]


    
    
    
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //*[contains(@class, "right-title-name")]

  - name: 'listing_id'
    xpath: (//span[contains(@class, 'product-identifier__value')])[1]
  
  - name: 'offer_price'
    xpath: (//div[contains(@class,"layout-right")]//div[contains(@class,'withprice-pricenum')]//div[string-length(text()) > 0])[last()]//preceding-sibling::div
    regExp: '[0-9,.]+'

  - name: 'original_price'
    xpath: (//div[contains(@class,"layout-right")]//div[contains(@class,'withprice-pricenum')]//div[string-length(text()) > 0])[last()]
    regExp: '[0-9,.]+'
  
  - name: 'platform_category'
    xpath: (//*[contains(@class, 'ivu-breadcrumb-item-link')])[last()]
  
  - name: 'product_variations'
    xpath: //*[contains(@class, 'cursorPointer')]//@href
    regExp: '(.+)'
    regExpReplace: https://www.ikea.cn$1

  - name: 'stock_availability'
    xpath: 
    defaultValue: 'yes'

  - name: 'main_image'
    xpath: //*[contains(@id, '0item1')]//img/@src
    downloadContent: 'text'
  
  - name: 'alternative_images'
    xpath: (//*[contains(@class, 'fourItem')]//img/@src)[position() > 1]

  - name: 'description'
    xpath: (//*[contains(@class, "describe-text")])[1]

  - name: 'pack_size'
    xpath: (//p[span/text()='Package quantity:']/span/text())[2]
    regExp: '(\d+)'
    defaultValue: 1

  - name: 'user_reviews'
    xpath:

  - name: 'average_rating'
    xpath: 

  - name: 'dimensions_unit'
    xpath: (//p[span/text()='Width:']/span/text())[2]

  - name: 'height'
    xpath: //p[span/text()='Height:']/span/text()
    regExp: '[0-9,.]+'

  - name: 'diameter'
    xpath: //p[span/text()='Diameter:']/span/text() | //p[span/text()='Shade diameter:']/span/text()
    regExp: '[0-9,.]+'

  - name: 'depth'
    xpath: //p[span/text()='Depth:']/span/text()
    regExp: '[0-9,.]+'

  - name: 'width'
    xpath: //p[span/text()='Width:']/span/text() | //p[span/text()='Mattress width:']/span/text()
    regExp: '[0-9,.]+'

  - name: 'length'
    xpath: //p[span/text()='Length:']/span/text() | //p[span/text()='Mattress length:']/span/text()
    regExp: '[0-9,.]+'
  
  - name: 'weight_unit'
    xpath: //p[span/text()='Weight:']/span/text()
    regExp: '(\d+(\.\d+)?)\s*(\D+)?'

  - name: 'volume'
    xpath: //p[span/text()='Volume:']/span/text()
    regExp: '[0-9,.]+'

  - name: 'weight_raw'
    xpath: //p[span/text()='Weight:']/span/text()
    regExp: '[0-9,.]+'

  - name: 'materials'
    xpath: //div[contains(@class, 'customer-list')]

  - name: 'colour'
    xpath: //span[@class='right-title-name']/following-sibling::span[@class='right-title-commit']/span[position() > 1][position() < last()]/text()
  
  - name: 'product_details'
    xpath:


    
    
    
singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: 'product_title'
    xpath: //*[contains(@class, "title--big")]

  - name: 'listing_id'
    xpath: (//span[contains(@class, 'pip-product-identifier__value')])[1]
  
  - name: 'offer_price'  
    xpath: (//div[contains(@class,"js-price-package")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[2]  
    regExp: '(\d+(\.\d{1,2})?)'
    regExpReplace: '$1'

  - name: 'original_price'
    xpath: (//div[contains(@class,"buy-module-content")]//div[contains(@class,"primary-currency-price")]/*[self::span or self::em])[1]
    regExp: '(\d+(\.\d{1,2})?)'
    regExpReplace: '$1'
  
  - name: 'platform_category'
    xpath: //ol[contains(@class, 'breadcrumb')]//li[last()-1]
  
  - name: 'product_variations'
    xpath: //a[contains(@class, 'pip-product-styles__link')]//@href

  - name: 'stock_availability'
    xpath: 
    defaultValue: 'yes'

  - name: 'main_image'
    xpath: (//span[contains(@class, 'media-image')]/img/@src)[1]
    downloadContent: 'text'
  
  - name: 'alternative_images'
    xpath: (//span[contains(@class, 'pip-media-grid')]/img/@src)[position() > 1]

  - name: 'description'
    xpath: //*[contains(@class, "pip-product-summary__description")]

  - name: 'pack_size'
    xpath: //div[contains(@class,'pip-product-dimensions__package-container')]//span[contains(text(), 'set of')] | //span[@class='pip-product-dimensions__measurement-name'][contains(text(), 'Package quantity')]/following-sibling::text()[1]
    regExp: '(\d+)'
    defaultValue: 1

  - name: 'user_reviews'
    xpath: (//*[contains(@class, "pip-rating__label")])[1]

  - name: 'average_rating'
    xpath: //div[@data-product-rating]/@data-product-rating

  - name: 'dimensions_unit'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Height') or contains(text(), 'Width')]/following-sibling::text()[1]

  - name: 'height'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Height')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'

  - name: 'diameter'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Diameter')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'

  - name: 'depth'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Depth')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'

  - name: 'width'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Width')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'

  - name: 'length'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Length')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'
  
  - name: 'weight_unit'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Weight')]/following-sibling::text()[1]
    regExp: '(\d+(\.\d+)?)\s*(\D+)?'

  - name: 'volume'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Volume')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'

  - name: 'weight_raw'
    xpath: //div[contains(@class, 'pip-product-dimensions__dimensions-container')]//span[contains(text(), 'Weight')]/following-sibling::text()[1]
    regExp: '[0-9,.]+'

  - name: 'materials'
    xpath: //div[contains(@class, 'pip-product-details__container')]//dl

  - name: 'colour'
    xpath: (//span[contains(@class, 'description-text')])[1] 
  
  - name: 'product_details'
    xpath: //div[contains(@class, 'pip-product-details__container')]


    
    
    
singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: 
fields:
- name: brandText
  singleValue: false
  xpath: "//div[@itemprop='brand']//meta[@itemprop='name']/@content"
  type: TEXT
- name: color
  singleValue: false
  description: product color
  xpath: //div[contains(@class, "colors-list")]/span[contains(@class, "color-selected")]
  type: TEXT
- name: flavour
  singleValue: false
  description: product flavour
  type: TEXT
- name: image
  singleValue: true
  description: product images
  xpath: //div[contains(@class, "product-images-wrapper")]//div[contains(@class, "product-images-wrapper")]/div[contains(@class, "swiper-container")]/div[contains(@class, "swiper-wrapper")]/div[1]//div[contains(@class, "img-wrapper")]/img/@src | //div[contains(@class, "swiper-slide-active")]/div[contains(@class, "swiper-zoom-container")]/img/@src
  type: TEXT
- name: pageTitle
  singleValue: true
  description: The product pageTitle
  xpath: "//head/title"
  type: TEXT
- name: reviewCount
  singleValue: false
  description: The product review
  xpath: (//div[@data-bv-show="reviews"]//dd[@class="bv-rating-ratio-count"]//a//text())[1] | //meta[@itemprop="reviewCount"]/@content
  type: TEXT
- name: pageOffset
  singleValue: false
  description: pageOffset
  type: TEXT
- name: sku
  singleValue: false
  description: product sku
  xpath: //@data-bv-product-id
  type: TEXT
- name: name
  xpath: //div[@class="product-content-desc"]//h1
  type: TEXT
- name: reviewsUrl
  xpath: //link[@rel='canonical']/@href
  type: TEXT
- name: subCategory
  xpath: //link[@rel='canonical']/@href
- name: category
  xpath: //link[@rel='canonical']/@href
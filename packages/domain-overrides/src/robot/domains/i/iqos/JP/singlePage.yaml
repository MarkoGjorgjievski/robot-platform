singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //html
fields:
  - name: brandText
    xpath: //div[@id='custom_brand']
    type: TEXT
  - name: color
    singleValue: false
    description: product color
    xpath: //div[@data-testing='ProductDetail_TextBody_ShortVariantName']
    type: TEXT
  - name: flavour
    singleValue: false
    description: product flavour
    type: TEXT
  - name: image 
    singleValue: false
    description: product images
    xpath: (//div[contains(@class, 'carousel-slider')]//li[contains(@class, 'selected')]//img/@src)[1]
    type: TEXT
  - name: pageTitle
    singleValue: true
    description: The product pageTitle
    xpath: //head/title
    type: TEXT
  - name: category
    singleValue: false
    description: The categories (e.g. from breadcrumbs)
    xpath: //div[@data-block-plugin-id="system_breadcrumb_block"]/nav/div/ul/li[not(contains(.,'ホーム'))][not(contains(.,'すべてをみる'))][1]
    type: TEXT
  - name: subCategory
    singleValue: false
    description: The product sub category
    xpath: //div[@data-block-plugin-id="system_breadcrumb_block"]/nav/div/ul/li[not(contains(.,'ホーム'))][not(contains(.,'すべてをみる'))][2]
    type: TEXT
  - name: reviewCount
    singleValue: false
    description: The product review
    xpath: //meta[@itemprop='reviewCount']/@content
    type: TEXT
  - name: pageOffset
    singleValue: false
    description: pageOffset
    type: TEXT
  - name: sku
    singleValue: false
    description: product sku
    xpath: //script[@type="application/ld+json"][contains(text(),"sku")]
    jq: '.offers.sku'
    type: TEXT
  - name: name
    xpath: //h3[@data-testing=\"ProductDetail_TextTitle_ProductName\"]
    type: TEXT
  - name: reviewsUrl
  - name: productId
    singleValue: false
    description: product id
    xpath: //@data-bv-product-id
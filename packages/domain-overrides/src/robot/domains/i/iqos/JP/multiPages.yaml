singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: '//div[contains(@class,"q-overflow-hidden")]//div[contains(@class,"q-pl-8")]/div | //td[@class="Results depth_0"]/table/tbody/tr'
fields:
  - name: name
    description: The title of the product
    xpath: //h6[contains(@class, 'q-leading-normal')]
  - name: productUrl
    description: The url of the product
    xpath: //a[@data-testing="ProductList_Link_Card"]/@href
  - name: reviewCount
    description: The reviewCount of the product
    xpath: //meta[@itemprop='reviewCount']/@content
  - name: sku
    description: The sku of the product
    path: "./@helpful-count"
    type: TEXT
  - name: input_brandTextN
    singleValue: false
    description: The brand of the product
    defaultValue: "IQOS"
    type: TEXT
  - name: country
    singleValue: false
    description: Location of the website
    xpath: '//td[@class="ContentLocale depth_1"]'
    type: TEXT
  - name: reviewDate
    type: DATETIME
    singleValue: false
    description: Date the review was made
    xpath: '//td[@class="SubmissionTime depth_1"]'
  - name: reviewDateRaw
    xpath: "./@review-date"
    type: TEXT
  - name: reviewRating
    singleValue: false
    description: Rating normalized to be out of 5
    xpath: '//td[@class="Rating depth_1"]'
    type: TEXT
  - name: reviewText
    singleValue: false
    description: The text of the review
    xpath: '//td[@class="ReviewText depth_1"]'
    type: TEXT
  - name: reviewTitle
    singleValue: false
    description: The title of the review
    xpath: '//td[@class="Title depth_1"]'
    type: TEXT
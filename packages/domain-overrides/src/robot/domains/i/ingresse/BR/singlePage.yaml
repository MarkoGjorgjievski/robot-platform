singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //td[contains(@class, "dateTime depth_2")]
fields:
  - name: eventName
    xpath: ./ancestor::html//td[contains(@class, "title depth_1")]
  - name: venueCity
    xpath: ./ancestor::html//td[contains(@class, "city depth_2")]
  - name: eventTime
    xpath: //text()
  - name: eventDate
    xpath: //text()
  - name: venueName
    xpath: ./ancestor::html//td[contains(@class, "place depth_1")]//td[contains(@class, "name depth_2")]
  - name: venueAddress
    xpath: ./ancestor::html//td[contains(@class, "place depth_1")]//td[contains(@class, "street depth_2")]
  - name: isPublicPurchase
    xpath: ./ancestor::html//div[@class="EventDeal"]//button[contains(@class, "btn--orange")][contains(text(), "Comprar")]
    defaultValue : 0
    regexReplace: 1
  - name: eventNote
    xpath: ./ancestor::html//td[contains(@class, "description depth_1")]
  - name: venueCountryCode
    xpath: ./ancestor::html//td[contains(@class, "country depth_2")]

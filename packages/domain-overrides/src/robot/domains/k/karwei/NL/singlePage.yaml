singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //*[contains(@class, 'pageheader js-pageheader-mobile')]//*[contains(@itemprop, 'name')] | //*[contains(@class, 'mc-pageheader  js-pageheader-mobile')]//*[contains(@itemprop, 'name')]
  
  - name: listing_id
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Productnummer')]//following-sibling::td//*[contains(@class, 'feature-value')]
  
  - name: offer_price
    xpath: //*[@itemprop = 'price']/@content
  
  - name: original_price
    xpath: //*[contains(@class, 'product-price-base')]//*[contains(@class, 'before-price')]
    defaultValue: 0
 
  - name: platform_category
    xpath: //*[contains(@itemprop, 'itemListElement')][last()]//*[contains(@itemprop, 'name')]

  - name: stock_availability
    xpath: boolean(//*[contains(@class, 'pdp-state-container')]//*[contains(@class, 'button--primary js-add-to-cart-button')])
  
  - name: main_image
    xpath: //*[contains(@class, 'pinch-zoom js-pinch-zoom js-swipeable')]//img/@src
    downloadContent: 'text'
 
  - name: alternative_images
    xpath: //*[contains(@alt, 'Thumbnail product') and not(contains(@class, 'active'))]/@src
 
  - name: description
    xpath: //*[@id = 'long-description']
 
  - name: average_rating
    xpath: //*[contains(@itemprop, "aggregateRating")]//*[contains(@itemprop, 'ratingValue')]
 
  - name: user_reviews
    xpath: //*[contains(@itemprop, "aggregateRating")]//*[contains(@itemprop, 'ratingCount')]
 
  - name: materials
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Materiaal')]//following-sibling::td//*[contains(@class, 'feature-value')]
  
  - name: colour
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Kleur')]//following-sibling::td//*[contains(@class, 'feature-value')]
 
  - name: product_details
    xpath: //*[@id = 'product-specifications-collapse']//*[contains(@class, 'collapsible-content')]
  
  - name: weight_raw
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Gewicht product')]//following-sibling::td//*[contains(@class, 'feature-value')]
  
  - name: height
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Hoogte product')]//following-sibling::td//*[contains(@class, 'feature-value')]
 
  - name: width
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Breedte product')]//following-sibling::td//*[contains(@class, 'feature-value')]
 
  - name: length
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Lengte product')]//following-sibling::td//*[contains(@class, 'feature-value')]
 
  - name: product_variations
    xpath: //*[contains(@class, 'variant-tile ') and not(contains(@class, 'selected'))]/@href | //*[contains(@class, 'base-product-option')][not(@selected)]/@data-link
    regExp: (.*)
    regExpReplace: https://www.karwei.nl$1

  - name: pack_size
    xpath: //*[contains(@class, 'attrib') and contains(text(), 'Aantal stuks')]//following-sibling::td//*[contains(@class, 'feature-value')]
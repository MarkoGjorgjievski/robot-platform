singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath: null
fields:
  - name: product_title
    xpath: //h1[contains(@class, "page-title")]/span
  - name: listing_id
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Codice")]]/div[contains(@data-bind, "value")]
  - name: original_price
    xpath: //span[contains(@class, "original_price")]/span/span/text() | //div[contains(@class, "product-info-main")]//span[contains(@class, "old-price")]/span[contains(@class, "price")]
  - name: offer_price
    xpath: //div[contains(@class, "product-info-main")]//span[contains(@class, "special-price")]/span/span
  - name: platform_category
    xpath: //ul[contains(@class, "items")]//li[contains(@class, "item product")]/strong
  - name: stock_availability
    defaultValue: '1'
  - name: main_image
    xpath: //img[contains(@alt, "main product photo")]/@src | //img[contains(@role, "presentation")]/@src
    downloadContent: 'text'
  - name: alternative_images
    xpath: //div[@data-nav-type="thumb"]//img/@src
  - name: description
    xpath: //div[contains(@class, "product-short-description")]/span
  - name: user_reviews
    xpath: //div[contains(@class, "product-data")]/a[contains(text(), "Recensioni")]/text()[2]
  - name: average_rating
    xpath: //div[contains(@class, "product-data")]//div[contains(@class, "rate")]/strong
  - name: dimensions_unit
    defaultValue: 'cm'
  - name: width
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Larghezza")]]/div[contains(@data-bind, "value")]
  - name: height
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Altezza")]]/div[contains(@data-bind, "value")]
  - name: length
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Profondit")]]/div[contains(@data-bind, "value")]
  - name: weight_unit
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Peso")]]/div[contains(@data-bind, "value")] 
    defaultValue: 'g'
  - name: weight_raw
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Peso")]]/div[contains(@data-bind, "value")] 
  - name: materials
    xpath: //div[contains(@class, "product-technical-data")][@data-bind]/div[.//*[contains(text(), "Materiale")]]
  - name: colour
    xpath: //div[contains(@class, "wrapper")]/div[contains(@class, "product-technical-data")]/div[div[contains(text(), "Colore")]]/div[contains(@data-bind, "value")] 
  - name: product_details
    xpath: //div[contains(@class, "product-technical-data")][@data-bind]/div

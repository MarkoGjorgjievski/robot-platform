singleRecord: true
regionsSelector: null
recordSelector: null
recordXPath:
fields:
  - name: eventName
    xpath: //*[@type="application/ld+json"]
    jq: .name
  - name: venueName
    xpath: //*[@type="application/ld+json"]
    jq: .location.name
  - name: venueAddress
    xpath: //*[@type="application/ld+json"]
    jq: .location.address.streetAddress
  # - name: eventTimeDescription
  #   xpath: //div[contains(@class, "description")]//text()
  - name: venueCity
    xpath: //*[@type="application/ld+json"]
    jq: .location.address.addressLocality
  - name: eventDateTimeTemp
    xpath: //*[@type="application/ld+json"]
    jq: .startDate
  # - name: eventDate
  #   xpath: (//div[contains(@class, "MuiBox-root")]//ul/li/div/span)[1]
  - name: eventTimeCheck
    xpath: (//div[contains(@class, "MuiBox-root")]//ul/li/div/span[contains(., "start")]/../span | //div[contains(@class, "MuiBox-root")]//ul/li/div/span[not(contains(., "bram"))][not(contains(., "orientacyjne"))]/../span)[last()]
  - name: isPublicPurchase
    xpath: //div[contains(@class, "MuiPaper-root")]//div[contains(@class, "MuiBox-root")]/a[contains(@class, "MuiButtonBase-root")]//text()
  - name: isDateTimeTBA
    defaultValue: "false"
  - name: eventNotes
    xpath: //div[contains(@class, "description")]//text()
  - name: venueCountryCode
    defaultValue: "PL"
  - name: firstDepthURL
    xpath: //a[contains(@class, "MuiListItem-root")]//@href
    regExp: '(\/[^"]{1,})'
    regExpReplace: 'https://goingapp.pl$1'
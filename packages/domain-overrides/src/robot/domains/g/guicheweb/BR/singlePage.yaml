singleRecord: false
regionsSelector: null
recordSelector: null
recordXPath: //div[@id="exibe_ingressos" and not(child::*)] | //div[@id="exibe_ingressos"]//*[contains(@class,"list-group-item")]
fields:
  - name: eventName
    xpath: ancestor::html//div[contains(@class,"infoevento")]/h2//text()
  - name: eventTitleTimeText
    xpath: ancestor::html//div[contains(@class,"infoevento")]/h6//text()
    regExp: (\d{2}:\d{2})
    regExpReplace: $1
  - name: eventStartDate
    xpath: ancestor::html//*[@type="application/ld+json"]//text()[contains(.,"startDate")]
    jq: '.startDate'
  - name: venueName
    xpath: ancestor::html//div[contains(@class,"infoevento")]/h5//text()
  - name: eventNotes
    xpath: ancestor::html//div[contains(@class, "infoweb-evento")]//text()
    defaultValue: ""
  - name: venueAddress
    xpath: ancestor::html//*[@type="application/ld+json"]//text()[contains(.,"streetAddress")]
    jq: '.location.address.streetAddress'
  - name: venueCity
    xpath: ancestor::html//*[@type="application/ld+json"]//text()[contains(.,"addressLocality")]
    jq: '.location.address.addressLocality'
  - name: postalCode
    xpath: ancestor::html//*[@type="application/ld+json"]//text()[contains(.,"postalCode")]
    jq: '.location.address.postalCode' 
  - name: countryCode
    defaultValue: BR
  - name: isPublicPurchase
    defaultValue: "0"
    xpath: ancestor::html//div[@id="ingressos_aba"]//h2//text()
    jq: 'if . == "NENHUM INGRESSO DISPONÍVEL PARA VENDA ONLINE" then 0 else 1 end'
  - name: eventDate
    xpath: //@onclick
    regExp: 'modal_datas\((\d{4})(\d{2})(\d{2})'
    regExpReplace: $1-$2-$3
  - name: eventTime
    xpath: //h4//b//text()
    regExp: (\d{2}:\d{2})
    regExpReplace: $1
  - name: eventDateTime
    xpath: ancestor::html//body
  
  
proxy:
  zone: GLB
policy:
  numberRetries: 3
  priority: MEDIUM
  retryDelay: 60
  backoffPolicy: EXPONENTIAL
  retryWithResidentialProxyAfter: 99
honorRobots: false
timeout: 300000
schema: robots/san-antonio
parameters:
# only use two letter iso code for the country, example: us
  - country
# only put the root domain there, do not include the top domain and only include the subdomain if it is a different website
# example netflix and not netflix.xom but app.import.io is different than workbench.import.io so use app.import instead of just "import"
  - domain
# provide the value 'singlePage' for extractor not using the rowXpath selector and 'multiPages' for extractor that do
  - schemaYAML
entryPoint: robots/san-antonio
pathTemplate: /domains/${domain[0:1]}/${domain}/${country}/san-antonio/${schemaYAML}
authentication: navigation/auth/action
